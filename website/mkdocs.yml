# MkDocs configuration for the OPHTML documentation site.
#
# The pages live in docs/site/ and are written against
# docs/site/ARCHITECTURE.md, which says they depend on no site generator.
# Everything generator-specific therefore lives here, under website/, and
# hooks.py bridges the two: it builds the navigation from each page's
# frontmatter and rewrites the `page:` and `repo:` link schemes at build
# time. The markdown in docs/site/ is read, never modified.
#
# Build:  pip install -r website/requirements.txt
#         mkdocs build --strict -f website/mkdocs.yml
# Serve:  mkdocs serve -f website/mkdocs.yml

site_name: OPHTML
site_description: Build PlayStation 2 homebrew UIs from HTML and CSS.
site_url: https://coffeedevsolutions.github.io/OPHTML/
repo_url: https://github.com/coffeedevsolutions/OPHTML
repo_name: coffeedevsolutions/OPHTML
edit_uri: edit/main/docs/site/

docs_dir: ../docs/site
site_dir: build

# Build inputs that sit beside the pages but are not pages. The
# underscore directories hold the per-page briefs and facts files, and
# ARCHITECTURE.md is the authoring contract. Everything else under
# assets/ (screenshots, the demo projects the pages cite) is published
# as static files.
exclude_docs: |
  ARCHITECTURE.md
  _citations.tsv
  _facts/
  _prompts/
  assets/README.md
  assets/assets.json

# nav is generated by hooks.py from the section and order frontmatter
# fields, so adding a page to docs/site/ needs no change here.

hooks:
  - hooks.py

theme:
  name: material
  # Only overrides/main.html, and only to stop the home page's <title>
  # from repeating the site name. See the comment in that file.
  custom_dir: overrides
  # System fonts: no request to Google Fonts from a reader's browser.
  font: false
  icon:
    logo: material/television-classic
    repo: fontawesome/brands/github
  favicon: static/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.action.view

extra_css:
  - static/extra.css

markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 3
  - tables
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

# Every warning here fails the workflow's --strict build, so a link to a
# missing page or an image that is not in the tree cannot ship as a dead
# link. Anchors are the one exception: tools/check-site-pages.py already
# fails CI when a page: link names a missing heading, and a plain
# same-page #anchor that drifted is a page defect to fix in docs/site/,
# not a reason to hold a deploy. The build still reports each one as an
# INFO line.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: info
    absolute_links: warn
    unrecognized_links: warn
