# The findings ledger. Prose renders to docs/findings.md; the graph is
# enforced by tools/check-findings.py in CI.
#
# A finding is a claim with a FALSIFIER. If nothing could kill it, it is
# an opinion and this file will refuse it -- the belief that a +0.5
# texel bias was wrong survived months and four pull requests precisely
# because nobody had written down what would cheaply end it.
#
# status:  provisional  believed, phase still open
#          confirmed    measured, phase locked
#          overturned   killed; must name what killed it
#          stale        a dependency died; needs re-examination
#
# Overturning something in a later phase mechanically stales every
# finding that depends on it. That is the point of the file.

phases:
  0: {title: "Verify the metal", locked: true}
  1: {title: "One resource model", locked: true}
  2: {title: "Prove it with the OPL-class app", locked: true}
  3: {title: "Spend the hardware", locked: false}

findings:

# ---------------------------------------------------------------- GS
- id: F-001
  phase: 0
  status: confirmed
  claim: "GS alpha is a 0..128 domain: 0x80 is opaque, not 0xFF"
  evidence:
    instrument: docs/bringup.md
    measurement: >-
      Blend is Cv = (Cs-Cd)*As>>7 + Cd. Corroborated on the shipped
      blob: 0 of 513 probe-screen TEXQUAD channels exceed 0x80, so
      0x80 -> 255 under modulate is exact rather than a clamp.
  falsifier: "A TEXQUAD at As=0x80 that composites to anything but full coverage"
  note: >-
    Art authored at 255 alpha asks for about twice the coverage it has.
  refs: ["#28"]

- id: F-002
  phase: 0
  status: confirmed
  claim: "gsKit's default ALPHA runs the blend backwards"
  evidence:
    instrument: docs/bringup.md
    measurement: >-
      Default GS_BLEND_BACK2FRONT (0x01) gives A=Cd B=Cs C=As D=Cs,
      i.e. effective coverage 128-As. Solved back from each rendered
      ladder swatch on a SCPH-50000 and under Play!, exact on every
      rung. 0x40 was the only clean rung -- the single alpha where
      128-As == As -- which a frame that merely "looked wrong" would
      never have singled out.
  falsifier: "A default-state blend where coverage tracks As rather than 128-As"
  depends_on: [F-001]
  note: >-
    Two corollaries that cost time. The fix must run EVERY FRAME,
    because GS blend state is global and survives your frame: an early
    two-ladder capture showed both ladders clean because the fix
    persisted into frame 2 and the test was comparing itself against
    itself. And it must go through gsKit_set_primalpha -- assigning
    gs->PrimAlpha does not emit the register, which was identified by
    two ladders coming back byte-identical.
  refs: ["#28", "#30"]

- id: F-003
  phase: 0
  status: confirmed
  claim: "A misaligned DMA source is truncated, not faulted"
  evidence:
    instrument: docs/format-uib.md
    measurement: >-
      A GIF DMA_REF tag's ADDR field starts at bit 4, so a source under
      16-byte alignment cannot be expressed and the transfer begins up
      to 15 bytes early. off_blob mod 16 was 4, 12, 4, 4 across four
      shipped blobs; 12 bytes is 12 texels of a 256-wide PSMT8 atlas.
      Fixing it produced the first green ground-truth emulator diff in
      the project's history, RMSE 22.89 -> 4.79.
  falsifier: "A blob with off_blob mod 16 != 0 whose textures land correctly"
  note: >-
    The operator reported "the right edge of every image butted against
    its left edge" twice, and it was read past twice. Because the
    truncation lives in the DMA tag format rather than in silicon,
    Play! reproduced both the fault and the fix.
  refs: ["#40"]

- id: F-004
  phase: 0
  status: confirmed
  claim: "PrimAlphaEnable is one field driving two registers: PRIM.ABE and TEX0.TCC"
  evidence:
    instrument: runtime/ps2ui.c
    measurement: >-
      Passed in the tcc position at all 30 GS_SETREG_TEX0 sites,
      read per draw at all 65 reads, never latched. TCC=0 tells the GS
      the glyph atlas is opaque RGB, so every glyph becomes a solid
      block of its own text colour.
  falsifier: "A build with PrimAlphaEnable off whose glyphs keep their antialiasing"
  note: >-
    Produces the signature "text broken, boxes fine", because glyph
    coverage IS texture alpha while untextured geometry is unaffected.
  refs: ["#39"]

- id: F-005
  phase: 0
  status: confirmed
  claim: "gsKit has no DECAL path; TEX0.TFX is hardcoded to MODULATE"
  evidence:
    instrument: runtime/vendor/gsKit/gsTexture.h
    measurement: >-
      GSTEXTURE has no Function field at 43122eb, and TFX is 0 at all
      30 TEX0 sites. TEX0.TBW is also unsettable by the caller:
      gsKit_texture_upload's first statement is gsKit_setup_tbw().
  falsifier: "A GSTEXTURE field or gsKit call that selects DECAL"
  note: >-
    Settled by reading the library, after four bench-blocking questions
    in a row -- GSTEXTURE::Function, TEX0.TFX, TEX0.TCC, TEX0.TBW --
    were all answerable from source and were instead attacked with A/B
    ELFs on a console. See L-012.
  refs: ["#38", "#39"]

- id: F-006
  phase: 0
  status: confirmed
  claim: "gsKit's TexManager cannot report VRAM exhaustion; it hangs"
  evidence:
    instrument: runtime/ps2ui.c
    measurement: >-
      _blockAlloc loops evicting ever-hotter textures until something
      fits and has no NULL-returning exit, so an over-budget blob under
      raw TexManager_bind is a console hang inside gsKit rather than an
      error code.
  falsifier: "An over-budget bind that returns an error instead of hanging"
  note: >-
    Hence ps2ui keeps an all-or-nothing preflight AND re-checks per
    frame, because every gsKit_vram_alloc resets the manager's block
    list and shrinks the region the preflight approved.
  refs: ["#41"]

# ------------------------------------------------- the sampling defect
- id: F-011
  phase: 0
  status: overturned
  claim: "A +0.5 UV bias is wrong: under NEAREST at 1:1 it lands one texel past target"
  evidence:
    instrument: docs/bringup.md
    measurement: >-
      Pixel i of a 1:1 sprite centres at x0+i+0.5, so u = u0+i+0.5,
      which floors to u0+i. Adding 0.5 gives u0+i+1.
  falsifier: "A renderer where a +0.5 bias does not move the sampled texel"
  overturned_by: [F-020]
  note: >-
    KEPT DELIBERATELY, AND STILL TRUE OF EVERY RENDERER HERE EXCEPT THE
    ONE THAT MATTERS. The arithmetic is correct for an exact
    interpolator; the premise -- that the GS is one -- is not. It
    survived months because at power-of-two spans it is exactly right,
    and because the previewer and Play! both compute in float with no
    reciprocal, so every host-side renderer this project owns agreed
    with it. Nothing off-console could have caught it.
  refs: ["#36", "#57"]

- id: F-019
  phase: 1
  status: confirmed
  claim: "The GS is not an exact UV interpolator"
  evidence:
    instrument: runtime/sample/ladder_pattern.h
    measurement: >-
      Bench S8, SCPH-50000: a textured sprite h pixels tall sampling h
      texels keeps its last texel row only at h in {1,2,4,8} -- exactly
      the heights where 1/h is exact in binary. The same rungs drawn as
      stacked untextured quads keep every row, so the rasteriser and
      the display are not involved.
  falsifier: >-
    A non-power-of-two span that keeps its last texel row with no bias,
    or an untextured stack that loses one
  note: >-
    The mechanism -- a reciprocal in the per-scanline UV step -- remains
    a HYPOTHESIS. The correction is measured; the explanation is not.
  refs: ["#56", "#58"]

- id: F-020
  phase: 1
  status: confirmed
  claim: "Both texture axes lose their last texel independently, each on its own span"
  evidence:
    instrument: runtime/sample/ladder2_pattern.h
    measurement: >-
      Bench S10, SCPH-50000: blocks 100 wide, heights 1-12. At bias 0
      the last ROW is lost unless the height is a power of two, and the
      last COLUMN is always lost because 100 is not. The clincher is
      heights 4 and 8, which keep their row and still lose their
      column.
  falsifier: >-
    A quad whose width is not a power of two that keeps its last column
    with no bias
  depends_on: [F-019]
  overturns: [F-011]
  note: >-
    Nothing before S10 could see the U axis: every earlier instrument
    was a power of two wide, which is the one span that cannot trigger
    the fault.
  refs: ["#59", "#61"]

- id: F-021
  phase: 1
  status: confirmed
  claim: "A 1/16 texel bias fixes the console and is a no-op on an exact renderer"
  evidence:
    instrument: runtime/ps2ui.c
    measurement: >-
      floor(u + b + i + 0.5) == u + i for any b < 1/2, so every
      sub-half bias leaves an exact sampler on the same texel. 1/2 is
      the exact tipping point: a 1/2 build renders Library as
      Liibrarny and scores 17.34 on a frame diff whose healthy band is
      4.79. The 1/16 build scored 4.79 / 13.73 -- the exact pre-bias
      value. 1/16 is also the smallest the GS's four fractional UV bits
      can express.
  falsifier: >-
    An emulator diff that moves under 1/16, or a console span that
    still loses its last texel with it applied
  depends_on: [F-020]
  note: >-
    U WAS inferred rather than measured at widths other than 100. Bench
    step S9 settled it: see F-033.
  refs: ["#61"]

- id: F-022
  phase: 1
  status: confirmed
  claim: "Two thirds of the font has been losing its last texel column since the beginning"
  evidence:
    instrument: packages/baker/ps2ui_bake/check.py
    measurement: >-
      memcard atlases: size 13 has 113 inked glyphs, 74 of
      non-power-of-two width and 99 of non-power-of-two height; size 14
      has 82 and 83. ps2ui-check prints this on every run.
  falsifier: "A recount from the baked atlases that disagrees"
  depends_on: [F-020]
  note: >-
    Printed by the build because hand-quoted glyph metrics were wrong
    in four consecutive pull requests. See L-006.
  refs: ["#61"]

- id: F-012
  phase: 0
  status: overturned
  claim: "gsKit_texture_upload does not write the data cache back, so the GS reads stale palette memory"
  evidence:
    instrument: docs/bringup.md
    measurement: >-
      Believed from reading the narrow symbol. Disproved by reading one
      line further: gsKit_texture_send opens with an unconditional
      FlushCache(0) on every path (gsTexture.c:266), so no cache fault
      ever occurred.
  falsifier: "A flush on the upload path, which there is"
  overturned_by: [F-013]
  note: >-
    Kept because of HOW it died. The disproving line was in the
    author's own grep output, one line above the hits quoted -- "I
    searched for the narrow symbol and stopped reading." The explicit
    SyncDCache calls stayed as hardening rather than being reverted, so
    the code no longer depends on that implementation detail either
    way.
  refs: ["#41"]

- id: F-013
  phase: 0
  status: confirmed
  claim: "gsKit flushes the whole data cache inside its transfer path"
  evidence:
    instrument: runtime/vendor/gsKit/src/gsTexture.c
    measurement: "gsKit_texture_send opens with an unconditional FlushCache(0) on every path"
  falsifier: "An upload path in gsKit that reaches the GIF without a flush"
  overturns: [F-012]
  refs: ["#41"]

- id: F-033
  phase: 1
  status: confirmed
  claim: "The sampling defect is closed on hardware, on both axes, through the shipping renderer"
  evidence:
    instrument: docs/bench-phase1.md
    measurement: >-
      Bench S9, SCPH-50000, HW #260. The title reads PS2UI PHASE 1
      STREAM BENCH rather than PS2UI PHASF 1 STRFAM BFNCH, and the S7
      line reads E L 2 rather than F I ?. Every capital on the screen
      is intact. The bench face carries 113 inked glyphs of which 78
      are non-power-of-two WIDTH, and 19 distinct ones appear on that
      screen -- A B C H M N R T U Y e g m o r t v w x, spans 6 to 13 --
      all rendering correctly. That is the U sweep the ladder could not
      perform, because every arm it had was a power of two wide.

      Re-measured off the shipped blob rather than counted off the
      photograph, which is the stronger form and gives both axes: the
      covers screen draws 37 static glyph quads across two atlases, at
      U spans 3 5 8 9 10 11 12 -- six of the seven non-power-of-two,
      32 of the 37 quads -- and V spans 1 11 12, 27 of 37 non-power-of-
      two. Runtime slot text adds more on top of that, from the font
      tables.
  falsifier: >-
    A capital or a non-power-of-two-width glyph still losing its edge
    row or column with PS2UI_TEXEL_BIAS applied
  depends_on: [F-021]
  note: >-
    This is the first step in the sequence that tested the SHIPPING
    renderer rather than a purpose-built card. S8 and S10 both measured
    ladder.elf and ladder2.elf, which draw directly and carry no blob;
    a fix demonstrated there is a fix demonstrated on an instrument.
    S9 is the one that closes the defect.

    TWO NUMBERS ABOVE MEAN LESS THAN THEY LOOK, and PR #64's review was
    right to say so. "113 inked glyphs of which 78 are non-power-of-two
    WIDTH" is a statistic of ONE FACE'S GLYPH TABLE -- the 15px face --
    not of anything on the screen; do not try to count 113 things in
    the photograph. And the 19 is a hybrid: the set of letters visible
    on the face, measured against that one table. The title is set at
    17px and comes off its own atlas with no font record, at spans as
    narrow as 3, so several of its glyphs were never in the 113 and
    never in the 19. The blob measurement added above has no such
    seam -- it counts what is actually drawn.
  refs: ["#61", "#64"]

# ------------------------------------------------------------ Phase 1
- id: F-030
  phase: 1
  status: confirmed
  claim: "wLaunchELF resets the IOP, so no launcher-loaded driver survives"
  evidence:
    instrument: runtime/sample/main.c
    measurement: >-
      Bench S6 returned "open cover0: -1" from a stick carrying four
      byte-verified 65,536-byte files. wLaunchELF launches via
      LoadExecPS2, which resets the IOP, so its USB drivers were gone
      before the ELF ran. Embedding the stack fixed it and S6 passed.
  falsifier: "A launcher-loaded IRX still responding after LoadExecPS2"
  note: >-
    The USB stack is discovered rather than pinned: BDM in modern SDKs,
    usbhdfsd in older ones, both presenting mass:. CI refuses an empty
    module table.
  refs: ["#55"]

- id: F-031
  phase: 1
  status: confirmed
  claim: "An OPL-class environment costs single-digit KiB of arena, not a 35,648-byte ceiling"
  evidence:
    instrument: examples/opl-env/README.md
    measurement: >-
      opl-env: 6 screens, 127 slots, a 7,031-byte arena and a
      246,144-byte blob, VRAM 392 KiB of
      a 736 KiB budget. The fixed-maxima context charged 35,648 bytes
      on every blob regardless of content; the 121-slot UC-3 fixture
      needs 8,285.
  falsifier: "A realistic environment whose arena exceeds the old fixed ceiling"
  note: >-
    THE NUMBER IN THIS CLAIM WAS WRONG FOR TWO PULL REQUESTS AND A
    PHASE LOCK. It said 6,951 and 125 slots; the blob says 7,003 and
    126. #63 added the telem slot to library.html, the library screen
    went 43 to 44, and every count-derived figure moved with it.

    The finding itself never wavered -- the falsifier is an arena past
    the old 35,648-byte ceiling and 7,003 is not remotely close, so
    this was a right conclusion carrying a wrong number, which is the
    harder kind to notice. Nothing did notice, because `instrument`
    here names a hand-written README and nothing read the blob header
    back into it. A figure nobody re-derives is true on the day it is
    written and unfalsifiable afterwards.

    Corrected in #65, and tools/check-example-figures.py now diffs that
    README against the committed blob so the next drift fails a build
    instead of surviving a lock. Locking a phase means the deciding is
    finished, not that the arithmetic stops being checked.

    AND THE NEXT DRIFT WAS THE VERY NEXT CHANGE. P3a split the readout
    into two slots, the count went 126 to 127, and the new check caught
    it in the same commit that caused it -- which is the check working,
    but three drifts in three consecutive changes says the fault is not
    only that nobody re-derived the number. It is that a DURABLE claim
    was carrying a VOLATILE one. The finding is about an order of
    magnitude: single-digit KiB against a 35,648-byte fixed ceiling.
    That does not move when someone adds a slot. The exact byte count
    now lives in evidence, where the check guards it, and the claim
    says the thing that stays true.
  refs: ["#48", "#60", "#65", "#66"]

- id: F-032
  phase: 2
  status: confirmed
  claim: "Per-row reservations make a one-row scroll re-upload every cover"
  evidence:
    instrument: examples/opl-env/window.h
    measurement: >-
      Predicted 9 x 3,136 = 28,224 bytes per scroll step from the
      reservation model. Measured on a SCPH-50000, HW #260: oplenv.elf
      reported up28224, unchanged across every photographed scroll
      step. Exact.
  falsifier: "A scroll step measured on hardware that uploads less than every row"
  depends_on: [F-031]
  note: >-
    Phase 3's likely answer is to rotate which reservation a row draws
    from rather than re-upload. The number exists so that is decided by
    a measurement rather than guessed, and it now is one.
  refs: ["#60", "#63"]

- id: F-034
  phase: 2
  status: confirmed
  claim: "The OPL-class environment runs at full field rate on hardware"
  evidence:
    instrument: runtime/sample/main.c
    measurement: >-
      SCPH-50000, HW #260. oplenv.elf reported 16.73 ms across every
      photographed frame, against an NTSC field period of 16.683 ms,
      and no frame at a two-field 33.4 ms. 562 to 570 primitives per
      frame while streaming nine covers per scroll step.

      The 0.05 ms gap was first written down here as "0.28% error". It
      was not error. `EE_HZ / 1000000u` is 294 in integer arithmetic,
      not 294.912 -- a systematic +0.310% bias that accounts for the
      whole of it. One field is 4,920,115 ticks, which through the
      truncated divisor prints exactly 16.73. The console was reporting
      a perfect measurement through an imperfect conversion. Fixed in
      #64; the same build now prints 16.68.
  falsifier: >-
    A reported frame time near 33.4 ms, or any dropped field -- read
    `m`, the cumulative drop count, not `f`. `f` is a 60-frame mean, in
    which one drop shows as 0.28 ms and only while it is inside the
    window.
  depends_on: [F-031, F-032]
  note: >-
    WHAT THIS MEASUREMENT DID NOT MEASURE: headroom. The HW #260 build
    read the clock after gsKit_sync_flip, which blocks until vsync, so
    16.73 ms was dominated by the wait rather than by the work. It
    establishes that the frame fits inside a field, which is what the
    Phase 2 gate asks; it said nothing about how much of the field was
    left. A number that stable, that plausible and that mislabelled is
    the same shape of defect as the rest of this project, arrived at
    with a stopwatch instead of a renderer.

    THE INSTRUMENT HAS SINCE CHANGED. The driver now reports `f`, the
    wall-clock frame period, which is the quantity this finding claims;
    `ee`, the EE's own work, stopping at the DMA kick before the flip;
    and `m`, a count of dropped fields cumulative since boot, because a
    falsifier reading "any dropped field" cannot be served by a rolling
    mean. So this finding stays falsifiable against the shipping build.
    The ordering is asserted by tools/check-timing-probe.py, which
    fails on all eight ways of reinstating the old shape -- including
    one it did not catch until #64's review found it, where the correct
    capture is kept and a second one added after the flip.

    `ee` IS NOT PURELY EE-SIDE, which this note first claimed on a
    reading of gsKit that was wrong. gsKit_queue_exec_real appends a
    FINISH token (gsCore.c:582 at 43122eb), spins on the PREVIOUS
    frame's FINISH (:591) and clears CSR (:594) BEFORE sending the
    chain, so `ee` is EE work plus any GS overrun carried from the
    frame before. Today that term is about zero because sync_flip has
    already given the GS a whole field, which is exactly why the wrong
    claim was comfortable.

    The correct statement is STRONGER than the one it replaces. GS time
    is unknown but bounded above by roughly a field, and `ee << f`
    together with `m0` establishes it is not costing one -- a GS over
    budget would surface inside `ee` and trip `m` with it. What remains
    unknown is the GS's SHARE of the field: 10% and 90% are
    indistinguishable from here. That is P3a.

    A self-consistency check fell out of the prim count: the first
    photograph reads p562 and the rest p570, and its visible rows are
    titles 2 through 10 -- eight single-digit titles against nine
    double-digit ones in the others. Eight fewer glyph quads, exactly.
    Confirmed exhaustively in #64's review against the blob: between
    those two window states exactly eight slots change inked-glyph
    count, row-0-title through row-7-title, each by one digit. The
    -sub, -score and -src slots are fixed width. It is not a story that
    fits the number; it is the only difference that exists.
  refs: ["#63", "#64"]

- id: F-035
  phase: 2
  status: confirmed
  claim: "COP0 Count ticks once per CPU cycle at 294.912 MHz on the R5900"
  evidence:
    instrument: runtime/sample/main.c
    measurement: >-
      A vsync-locked loop measured with cop0_count and EE_HZ =
      294912000 reported 16.73 ms per frame against a true NTSC field
      period of 16.683 ms. Had Count ticked at half the core clock, as
      several MIPS implementations do, that build would have reported
      8.36 ms and the build after #64 reports 8.34. Either way it is a
      factor of two away from a field, which is the whole argument.
  falsifier: >-
    A known wall-clock interval that the driver reports at half or
    double its true length. Read `f` for this, not `ee`: since the
    headroom change `ee` is the EE's work and is not vsync-locked, so
    it is not a clock against a known interval.
  note: >-
    Retires the bench marker that had sat on EE_HZ since the telemetry
    build shipped, which said to treat ee_us as relative rather than
    absolute. It is absolute. Settled as a side effect of measuring
    something else, because the field period is a known quantity and
    the loop was locked to it.

    THE COUNTERFACTUAL IN THIS FINDING WAS WRONG TWICE, in a way that
    does not touch the claim but is worth recording. 8.34 was the true
    half-period, not what that build would have printed; #64's review
    said 8.37, which is the half-period through the truncated divisor
    before the integer print truncates again. The value is 8.36. The
    finding survives because a factor of two does not care, but a
    counterfactual nobody evaluated is not evidence, and this one sat
    in a confirmed finding through a phase.
  refs: ["#63", "#64"]

- id: F-036
  phase: 2
  status: confirmed
  claim: "The OPL-class environment uses about an eighth of a field on the EE"
  evidence:
    instrument: docs/bench-phase2.md
    measurement: >-
      Bench S11, SCPH-50000, HW #261, oplenv.elf at 4d351ae. ee 2.12 ms
      at the top of the list, 2.21 ms once scrolling, 2.25 ms in the
      hundreds -- 12.7% to 13.5% of a 16.683 ms NTSC field, leaving
      about 14.4 ms unused on the EE side. f read 16.68 on every frame
      and m read 0 throughout, held past title 250.
  falsifier: >-
    An ee reading approaching f at this content level, or any m above
    zero
  depends_on: [F-034, F-035]
  note: >-
    WHAT THIS DOES NOT MEASURE: the GS's SHARE of the field. Not GS
    time outright -- see F-034's note, which corrects the claim that
    gsKit_queue_exec returns while the GS draws. It does not: it blocks
    on the previous frame's FINISH first, so a GS over budget would
    surface inside `ee` and trip `m`. Between them, `ee << f` and `m0`
    bound GS time below a field. What they cannot do is divide that
    field: 10% GS and 90% GS look identical from here. Reading the
    clock after gsKit_finish() rather than after vsync is P3a.

    THIS IS A DUTY-CYCLE MEAN, and the frame that has to fit is not the
    one printed. Two frames in sixty do the scroll work -- 36 slot_set
    plus 9 tex_set in oplenv_bind_window -- and a 60-frame mean smears
    them. Solving mean(11-19) - mean(1-9) = d + u/30 with d from the
    prim delta puts the scroll frame at roughly 2.4 to 3.9 ms rather
    than 2.21. The headline survives with room to spare, because m0
    already proves none of those frames missed a field, but "an eighth
    of a field" is the average eighth. A peak-hold beside the mean
    would make this readable directly, which is the same upgrade `m`
    was for F-034; it ships with P3a rather than costing a sitting of
    its own.

    THE READOUT IS DRAWN BY THE THING IT MEASURES, which turned the
    prim count into an exact check for the second time. Between the
    1-9 window and the 11-19 window the count rises 13: nine from the
    title digits, one per row, and FOUR from the readout's own text,
    because "up0" became "up28224". Between 11-19 and 140-148 it rises
    exactly nine, the digit change alone, because the readout's length
    did not move. Both worked out before being checked, both exact.

    EE cost is close to linear in prim count with no large fixed term:
    2.21/579 and 2.25/588 both give 3.8 us per prim (2.12/566 gives
    3.7, and is the confounded reading anyway), and the
    marginal cost across the clean pair is 4.4 us [3.3, 5.6]. The
    interval is wide because ee prints to 0.01 ms, which is 10 us
    against deltas of 40. Do not quote a per-prim cost from this
    without widening the print first.

    The 2.12 reading is CONFOUNDED and must not be used for a marginal
    cost: it is the only one at up0, so it differs from the others in
    upload state as well as in digits.
  refs: ["#65"]

# ------------------------------------------------------------ Phase 3
- id: F-037
  phase: 3
  status: confirmed
  claim: "The GS spends about a twentieth of a field on an OPL-class screen"
  evidence:
    instrument: docs/bench-phase2.md
    measurement: >-
      Bench S12, SCPH-50000, HW #262, oplenv.elf at 5ea02ae. gs 0.91 to
      0.93 ms against a 16.683 ms NTSC field -- 5.6% at the top of the
      range, the convention used throughout. With ee at 2.41 ms the two
      together are 3.34 ms, 20.0% of a field, leaving 13.34 ms unused.

      4.59 ms (27.5%) is the worst frame photographed, but it is an EE
      PEAK paired with a GS MEAN and is therefore a LOWER BOUND, not
      the worst frame. gs has no peak-hold yet.
  falsifier: >-
    A gs reading approaching f on this content, or a gs that does not
    move when oplenv-fill.elf draws over it
  depends_on: [F-036]
  note: >-
    THE ARM IS WHY THIS IS A MEASUREMENT, and it checks against the
    PART rather than against itself. gs read 0.92 on the plain build
    and 3.21 on oplenv-fill.elf, so the CSR FINISH bit is not latched.
    It moved 2.29 ms for 2,293,760 blended pixels: 1.002 Gpix/s. The GS
    is 16 pixel pipelines at 147.456 MHz -- 2.359 Gpix/s unblended,
    halved to 1.180 when a blend forces a framebuffer read-modify-write
    -- so the arm landed at 84.9% of the part's blended peak, and
    85.7%/84.2% across the reading's 2.27-2.31 ms spread. 85% of
    theoretical on real silicon with page breaks is where it belongs. A
    latched instrument reads 0.00 forever; a broken one does not land
    within 15% of a spec sheet.

    AND IT MOVED NOTHING ELSE. ee was 2.41 on both builds at p599 and
    2.37 on both at p590 -- +0.00 twice. One prim per sprite, so the EE
    has nothing extra to build. A `gs` that rose while `ee` rose with
    it would have been measuring the wrong thing.

    The peak-hold checked itself as a side effect: on the fill build's
    up0 window the readout is ee2.28^2.29, the peak collapsing onto the
    mean because that window contains no scroll frame. That is what
    it should do and nobody had to arrange it.

    AND THE READOUT AUDITED ITSELF ACROSS A CODE CHANGE. Between HW
    #261 and #262 the readout split from one line into two, growing
    from 27 inked glyphs to 17+21 = 38, a rise of 11. On both windows
    photographed at matched shape, p rose by exactly 11: 579 to 590 for
    nine double-digit titles, 588 to 599 for nine triple-digit ones.
    Third time this instrument has audited itself on prim count, and
    the first across two pull requests and two sittings rather than
    within a single screen.

    WHAT IS STILL SMEARED: gs has no peak-hold. The sharper reason is
    not the smearing but that THE TWO SPIKES COINCIDE -- the scroll
    frame does the bind work on the EE and pushes 28,224 bytes through
    the same chain, so it is the worst frame on both axes at once. A
    real worst-frame figure needs gs^ beside ee^, and until it exists
    the 4.59 ms above is a lower bound.

    THE PEAK-HOLD HAS A PREDICTION, so the next sitting can falsify it
    rather than merely observe it. 28,224 bytes is 0.024 ms on the DMA
    path and 0.188 ms EE-inline; the up0-vs-up28224 mean difference of
    0.01 ms over a 1-in-30 duty cycle implies about 0.3 ms per upload
    frame, the same order as the inline figure. So predict gs^ between
    0.95 and 1.15 against a 0.93 mean -- 2 to 20 print units, readable.
    A gs^ sitting on the mean would falsify the upload-cost story.

    THE gs^ PREDICTION LANDED. HW #263 read gs^ 1.15 against a gs of
    0.92 on the plain build -- the exact top of the predicted [0.95,
    1.15] band. The scroll frame costs about 0.23 ms more GS time than
    the mean, and the upload-cost story survives the test that was set
    up to falsify it. Across the sweep the gap holds at 0.21 to 0.23 ms
    on four of five builds; -fill2 read 0.08 and is the one point that
    does not fit.

    The obvious explanation is ruled out by the photograph itself.
    #69's review proposed the up0 window -- the first eight scroll
    steps after boot, where oplenv_window_move returns 0 and no bind
    happens, which is what produced ee2.28^2.29 at HW #262. But the
    -fill2 photograph reads up28224, and with SCROLL_EVERY at 30 and a
    60-frame peak window, an actively scrolling run has exactly two
    scroll frames in every window. So the window did contain scroll
    frames and the peak should have caught one. Still unexplained, and
    now unexplained for a documented reason rather than an unexamined
    one.

    THE m1 IS GONE, AND NOTHING WAS EVER WRONG WITH FRAME 0. S14
    re-ran the same five ELFs with the boot phase zeroed and read m0 at
    every N, so the m1 this paragraph tried three times to explain was
    the clock starting at an arbitrary phase into a field, not work
    overrunning one [F-040:historical].

    This note has now said three things in sequence: unknown, then
    "settled, and it is the cold start after all", and now this. The
    middle one is the instructive one -- it was written the moment a
    bracket appeared to price the cold start, and the bracket was
    measuring the phase. The paragraph below it, which priced the cold
    start and found it short by a factor of seven, was RIGHT all along
    and was overruled by a number that looked more precise.

    THE FILL BUILD REPORTED m1 AND THE CAUSE WAS UNKNOWN -- and this
    paragraph's arithmetic is what survived. The frame
    period is vsync-locked, so top-to-top quantises to whole fields and
    the 18.33 ms trip can only be cleared by two of them: one frame's
    work exceeded a WHOLE 16.683 ms field. This finding first offered
    frame 0's cold start, and that does not survive being priced. For
    the fill build's extra 2.29 ms to be what tipped it, plain frame 0
    must have landed in [14.39, 16.68) ms -- 11.05 ms above plain
    steady state. The blob's entire texture payload is 233,660 bytes:
    0.19 ms of GIF DMA, and 1.56 ms even at an EE-inline 150 MB/s.
    Short by a factor of seven. And FirstFrame argues the wrong way,
    since queue_exec_real SKIPS its wait on frame 0, making that frame
    shorter. Nothing identified accounts for 11 ms. `m` records how
    many, never when; a frame index on the first miss answers "when"
    and leaves "why" open.
  refs: ["#67"]

- id: F-038
  phase: 3
  status: provisional
  claim: "Neither processor is the constraint on an OPL-class screen"
  evidence:
    instrument: docs/PLAN.md
    measurement: >-
      EE 14.4% and GS 5.6% of a field, measured independently and on
      the same build (F-036, F-037). Phase 3's headline item was
      precompiled DMA chains, which remove EE work; its second was
      page-aware packing, argued on fill. Neither resource is close to
      its limit, so neither item can improve a vsync-locked frame rate.
  falsifier: >-
    A content shape inside the Phase 2 envelope -- 412 titles, nine
    rows, one scroll step -- that pushes ee or gs past about half a
    field
  depends_on: [F-036, F-037]
  note: >-
    PROVISIONAL, and the phase stays open, because this is a claim
    about a CONTENT SHAPE rather than about the console. It is true of
    nine rows of text with 28x28 covers and one scroll step at a time.
    A grid view, larger art, a background image, or a transition that
    composites two full screens are all outside what has been measured.

    HALF THE FALSIFIER IS NOW DISCHARGED, AND THIS NOTE NAMED THE WRONG
    PROCESSOR [F-042]. It expected a compositing transition to be the
    shape most likely to move gs, "since fill scales with area and this
    screen is mostly flat panels". F-039's calibrated model prices that
    at 0.57 ms. Reaching half a field on the GS takes 25.9 full-screen
    blended layers; every shape named above costs under 11% of a field
    at the fitted slope, and under 16% even if textured fill runs at
    half that rate -- which it may, since the slope was fitted on
    untextured sprites and three of those shapes are textured. No
    OPL-class content gets the GS near its limit either way, and that
    was settled by arithmetic rather than by another sitting.

    SO THE SURVIVING HALF IS THE EE, AND THE EE HAS NO MODEL. gs has
    five points, a fitted line and r^2 = 0.999998. ee has one number
    and nothing to extrapolate with, which is why this finding cannot
    be closed the way its GS half was. The missing instrument is the EE
    analogue of the fill arm. NOT the 1x1 scissor the first draft
    proposed: ps2ui_render resets the scissor to the full canvas four
    lines in (ps2ui.c:1044), so a caller-set clip does not survive
    being entered. The alpha test does -- ps2ui_render deliberately
    leaves TEST inherited (ps2ui.c:999-1010) -- so ATE with ATST=NEVER
    before N extra passes gives the EE all of its work while the GS
    discards every fragment, with no runtime change. Until that sweep
    exists, "neither processor is the constraint" is measured on one
    side and asserted on the other.

    What it does settle is that no Phase 3 item may be justified by
    frame rate without first showing content that threatens one of
    these two numbers. That is a higher bar than the phase opened with
    and it is the point of having measured.
  refs: ["#67"]

- id: F-042
  phase: 3
  status: confirmed
  claim: "Half a field of GS time costs 25.9 full-screen UNTEXTURED blended layers, so no OPL-class content shape can reach it"
  evidence:
    instrument: docs/bench-phase2.md
    measurement: >-
      Derived from F-039's fit, not from a new sitting:

        gs(layers) = 0.9205 ms + layers x 0.2861 ms

      where 0.2861 is 640x448 = 286,720 px at the fitted 1.002 Gpix/s.
      The model reproduces all five measured sweep points to the print
      resolution (0.92 / 1.49 / 2.07 / 3.21 / 5.50).

      Half a field is 8.34 ms, so (8.34 - 0.9205) / 0.2861 = 25.9
      full-screen blended layers; a whole field is 55.1.

      THE SLOPE IS UNTEXTURED. The sweep drew gsKit_prim_sprite --
      flat colour, no texture (main.c:1799) -- so the shapes below,
      three of which are textured, are priced at a rate the GS beats
      only when it is not fetching texels. Each is a LOWER BOUND, and
      each is given twice: at the fitted slope, and at half of it.

        a background image                 1.21 / 1.49 ms   7.2 / 8.9%
        a transition over two full screens 1.49 / 2.06 ms   8.9 / 12.4%
        both at once                       1.78 / 2.64 ms  10.7 / 15.8%
        9 covers 28x28 -> 128x128         +0.14 / +0.28 ms

      Even at half the fitted rate, half a field still takes 13
      full-screen layers. The intercept is unaffected either way:
      0.9205 ms is the UI's own measured cost and already contains
      every textured thing the UI draws.
  falsifier: >-
    A measured sweep point of UNTEXTURED full-screen blended fill that
    departs from 0.9205 + n x 0.2861 by more than the print
    resolution, or a UI inside the Phase 2 envelope that genuinely
    carries more than about 26 such layers.

    DELIBERATELY NOT "a reading whose gs exceeds the prediction for the
    content drawn", which is what the first version said: three of the
    shapes priced above are textured and the slope is not, so the first
    textured content anyone benches could trip that while the layer
    claim -- the thing this finding actually asserts -- stayed exactly
    true. A finding must not be falsifiable by being applied outside
    the domain it was fitted in.
  depends_on: [F-037, F-039]
  note: >-
    A PREDICTION FROM A CONFIRMED MODEL, NOT A NEW MEASUREMENT, and
    confirmed on that basis because the model was validated the same
    way it is being used here: F-039's five points were predicted
    before the sitting and came back correct to one print unit on every
    one. Using it to price a content shape is the same operation.

    WHAT IT IS NOT is a claim about the EE, and F-038's remaining half
    is exactly that. It is also not a claim that the GS cannot be
    saturated -- 26 layers will do it -- only that nothing this
    toolchain can currently author comes close.

    The value is procedural as much as numerical: P3c was deferred on
    a fill argument and this says the fill argument cannot be revived
    by any content shape, so P3c has to be argued on the 392 KiB
    footprint or not at all.
  refs: ["#75"]

- id: F-039
  phase: 3
  status: confirmed
  claim: "The GS instrument is linear in fill at 1.002 Gpix/s, across a 5-point sweep"
  evidence:
    instrument: docs/bench-phase2.md
    measurement: >-
      Bench S13, SCPH-50000, HW #263, five ELFs from 085b409. Predicted
      before the sitting from HW #262's single delta, then measured:

        N=0   predicted 0.93   measured 0.92
        N=2   predicted 1.50   measured 1.49
        N=4   predicted 2.07   measured 2.07
        N=8   predicted 3.22   measured 3.21
        N=16  predicted 5.51   measured 5.50

      Worst error one print unit, 0.01 ms, on every point. Least
      squares through all five gives 1.002 Gpix/s with r^2 = 0.999998
      and an intercept of 0.9205 ms.
  falsifier: >-
    A sweep point off the line by more than the print resolution, or a
    curve that flattens as fill rises
  depends_on: [F-037]
  note: >-
    ONE STEP PROVES NOT-LATCHED; A LINE PROVES MEASURING. That was the
    argument for building the sweep and it is exactly what came back. A
    mis-anchored clock can produce a non-zero constant. It cannot
    produce five points on a straight line whose slope is the part's
    fill rate and whose intercept is the quantity being measured.

    THE INTERCEPT IS THE MEASUREMENT. 0.9205 ms is the UI's own GS cost
    extrapolated to zero fill, derived from five points rather than
    read off one, and it agrees with the directly measured 0.92 to
    within half a print unit. F-037's headline number is now the
    y-intercept of a regression rather than a single reading.

    Linearity to r^2 = 0.999998 across an 8x range of fill also says
    nothing else saturates on the way up: at N=16 the frame is ee 2.36
    plus gs 5.50 = 7.86 ms, still under half a field, so the sweep
    stays inside the regime where fill is the only variable. A
    flattening would have meant bus rather than pixels; there is no
    flattening.

    RECONFIRMED INDEPENDENTLY AT S14, on 914e20c -- a different sitting
    and a different revision, with the one-line vsync fix in and the
    whole EE arm added since. Refitting the same five N over the new
    photographs:

        gs = 0.9187 + layers x 0.2869   r^2 = 0.9999972

    against this finding's 0.9205 + 0.2861. Agreement in the fourth
    digit on both coefficients. The slope is a fill rate of 0.999
    Gpix/s -- 640x448 in 0.2869 ms -- which lands on 1.0 to three
    digits from a measurement that shares nothing with the first but
    the hardware.

    That matters more than a repeat usually does, because S13's OTHER
    conclusion from the same five photographs (F-040's frame-0
    bracket) was overturned at S14. The instrument was sound and the
    inference drawn beside it was not, which is a distinction worth
    having on the record.
  refs: ["#69"]

- id: F-040
  phase: 3
  status: overturned
  claim: "OVERTURNED at S14. Frame 0 never spilled a field; the clock started at an arbitrary phase into one"
  overturned_by: [F-044]
  evidence:
    instrument: docs/bench-phase2.md
    measurement: >-
      Bench S13, HW #263. The sweep brackets it. m0 at N=0 and N=2, m1
      at N=4, N=8 and N=16, and every miss reads @0 -- the frame that
      overran is frame 0 on all three. Since frame 0 costs C plus the
      fill work f(N), and a miss needs C + f(N) > 16.683:

        N=2  m0  ->  C + 0.57 <= 16.683  ->  C <= 16.11
        N=4  m1  ->  C + 1.14 >  16.683  ->  C >  15.54

      So C + PHI is between 15.54 and 16.11 ms -- where PHI is the boot
      phase, NOT zero at the time of this reading. See the note. The
      plain build's frame 0 stays inside a field, which is why it has
      never missed one.
  falsifier: >-
    Re-running the same five ELFs with the boot phase zeroed. If the
    misses vanish at every N, the bracket was measuring boot phase and
    this finding dies. If they persist, it stands and still needs a
    mechanism.
  depends_on: [F-039]
  note: >-
    THIS FINDING FIRST CLAIMED C ALONE, AND THE SWEEP CANNOT SEE C
    ALONE. Frame 0's period is the only one in the run not bounded by
    two vsyncs: nothing between gsKit_init_screen and t_prev waited for
    one, verified -- zero gsKit_sync_flip outside the error loops that
    never return, zero gsKit_vsync_wait. So t_prev landed at an
    arbitrary phase PHI into a field, and frame 0 spilled when its work
    exceeded 16.683 - PHI. PHI is identical across the five builds, so
    the bracket's WIDTH is sound and its POSITION is not. What was
    measured is C + PHI.

    Two readings fit the same five photographs and the bracket is only
    0.57 ms wide, so neither is favoured:

      C ~ 15.8 with PHI ~ 0        -- what this finding claimed
      C ~ 3.5  with PHI ~ 12.3     -- an ordinary frame 0

    AND THE MECHANISM NAMED HAPPENS BEFORE THE CLOCK STARTS. The VRAM
    allocation, CLUT permutation and static texel transfer are all in
    ps2ui_upload (ps2ui.c:529-609), called at main.c:1570 -- before
    t_prev. ps2ui_tex_set sets Mem and calls TexManager_invalidate; it
    does not bind. So what actually remains inside frame 0 is the first
    transfer of the nine covers: 28,224 bytes, one scroll frame's
    worth, which this same sweep measured at about 0.23 ms as gs^ - gs.
    That is the second reading, and it is the one the code supports.

    THE CORRECTION MOVED THE MECHANISM FROM UNDERSPECIFIED TO SPECIFIED
    IN THE WRONG PLACE, which is worse: the first version was vague
    enough to be unfalsifiable, the second was precise and pointed at
    code outside the measured window. Third pass at the same
    explanation, and the first two both read as settled when written.

    THE FIX IS ONE LINE AND IT IS ALREADY IN. gsKit_vsync_wait() before
    t_prev, unconditional -- gsKit_sync_flip would not do it, being
    guarded by !FirstFrame, which is still set there. Re-run the same
    five ELFs: misses vanish at every N and this finding dies; misses
    persist and it stands, still owing a mechanism.

    S14 RAN THEM. THE MISSES VANISHED AT EVERY N.

        build        N    gs    m at S13    m at S14
        oplenv       0   0.92   m0          m0@0
        fill2        2   1.49   m0          m0@0
        fill4        4   2.07   m1@0        m0@0
        fill         8   3.21   m1@0        m0@0
        fill16      16   5.51   m1@0        m0@0

    Field period f16.68 on all five, no stretch. So the bracket
    measured C + PHI, and with PHI at zero frame 0 fits inside a field
    at every fill level up to 16 full-screen layers. Of the two
    readings that fit the same five photographs, the SECOND was right:
    C ~ 3.5 ms with PHI ~ 12.3 ms, an ordinary frame 0, which is the
    one the code supported. The 15.8 ms frame never existed.

    WHAT THIS COST AND WHAT IT BOUGHT. Three passes at explaining a
    mechanism that was not there -- vague, then precise and pointing at
    code outside the measured window, then a bracket whose width was
    sound and whose position was not. Every one read as settled when
    written. What ended it was not a better explanation but an
    INSTRUMENT CHANGE: `m` gained a frame index, and @0 on every miss
    is what made "the clock's own first frame" reachable as a
    hypothesis at all. A finding that cannot say WHEN cannot be argued
    out of a wrong WHY.
  refs: ["#69"]

- id: F-041
  phase: 3
  status: confirmed
  claim: "gsKit can re-send a CLUT without its texels, at 1,024 bytes per drawn texture"
  evidence:
    instrument: runtime/tests/test_runtime.c
    measurement: >-
      gsKit_TexManager_bind decides the two transfers independently
      (gsTexManager.c:260-265 at 43122eb): ttransfer on Vram == 0,
      ctransfer on VramClut == 0. The block is allocated as
      tsize + csize with the palette at block->iStart + tsize, so a new
      palette needs no reallocation. Measured over the real blob:
      ps2ui_clut_set followed by one ps2ui_render moves 0 texel bytes
      and 7,168 CLUT bytes -- seven whole CT32 palettes, over the
      MEMCARD example, which is the blob the runtime suite loads.
  falsifier: >-
    A clut_set whose next render moves any texel byte, or moves palette
    bytes that are not a whole multiple of 1,024
  note: >-
    THIS IS P3B'S PREMISE AND IT WAS WORTH CHECKING BEFORE BUILDING ON
    IT. The phase promised "instant recolour, same art, ~1 KiB per
    palette". Had bind coupled the two transfers, a theme swap would
    have cost the 165 KiB atlas and the item's whole justification with
    it. gsKit_TexManager_invalidate zeroes BOTH, which is correct for
    ps2ui_tex_set and would have been the obvious thing to reach for.

    THE COST MODEL WAS WRONG IN THE FIRST DRAFT, in the direction that
    flatters. "1,024 bytes per CLUT" is what the plan implies and what
    the first version of the check asserted; gsKit keeps a palette copy
    PER TEXTURE, so the cost scales with textures sharing the index.

    THE EIGHT ARE THE MEMCARD EXAMPLE'S, not opl-env's, and the first
    version of this note said opl-env. runtime/Makefile:6 loads
    memcard's blob and the suite refuses any other by name; memcard has
    {clut 0: 8 textures} and opl-env has {0: 1, 1: 6}. The design doc
    added in the same pull request states opl-env's split correctly,
    so the two disagreed three files apart with the ledger holding the
    wrong one -- the F-031 shape again, and not covered by
    check-example-figures.

    Seven moved, not eight, and the difference is the better half of
    the finding: ps2ui_render binds only what it DRAWS, so a swap is
    lazy and pay-per-use -- textures not on screen re-transfer when
    they are first drawn. That was not designed, it falls out of
    binding at draw time, and it means a theme swap costs in proportion
    to what is visible rather than to what is baked. The check asserts
    it as an EQUALITY against the drawn count, because the inequality
    it used first had no lower anchor and an incomplete marking loop
    satisfied every assertion in the suite.

    WHAT THE CHECK CANNOT SEE: the memcard blob has one CLUT, so a
    marking loop ignoring clut_index marks the same set and passes.
    Over-marking is wasteful rather than wrong -- each texture re-sends
    its own unchanged palette -- but the per-CLUT half of the cost
    claim is untested and needs a two-CLUT fixture. opl-env has two and
    is not a blob this suite loads. Asserted as a blind spot in the
    test rather than left to be discovered.

    THE SWAP IS ALSO CACHE-COHERENT WITHOUT THE CALLER DOING ANYTHING:
    gsKit issues SyncDCache(tex->Clut, ...) immediately before the
    palette send. Recorded because it is invisible from outside and is
    exactly the #40-shaped bug someone would reintroduce by
    "optimising" the pool.

    THE ORDERING HAZARD IS SYMMETRIC AND ONLY ONE SIDE IS ENFORCED.
    clut_set before ps2ui_upload is refused. The first draft of the header said it was
    safe; the byte test falsified that immediately, because upload
    memsets every GSTEXTURE and re-permutes every CLUT from the blob,
    so an early swap vanishes with no error and the caller sees baked
    colours. Losing a call silently is the worse failure.

    But ps2ui_upload sets ctx->uploaded and never reads it, so a SECOND
    upload reverts a swap just as silently -- same failure, opposite
    direction, and the standard above applies to it identically.
    Documented in the header rather than fixed, because nothing in this
    repo calls upload twice and changing upload's contract inside a
    CLUT pull request is the wrong place for it. A swap does not
    survive an upload, before or after.
  refs: ["#70"]

- id: F-043
  phase: 3
  status: confirmed
  claim: "A CLUT costs a full 8 KiB VRAM page, so palettizing to swap palettes is upside-down below ~8 KiB of texels -- and right above it"
  evidence:
    instrument: packages/baker/ps2ui_bake/vram.py
    measurement: >-
      Measured off the opl-env blob while choosing how to make rounded
      boxes themeable (P3b-6). gsKit's page geometry gives a 16x16
      PSMCT32 CLUT one 8 KiB page, the same as a texture -- so the
      palette's cost does not scale with the thing it colours.

      opl-env's nine-patches before P3b-6: 11 textures, one per
      (radius, borderWidth, fill, borderColor), each holding 324-484
      bytes of texels and occupying a full page. 88 KiB.

      Only TWO distinct (radius, borderWidth) pairs exist across all six
      screens -- (3,2) and (4,2). All eleven textures were duplicates
      that differed only in colour.

      | approach                              | textures | CLUTs | VRAM   |
      |---------------------------------------|----------|-------|--------|
      | premixed RGBA (before)                | 11       | 0     | 88 KiB |
      | coverage masks + shared coverage CLUT | 4        | 0 new | 32 KiB |
      | palettized patch + per-theme CLUT     | 2        | 22    | 176 KiB|

      The third row is the one worth writing down. Palettizing the
      patch and swapping its CLUT per theme is the mechanism P3b-0
      built and the obvious reading of "the two compose", and here it
      DOUBLES the footprint and grows 88 KiB per additional theme,
      because a CLUT keys on (radius, bw, fill, border) x n_theme while
      the texture it colours is 81-121 bytes: palettizing the patch
      shrinks it to PSMT8, so the palette is 60-100x the texels it
      addresses.
    reproduce: >-
      ./examples/opl-env/build.sh, then sum
      vram.page_rounded_size() over the patch textures; count distinct
      (radius, borderWidth) pairs in build/*.json.
  falsifier: >-
    A CLUT whose page-rounded VRAM cost is less than a texture's, or an
    opl-env rebuild whose coverage patches exceed the 32 KiB this
    predicts -- either kills the arithmetic the choice rests on.
  note: >-
    THE RULE THIS GENERALIZES TO, and it is not "don't palettize": a
    palette earns its page when the texels it colours are much larger
    than 8 KiB. A 256x256 PSMT8 asset carries 64 KiB of texels behind
    one 8 KiB palette -- an 8:1 win, which is exactly why the image
    path palettizes and should keep doing so. The patches here are 9x9
    and 11x11 -- 324 and 484 bytes as CT32, 81 and 121 palettized --
    behind that same 8 KiB. Same mechanism, opposite verdict, and the
    size is the only input that changed.

    324 IS THE 9x9, NOT THE 11x11, and the first version of this note
    used it for both. Every size in range argues the same way, so the
    verdict never moved -- which is exactly why it survived being
    written down wrong.

    IT DOES NOT ALWAYS SAVE, and opl-env was the wrong example to
    generalize from. A premixed patch is one texture per distinct
    (radius, borderWidth, fill, borderColor) -- call it C. A coverage
    pair is two per distinct (radius, borderWidth) -- call it G. The
    split wins when C > 2G, which is to say when many colours share
    few geometries:

    | example  | G | C | predicts | textures | total VRAM |
    |----------|---|---|----------|----------|------------|
    | opl-env  | 2 | 11| win      | 28 -> 21 | 392 -> 336 KiB |
    | memcard  | 2 | 11| win      | 19 -> 11 | 30% -> 21% of budget |
    | channel6 | 6 | 9 | LOSS     | 23 -> 25 | 47% -> 50% of budget |

    THE RULE WAS CHECKED AGAINST ALL THREE SHIPPED EXAMPLES AND
    PREDICTED ALL THREE, including the one it says loses. channel6
    draws six rounded geometries and paints each about 1.5 times, so
    it pays for the theming rather than being paid for it. (Coverage
    costs AT MOST 2G: a box with no border needs no ring texture,
    which is why channel6 lands on 25 rather than the 26 the bound
    allows.)

    The saving is a property of a STYLESHEET, not of the mechanism,
    and the mechanism's actual justification is that colour becomes
    reachable at all -- the VRAM went with it in two examples and
    against it in the third.

    THE CHOSEN FIX IS ALSO PALETTIZATION, which is worth being precise
    about because it reads as the opposite. A coverage patch is PSMT8
    against the shared coverage CLUT -- 8bpp not 32bpp, one palette for
    the whole build, already paid for by the glyph atlases. What moved
    is not the compression but WHERE THE COLOUR LIVES: out of the
    texels and into the vertex tint, which is a tint-table entry, which
    is a thing a theme can move. Colour ends up in one table instead of
    two, which is the seam that has been the gap four times.
  refs: ["#77"]

- id: F-044
  phase: 3
  status: confirmed
  claim: "One ps2ui_render costs 2.44 ms of EE and 0.78 ms of GS; the driver around it costs 0.08 ms"
  evidence:
    instrument: docs/bench-phase2.md
    measurement: >-
      Bench S14, SCPH-50000, HW #309, five ELFs from 914e20c. The arm
      renders the whole UI N extra times and touches no GS state.

        N   ee     ee^     gs     gs^     m
        0   2.54   3.79    0.92   1.15    m0@0
        1   4.96   6.22    1.70   2.00    m0@0
        2   7.39   8.65    2.48   2.85    m0@0
        3   9.82   11.08   3.25   3.70    m0@0
        4   12.32  13.58   4.03   4.50    m29@270

      ee = 2.5220 + N x 2.4420, r^2 = 0.9999618
      gs = 0.9220 + N x 0.7770, r^2 = 0.9999950

      Since each build runs N+1 renders, ee = base + (N+1) x render
      gives render 2.442 ms and base 0.080 ms; gs gives render 0.777 ms
      and a fixed 0.145 ms.

      So ONE ps2ui_render is 2.44 ms EE + 0.78 ms GS = 3.22 ms, about
      19% of a 16.683 ms field.
  falsifier: >-
    A sweep point off either line by more than the print resolution, or
    an ee intercept implying a base above ~0.5 ms, which would put the
    driver's own per-frame work back in contention as a cost centre.
  depends_on: [F-039]
  note: >-
    THE PREDICTION WAS RIGHT IN SHAPE AND WRONG IN COEFFICIENT, and the
    wrongness is the finding. gs was predicted as (N+1) x 0.92 on the
    grounds that the extra passes are identical draws, so all of
    gs(0)=0.92 must be render. Measured slope is 0.777, and the miss
    grows monotonically to -0.57 ms at N=4 -- 57 print units, not
    noise:

        N=0  pred 0.92  meas 0.92   +0.00
        N=1  pred 1.84  meas 1.70   -0.14
        N=2  pred 2.76  meas 2.48   -0.28
        N=3  pred 3.68  meas 3.25   -0.43
        N=4  pred 4.60  meas 4.03   -0.57

    So 0.145 ms of GS time happens ONCE PER FRAME however many times
    the UI is drawn.

    THERE IS EXACTLY ONE CANDIDATE AND THIS SITTING'S OWN SLOPE
    EXCLUDES IT BY 2x. In an EE build the only GS work in a frame that
    is not a ps2ui_render is a single gsKit_clear: the fill sprites are
    #ifdef-ed out, and both telemetry lines go through ps2ui_slot_set
    and are therefore drawn INSIDE the render. That clear is a
    full-screen 640x448 sprite with ABE on -- gsKit does not save or
    restore PrimAlphaEnable around it (the sample's own probe note
    found that), and ps2ui_render leaves it ON. F-039's slope prices
    exactly that draw at 0.2869 ms:

        clear 0.2869 + render 0.7770 = 1.064 expected
        gs(N=0)                      = 0.922 measured
                                       0.142 short

    And the shortfall lands on the unblended rate at the same
    efficiency the fill sweep shows blended:

        640x448 @ 1.180 Gpix/s (blended)  0.2430 vs 0.2869 measured  85%
        640x448 @ 2.359 Gpix/s (opaque)   0.1215 vs 0.1450 residual  84%

    The intercept also carries any per-frame queue overhead, so 0.145
    is an UPPER bound on the clear -- which widens the shortfall rather
    than closing it.

    "NO MECHANISM PROPOSED" AND "THE ONLY CANDIDATE PRESENT IS EXCLUDED
    BY OUR OWN NUMBERS" ARE DIFFERENT STATEMENTS, and the first version
    of this note made the weaker one. Declining to name a cause after
    F-040 is right; declining to name what the arithmetic already rules
    out is just less information. Two readings survive: the clear is
    not actually blending despite ABE being set -- the same class of
    unasserted-GS-state fault the v2 probe chased, and the ratio being
    1.98 rather than arbitrary is what makes it worth asking -- or
    gs = base + (N+1) x R is wrong in a way that parks 0.14 in the
    intercept.

    THE DISCRIMINATOR IS ONE ELF AND IT COSTS NOTHING.
    oplenv-clearopaque turns ABE off for that one draw. It cannot
    change a pixel: ALPHA is (Cs - Cd) x As >> 7 + Cd and the clear's
    vertex alpha is 0x80 = 128, so the blend is already the identity
    Cv = Cs. gs drops ~0.14 and the first reading is right; gs does not
    move and the second is, which is the more interesting outcome.

    ee SETTLED THE BRANCH THE SWEEP EXISTED TO SPLIT. Predictions
    written before the sitting put N=4 at 12.05 if the driver's own
    work is negligible and 8.05 if it is about 1 ms. Measured 12.32.
    The scroll logic, sprintf and telemetry together are 80 us.

    AND m READ THE SAME QUESTION INDEPENDENTLY, which is why it was
    worth five ELFs rather than two. The upper branch predicted N=4 at
    the edge of a field and missing on scroll frames. Measured: m0
    through N=3, then m29@270 at N=4, where mean ee+gs is 16.35 (inside
    a field) and peak ee^+gs^ is 18.08 (outside).

    270 = 9 x 30 against a SCROLL_EVERY of 30, so THE FIRST MISS IS A
    SCROLL FRAME -- 1-in-30 by luck, which is evidence. It does NOT
    reach "the mechanism is confirmed", and an earlier version of this
    note said that. The count is the second read and nothing divides
    it: 29 misses fits "every scroll frame from 270 on, photographed
    around frame 1110" and fits "a scattering of near-margin frames
    whose first happened to be a scroll frame" equally well. At a mean
    of 16.35 against a 16.683 field there is 0.33 ms of headroom, so
    ordinary jitter puts non-scroll frames over too.

    The two are told apart by whether 29 ~ (frame - 270)/30 + 1, and
    NEITHER TELEMETRY LINE CARRIES A FRAME INDEX. One `frame` field
    answers this and F-045's gs^ question at the same time, which is
    the third time in this phase that the fix for an argument has been
    an instrument rather than a theory.

    p DID NOT SCALE: 595, 595, 595, 596, 600, against ~2975 if it had.
    ps2ui_render memsets its stats, so the readout is the last pass
    only -- confirmed rather than assumed. The variation is scroll
    position, not N.

    MEASURED BEFORE P3b-6, which took opl-env from 1,302 commands to
    2,158. The per-render figure will rise; the DECOMPOSITION METHOD is
    what generalises, and re-running the same five ELFs against a new
    blob re-prices it in one sitting.
  refs: ["#76"]

- id: F-045
  phase: 3
  status: provisional
  claim: "The scroll frame's extra GS cost is 0.21-0.23 ms at every fill level except N=2, where it is 0.07"
  evidence:
    instrument: docs/bench-phase2.md
    measurement: >-
      gs^ - gs, the peak-hold frame's excess over the 60-frame mean,
      across two sittings:

        N     S13    S14      S14 second window
        0     0.23   0.23     --
        2     0.08   0.07     0.08
        4     0.22   0.21     --
        8     0.21   0.22     --
        16    0.22   0.21     --

      The N=2 build reads about a third of every other build, and it
      READ THAT WAY IN THREE SEPARATE WINDOWS ACROSS TWO SITTINGS.
  falsifier: >-
    A gs^ reading at N=2 in the 0.21-0.23 band, which would make this
    an artifact of particular windows after all.
  depends_on: [F-039]
  note: >-
    ITS ONE AVAILABLE EXPLANATION IS NOW DEAD. S13 recorded this as
    unexplained and the obvious answer was an unlucky peak-hold window:
    the hold resets every 60 frames, SCROLL_EVERY is 30, and a window
    that somehow missed both scroll frames would read a low peak. S14
    photographed N=2 twice, seconds apart, and got 0.07 and 0.08. A
    property that survives three windows is not a window.

    NOT MONOTONIC AND NOT A TREND. N=0 and N=4 bracket it at 0.23 and
    0.21, so this is not fill scaling: it is specifically the N=2
    build.

    NO MECHANISM IS PROPOSED HERE, deliberately. F-040 spent three
    passes naming mechanisms for a thing that was not happening, and
    the pattern was always the same -- a plausible cause written up
    before the instrument could distinguish it from its rivals.

    THE INSTRUMENT FIX IS THE SAME ONE THAT KILLED F-040. `m` became
    arguable only when it gained a frame index; @0 on every miss is
    what made "the clock's own first frame" reachable as a hypothesis.
    gs^ has no @. Adding one says which frame holds the peak at N=2,
    and whether the peak-hold is catching the scroll frame at all --
    one sitting, and it either explains this or rules out the last
    explanation standing.
