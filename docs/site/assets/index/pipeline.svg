<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" width="900" height="210" role="img" aria-labelledby="t d">
<title id="t">The build pipeline from HTML and CSS to the console</title>
<desc id="d">Four boxes joined by three arrows: HTML plus CSS, ui.json, .uib, C runtime. Each box names what it is: the source, the IR, the blob, the console.</desc>
<style>
  /* The figure loads through an img element, so it is a separate
     document: currentColor cannot reach it and the page's theme toggle
     cannot either. Only the system preference crosses that boundary, so
     the palette keys off it, and the figure paints its own ground. That
     ground is what makes the caption safe. A reader whose toggle
     disagrees with their system setting sees the figure in the other
     scheme -- a card in the wrong colour, still fully legible -- rather
     than caption glyphs at 2.2:1 on a page that moved without it. */
  .ground { fill: #f1f3f7; }
  .box  { fill: #ffffff; stroke: #c3c8d4; stroke-width: 1.5; }
  .name { fill: #14151a; font: 600 19px system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  .role { fill: #565b6b; font: 400 14px system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  .flow { fill: #7d8496; stroke: #7d8496; stroke-width: 1.5; }
  .cap  { fill: #565b6b; font: 400 14px system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  @media (prefers-color-scheme: dark) {
    .ground { fill: #23262f; }
    .box  { fill: #2c313d; stroke: #4c5265; }
    .name { fill: #eceef3; }
    .role { fill: #adb3c4; }
    .flow { fill: #858ca3; stroke: #858ca3; }
    .cap  { fill: #adb3c4; }
  }
</style>

<rect class="ground" x="0" y="0" width="900" height="210" rx="8"/>

<rect class="box" x="21"  y="44" width="168" height="104" rx="6"/>
<text class="name" x="105" y="90"  text-anchor="middle">HTML + CSS</text>
<text class="role" x="105" y="116" text-anchor="middle">the source</text>

<rect class="box" x="251" y="44" width="168" height="104" rx="6"/>
<text class="name" x="335" y="90"  text-anchor="middle">ui.json</text>
<text class="role" x="335" y="116" text-anchor="middle">the IR</text>

<rect class="box" x="481" y="44" width="168" height="104" rx="6"/>
<text class="name" x="565" y="90"  text-anchor="middle">.uib</text>
<text class="role" x="565" y="116" text-anchor="middle">the blob</text>

<rect class="box" x="711" y="44" width="168" height="104" rx="6"/>
<text class="name" x="795" y="90"  text-anchor="middle">C runtime</text>
<text class="role" x="795" y="116" text-anchor="middle">the console</text>

<g class="flow">
  <path d="M197,96 H239"/><path d="M239,91 L249,96 L239,101 Z" stroke="none"/>
  <path d="M427,96 H469"/><path d="M469,91 L479,96 L469,101 Z" stroke="none"/>
  <path d="M657,96 H699"/><path d="M699,91 L709,96 L699,101 Z" stroke="none"/>
</g>

<text class="cap" x="450" y="186" text-anchor="middle">authored once, on the build machine, then replayed every frame on the console</text>
</svg>
