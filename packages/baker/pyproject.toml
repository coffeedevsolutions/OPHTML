[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ophtml"
dynamic = ["version"]
description = "Bakes the ps2ui intermediate representation into .uib blobs for the PlayStation 2 runtime"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["Pillow>=9"]

[project.urls]
Repository = "https://github.com/coffeedevsolutions/OPHTML"

[project.scripts]
# One front door over a toolchain that had three. The three below stay:
# they are what `ps2ui` drives, and a person debugging one stage wants
# to run that stage.
ps2ui = "ps2ui_bake.ps2ui:main"
ps2ui-bake = "ps2ui_bake.cli:main"
ps2ui-check = "ps2ui_bake.check:main"
ps2ui-fontgen = "ps2ui_bake.fontgen:main"

[tool.setuptools.dynamic]
# ps2ui_bake/__init__.py is the source. A literal `version` under
# [project] here is what let this package carry 0.2.0 while its own
# __init__ said 0.1.0 for four format versions; deriving it means
# there is no second number left to disagree.
version = { attr = "ps2ui_bake.__version__" }

[tool.setuptools]
packages = ["ps2ui_bake"]

# `ps2ui serve`'s page is one HTML file beside the module rather than a
# quoted string inside it -- a 600-line page embedded in Python is
# unreadable and unlintable. It is DATA, so it has to be declared here:
# without this the sdist and the wheel omit it, `ps2ui serve` works in a
# checkout and raises FileNotFoundError for anyone who installed the
# package, and nothing in the tree would have said so. That is the same
# shape as the font path the exit gate found.
[tool.setuptools.package-data]
ps2ui_bake = ["serve_page.html"]
