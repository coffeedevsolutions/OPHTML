[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ps2ui-bake"
version = "0.1.0"
description = "Bakes the ps2ui intermediate representation into .uib blobs for the PlayStation 2 runtime"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["Pillow>=9"]

[project.scripts]
ps2ui-bake = "ps2ui_bake.cli:main"
ps2ui-fontgen = "ps2ui_bake.fontgen:main"

[tool.setuptools]
packages = ["ps2ui_bake"]
