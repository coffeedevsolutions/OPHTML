<!doctype html>
<html>
<body>
<div class="screen">

  <div class="topbar">
    <h1>LIBRARY</h1>
    <div class="filters">
      <p class="chip" id="f-all" focusable autofocus>ALL</p>
      <p class="chip" id="f-hdd" focusable>HDD</p>
      <p class="chip" id="f-usb" focusable>USB</p>
      <p class="chip" id="f-smb" focusable>NET</p>
      <p class="chip" id="f-score" focusable>85+</p>
    </div>
    <p class="counts" data-slot="lib-count" data-slot-capacity="16">412 titles</p>
  </div>

  <div class="body">
    <div class="rows">
      <div class="row" data-repeat="9" id="row-{i}" focusable>
        <img class="art" data-tex-slot="row-{i}-art">
        <div class="meta">
          <p class="title" data-slot="row-{i}-title" data-slot-capacity="40">Title of a Game {n}</p>
          <p class="sub" data-slot="row-{i}-sub" data-slot-capacity="32">2003 · Action</p>
        </div>
        <p class="score" data-slot="row-{i}-score" data-slot-capacity="4">92</p>
        <p class="src" data-slot="row-{i}-src" data-slot-capacity="4">HDD</p>
      </div>
    </div>

    <div class="side">
      <p class="side-h">CONTINUE</p>
      <div class="cont" data-repeat="3" id="cont-{i}" focusable>
        <p class="cont-t" data-slot="cont-{i}-title" data-slot-capacity="28">Recent Title {n}</p>
        <p class="cont-s" data-slot="cont-{i}-sub" data-slot-capacity="20">2h ago</p>
      </div>
    </div>
  </div>

  <div class="footer">
    <p class="hint">○ LAUNCH</p>
    <p class="hint">△ DETAILS</p>
    <p class="hint">✕ BACK</p>
    <!-- The Phase 2 gate wants frame time, prim counts and the cost of
         a scroll step written down. The driver ELF reports them here
         rather than over a serial line nobody at a bench can read, so
         a photograph of this screen carries its own measurement. It is
         a slot, so it costs nothing when the app leaves it unset.
         Every other screen carries the same block for the same reason;
         see .telem in opl.css for why the names are screen-scoped. -->
    <div class="telem">
      <p class="telem-l" data-slot="library-telem" data-slot-capacity="48">telemetry: waiting</p>
      <p class="telem-l" data-slot="library-telem2" data-slot-capacity="48">gs: waiting</p>
    </div>
  </div>

</div>
</body>
</html>
