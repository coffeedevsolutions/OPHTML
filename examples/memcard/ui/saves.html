<!doctype html>
<html>
<body>
<div class="screen">
  <div class="sidebar">
    <div class="brand">
      <h1>PS2</h1>
      <p class="sub">MEMORY CARD</p>
    </div>
    <div class="nav">
      <div class="nav-btn" id="nav-games" focusable>Games</div>
      <div class="nav-btn" id="nav-saves" focusable autofocus>Saves</div>
      <div class="nav-btn" id="nav-settings" focusable>Settings</div>
    </div>
    <div class="spacer"></div>
    <div class="card-info">
      <p>CARD 1</p>
      <p>8 MB &middot; 61 blocks free</p>
    </div>
  </div>

  <div class="main">
    <div class="header">
      <h2>Saves</h2>
      <p class="count" data-slot="save-count" data-slot-capacity="15">4 saves</p>
    </div>
    <div class="savelist">
      <div class="save-row" id="save-ico" focusable>
        <p class="save-title" data-slot="save-0" data-slot-capacity="31">Ico &middot; Chapter 6</p>
        <p class="save-meta">2 blocks</p>
      </div>
      <div class="save-row" id="save-gt4" focusable>
        <p class="save-title" data-slot="save-1" data-slot-capacity="31">Gran Turismo 4 &middot; Garage</p>
        <p class="save-meta">11 blocks</p>
      </div>
      <div class="save-row" id="save-ffx" focusable>
        <p class="save-title" data-slot="save-2" data-slot-capacity="31">Final Fantasy X &middot; Zanarkand</p>
        <p class="save-meta">8 blocks</p>
      </div>
      <div class="save-row" id="save-okami" focusable>
        <p class="save-title" data-slot="save-3" data-slot-capacity="31">Okami &middot; Kamiki Village</p>
        <p class="save-meta">4 blocks</p>
      </div>
    </div>
    <div class="footer">
      <p class="hint">&#215; Copy</p>
      <p class="hint">&#9633; Delete</p>
      <p class="hint">&#9675; Back</p>
    </div>
  </div>
</div>
</body>
</html>
