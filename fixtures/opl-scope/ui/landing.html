<!doctype html>
<html>
<body>
<div class="screen">

  <div class="hero">
    <h1>OPEN PS2 LOADER</h1>
    <p class="hero-sub" data-slot="hero-sub" data-slot-capacity="48">412 titles across 3 sources</p>
  </div>

  <div class="body">
    <div class="sources">
      <p class="side-h">SOURCES</p>
      <div class="src-tile" data-repeat="4" id="src-{i}" focusable>
        <p class="src-name" data-slot="src-{i}-name" data-slot-capacity="16">Hard Disk</p>
        <p class="src-count" data-slot="src-{i}-count" data-slot-capacity="12">218 titles</p>
      </div>
    </div>

    <div class="resume">
      <p class="side-h">CONTINUE PLAYING</p>
      <div class="resume-card" data-repeat="3" id="res-{i}" focusable>
        <img class="res-art" src="../../../examples/channel6/ui/assets/cover-aurora.png" palettize>
        <div class="res-meta">
          <p class="res-title" data-slot="res-{i}-title" data-slot-capacity="36">Recent Title {n}</p>
          <p class="res-sub" data-slot="res-{i}-sub" data-slot-capacity="28">2h ago · 45% complete</p>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">
    <p class="hint">○ OPEN</p>
    <p class="hint">△ SETTINGS</p>
  </div>

</div>
</body>
</html>
