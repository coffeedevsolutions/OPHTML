# Hardware-path verification scaffold (backlog F1).
#
# Job graph:
#   bake      — host toolchain builds the example blob + previewer PNGs
#               and the alignment test card (backlog B3)
#   elf       — the real ps2ui.c + sample compile inside the ps2dev
#               toolchain container; proves the console build, uploads
#               the ELF for anyone to run on hardware/emulator
#   emulator  — EXPERIMENTAL (continue-on-error): boots the ELF in the
#               Play! emulator (HLE BIOS, so legally runnable in CI),
#               captures a frame, and image-diffs it against the
#               previewer ground truth with tools/framediff.py.
#               Until its first green run, treat results as advisory;
#               docs/bringup.md holds the local PCSX2 procedure.

name: hw

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: hw-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install baker deps
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          python3 -m pip install Pillow
      - name: Bake example + test card
        run: |
          ./examples/memcard/build.sh
          # The channel-6 blob carries the `probe` conformance screen,
          # which is where bring-up steps 3, 4, 5 and 7 are read. Only
          # ci.yml built it before, and ci.yml produces no ELF, so those
          # four steps had nothing to run at the bench.
          ./examples/channel6/build.sh
          python3 tools/make_testcard.py examples/memcard/build/testcard.uib \
            --preview examples/memcard/build/testcard-expected.png
          python3 tools/framediff.py --self-test
          python3 tools/read_testcard.py --self-test
          python3 tools/play_appimage_url.py --self-test
      - name: Validate every blob against the runtime's assumptions
        run: |
          # Independent of the bakers that produced them: ps2ui-check
          # re-reads each file and asserts the invariants ps2ui.c relies
          # on but cannot afford to verify at load time. The rules live
          # in the script so this workflow and ci.yml cannot disagree
          # about what "valid" means for the same bytes.
          ./tools/check-blobs.sh
          # conform.elf is built SCREEN=probe. That name lives in
          # probe.html and nothing else in the tree forces the two to
          # agree, so a rename would produce an ELF that holds solid
          # blue -- a failure nobody discovers until a console is
          # already on the bench.
          PYTHONPATH=packages/baker python3 - <<'PY'
          import sys
          from ps2ui_bake.uib import read_uib
          blob = 'examples/channel6/build/ui.uib'
          names = [s['name'] for s in read_uib(blob).screens]
          if 'probe' not in names:
              sys.exit("conform.elf opens on screen 'probe'; blob has %s" % names)
          print('ok - the channel-6 blob has the screen conform.elf opens on')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: baked
          retention-days: 14
          path: |
            examples/memcard/build/ui.uib
            examples/memcard/build/preview.png
            examples/memcard/build/testcard.uib
            examples/memcard/build/testcard-expected.png
            examples/channel6/build/ui.uib

  elf:
    needs: bake
    runs-on: ubuntu-latest
    container: ghcr.io/ps2dev/ps2dev:latest
    steps:
      - uses: actions/checkout@v7
      # upload-artifact stores paths relative to their least common
      # ancestor, which across the memcard and channel-6 blobs is
      # `examples/`. Downloading there puts each one back exactly where
      # its build.sh left it -- and the guard below is what keeps that
      # a fact rather than an assumption, because a wrong root here
      # would surface as a linker error about a missing ui_uib.c
      # rather than as "the blob is not where you thought".
      - uses: actions/download-artifact@v8
        with:
          name: baked
          path: examples
      - name: Every blob the ELF builds against is present
        run: |
          test -f examples/memcard/build/ui.uib
          test -f examples/memcard/build/testcard.uib
          test -f examples/channel6/build/ui.uib
      - name: Build sample ELF with the PS2SDK toolchain
        run: |
          apk add --no-cache make
          # STATIC=1: hold the baked initial focus. The emulator job
          # screenshots at a wall-clock moment, so a build that cycles
          # focus would be compared against whichever state happened to
          # be up, which is not a test.
          make -C runtime/sample STATIC=1
          # The bring-up step 2 instrument. EE_BIN names the output
          # directly rather than building and renaming around `clean`:
          # `clean` currently spares the renamed file, but only by
          # accident, and adding *.elf to it later would silently drop
          # the UI ELF from the artifact.
          # objclean, not clean: `clean` removes $(EE_BIN), which
          # defaults to the UI ELF, so cleaning here silently threw the
          # first build away and the emulator job booted nothing.
          # Bring-up step 1 alone: clear, hold, exit. The smallest ELF
          # that proves the boot and video path, so the first thing to
          # touch a console is the smallest surface that can fail.
          make -C runtime/sample objclean
          make -C runtime/sample MINIMAL=1 EE_BIN=minimal.elf
          make -C runtime/sample objclean
          make -C runtime/sample PROBE=1 EE_BIN=probe.elf
          # The bench instrument: cycling UI plus the once-a-second
          # telemetry line on stdout (PCSX2's console log captures it).
          make -C runtime/sample objclean
          make -C runtime/sample TELEMETRY=1 EE_BIN=telemetry.elf
          # The test card, which is a .uib and so needs an ELF of its
          # own: the sample embeds whatever UIB= points at, at build
          # time. Without this there is no way to run it on a console --
          # bring-up steps 6 and 8 both live on this card, and both were
          # unreachable at the bench while every other step had an ELF.
          # An instrument nobody can load is not an instrument.
          # STATIC=1 so the frame is frozen by construction rather than
          # because this card happens to have no focusables: a card you
          # photograph must not change while you are photographing it.
          make -C runtime/sample objclean
          make -C runtime/sample STATIC=1 EE_BIN=testcard.elf \
            UIB=../../examples/memcard/build/testcard.uib
          # The conformance grid: channel-6's `probe` screen, which is
          # screen 1 of that blob. SCREEN= is what makes it reachable;
          # STATIC=1 freezes the focus so the cells being read are not
          # moving while you read them.
          make -C runtime/sample objclean
          make -C runtime/sample STATIC=1 SCREEN=probe EE_BIN=conform.elf \
            UIB=../../examples/channel6/build/ui.uib
          # All must survive; the artifact is useless with any one
          # missing, and a missing ELF shows up downstream as a boot
          # failure rather than as a build error.
          test -f runtime/sample/ps2ui_sample.elf
          test -f runtime/sample/probe.elf
          test -f runtime/sample/minimal.elf
          test -f runtime/sample/telemetry.elf
          test -f runtime/sample/testcard.elf
          test -f runtime/sample/conform.elf
      - uses: actions/upload-artifact@v7
        with:
          name: ps2ui-sample-elf
          retention-days: 14
          path: |
            runtime/sample/ps2ui_sample.elf
            runtime/sample/probe.elf
            runtime/sample/minimal.elf
            runtime/sample/telemetry.elf
            runtime/sample/testcard.elf
            runtime/sample/conform.elf

  emulator:
    needs: [bake, elf]
    runs-on: ubuntu-latest
    continue-on-error: true # experimental until the first proven run
    env:
      # Named once, because it moved once. The `baked` artifact's root
      # is the least common ancestor of its paths, so adding a second
      # example relocated every file inside it -- and this job read the
      # previewer PNG from the old place in two steps, one of which
      # skipped silently when it was missing.
      PREVIEW: baked/memcard/build/preview.png
    # An emulator that comes up but never draws would otherwise sit on a
    # runner until the 6-hour default. Everything here is bounded work:
    # install, download, boot, one screenshot.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: baked
          path: baked
      - uses: actions/download-artifact@v8
        with:
          name: ps2ui-sample-elf
          path: elf
      - name: Install Play! and capture tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          # libgl1 alone is not enough: Play! links libOpenGL.so.0 and
          # libEGL, which on Ubuntu live in libopengl0 and libegl1. A
          # hosted runner has no GPU, so mesa's software rasteriser is
          # what actually serves GL here.
          sudo apt-get install -y \
            xvfb imagemagick fuse \
            libgl1 libopengl0 libegl1 libglx0 libgl1-mesa-dri
          python3 -m pip install Pillow

          # Play! is distributed from purei.org, not from GitHub releases
          # (jpd002/Play- publishes none), so no asset name under
          # releases/latest/download could ever have resolved. Walk the
          # stable tree instead: newest version directory, then its
          # 64-bit AppImage. --fail on every request, so a moved tree is
          # one clear error rather than an HTML page saved as an
          # executable.
          base=https://purei.org/downloads/play/stable
          version=$(curl -sSfL "$base/" \
            | python3 tools/play_appimage_url.py --latest-version)
          asset=$(curl -sSfL "$base/$version/" \
            | python3 tools/play_appimage_url.py --appimage)
          echo "Play! $version: $asset"

          curl -sSfL -o Play.AppImage "$base/$version/$asset"
          # Record what we actually ran. Backlog S4 wants this pinned to a
          # checksum; printing it is the step before that, and it makes a
          # silently-swapped asset visible in the log.
          sha256sum Play.AppImage
          file Play.AppImage

          chmod +x Play.AppImage
          ./Play.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/AppRun

          # A hosted runner has no sound card, so alsa-lib fails to open
          # the default PCM. Point the default at ALSA's built-in null
          # sink; nothing here listens to the emulator.
          printf 'pcm.!default { type null }\nctl.!default { type null }\n' \
            > "$HOME/.asoundrc"
      - name: Boot ELF headless and capture a frame
        env:
          # No GPU on a hosted runner, so force the software path rather
          # than let Play! fail probing for one.
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          # Whichever audio backend the AppImage was built against, send
          # it nowhere rather than let it hunt for a device.
          SDL_AUDIODRIVER: dummy
          ALSOFT_DRIVERS: "null"
        run: |
          # A 640x448 root does NOT give a 1:1 capture, which is what
          # this step assumed for its whole life. Play! fullscreen scales
          # 1.394x and anchors top-left, so on a root the size of the
          # canvas the right third and bottom quarter of the frame fall
          # off the screen entirely -- and this is the capture that gets
          # pixel-diffed against the previewer, so the diff was defined
          # by the distortion. The probe step found it; the probe step is
          # also the one that could afford it, being read as a palette.
          #
          # Give Play! room, then trim the desktop border back off. Trim
          # rather than a hardcoded crop because the scale factor is a
          # property of a Play! build, not of anything here: `-trim`
          # finds the rendered frame by looking for it. 5% fuzz is safe
          # against the canvas ground (#0a0e1a sits ~12% off black), so
          # it removes the desktop and stops at the frame edge.
          xvfb-run -s "-screen 0 1280x896x24" sh -c '
            ./squashfs-root/AppRun --fullscreen --elf elf/ps2ui_sample.elf \
              >play.log 2>&1 &
            PLAY_PID=$!
            sleep 25
            # A dead emulator still lets `import` capture an empty root,
            # which then fails the diff as though the renderer were wrong.
            # Say which one it was.
            if ! kill -0 $PLAY_PID 2>/dev/null; then
              wait $PLAY_PID
              echo "Play! exited before the capture (status $?); its output:"
              cat play.log
              exit 1
            fi
            import -window root captured.png
            identify captured.png
            kill $PLAY_PID 2>/dev/null || true
            # TERM is a request. Give it a moment, then insist, so a
            # wedged emulator cannot hold the step open.
            sleep 2
            kill -9 $PLAY_PID 2>/dev/null || true
          '
      - name: Bring-up step 2 — do solid fills draw at all?
        if: always()
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          SDL_AUDIODRIVER: dummy
          ALSOFT_DRIVERS: "null"
        run: |
          # Reports, never fails. The UI diff answers "is the frame
          # right"; this answers "which primitive paths work", which is
          # the question you actually need when the answer to the first
          # one is no. Its four colours appear in no example, so the
          # fingerprint alone identifies what survived.
          # Play! fullscreen does not present 1:1 -- it scales 1.394x and
          # anchors top-left, so on a 640x448 root the capture loses the
          # right third of the frame and took probe columns 5 and 6 with
          # it. Give it room; the probe capture is read as a palette, not
          # diffed pixel-for-pixel, so a larger root costs nothing here.
          xvfb-run -s "-screen 0 1280x896x24" sh -c '
            ./squashfs-root/AppRun --fullscreen --elf elf/probe.elf \
              >probe.log 2>&1 &
            P=$!
            sleep 20
            if kill -0 $P 2>/dev/null; then
              import -window root probe.png
            else
              echo "probe ELF exited early:"; cat probe.log
            fi
            kill -9 $P 2>/dev/null || true
          ' || true
          if [ -f probe.png ]; then
            # One fingerprint, no verdict. Self-comparing printed
            # "-> OK" under a step asking whether anything drew, which
            # reads as a pass whatever the frame contains.
            python3 tools/framediff.py probe.png --stats-only || true
          fi
      - name: Trim the capture back to the framebuffer
        if: always()
        run: |
          if [ ! -f captured.png ]; then
            echo "no capture to trim"; exit 0
          fi
          RAW=$(identify -format '%wx%h' captured.png)
          RW=$(identify -format '%w' captured.png)
          RH=$(identify -format '%h' captured.png)
          echo "raw capture: $RAW"
          # -trim takes its reference from the image's CORNER PIXEL.
          # -bordercolor feeds -border/-frame, not -trim, so naming it
          # here would only look like it was setting the reference. The
          # Xvfb root is black and Play! letterboxes onto it, so the
          # corner is the border; 5% fuzz is safe against the canvas
          # ground, which sits ~12% off black.
          convert captured.png -fuzz 5% -trim +repage trimmed.png
          TW=$(identify -format '%w' trimmed.png)
          TH=$(identify -format '%h' trimmed.png)
          echo "trimmed to : ${TW}x${TH}"
          # Three independent conditions, because shape alone cannot
          # carry this. The root is deliberately sized to hold Play!'s
          # 1.4x presentation, and any root that does is liable to be
          # near the canvas aspect itself -- so "canvas-shaped" is
          # satisfied by an untrimmed root, which is the single most
          # likely bad capture. Size says the trim did something;
          # area says it did not run away; aspect says what is left is
          # the frame. Derived from the capture, never hardcoded, so a
          # change of root cannot leave this checking a stale model.
          awk -v rw="$RW" -v rh="$RH" -v tw="$TW" -v th="$TH" 'BEGIN {
            r = tw / th
            area = (tw * th) / (rw * rh)
            printf "aspect     : %.3f (want 1.38..1.48)\n", r
            printf "area       : %.1f%% of root (want 25..90)\n", area * 100
            bad = 0
            if (tw == rw && th == rh) {
              print "FAIL: trim found nothing -- this is the whole root, not the frame."
              bad = 1
            }
            if (area < 0.25 || area > 0.90) {
              printf "FAIL: trimmed area %.1f%% of the root is not a presented frame.\n", area * 100
              bad = 1
            }
            if (r < 1.38 || r > 1.48) {
              printf "FAIL: aspect %.3f is not the 1.429 canvas.\n", r
              bad = 1
            }
            if (bad) {
              print "Refusing to diff a capture this step cannot vouch for."
              exit 1
            }
          }'
          convert trimmed.png -resize 640x448\! captured.png
          echo "final      : $(identify -format '%wx%h' captured.png)"

      - name: Resampling floor of the capture pipeline
        if: always()
        run: |
          # Play! upscales ~1.4x and the trim step scales back down, so
          # the diff below has a non-zero floor before the renderer is
          # considered at all. Measure it on the previewer PNG alone,
          # round-tripped through the same two resizes with no renderer
          # involved, and print it next to the real number. Quoting an
          # RMSE without its floor invites reading resampling noise as a
          # rendering fault.
          # Not `if [ -f ]`: a missing ground truth used to skip this
          # step without a word, so the floor silently stopped being
          # measured and the diff below quoted an RMSE with nothing to
          # read it against. Say so instead.
          if [ ! -f "$PREVIEW" ]; then
            echo "no ground truth at $PREVIEW -- floor not measured"
            ls -R baked || true
            exit 1
          fi
          convert "$PREVIEW" -resize 900x630\! -resize 640x448\! floor.png
          python3 tools/framediff.py "$PREVIEW" floor.png \
            --rmse 999 --tile-rmse 999 || true

      - name: Bring-up step 6 — do texels land on pixel centres?
        if: always()
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          SDL_AUDIODRIVER: dummy
          ALSOFT_DRIVERS: "null"
        run: |
          # The card exists for this question and nothing was ever
          # pointed at it: the emulator booted the UI and the step 2
          # probe, never testcard.elf, so step 6 needed a console to
          # answer even though the instrument was sitting in the
          # artifact.
          #
          # Read, not diffed. Play! presents at ~1.4x and the capture is
          # scaled back down, so a pixel-wise diff of this card would
          # measure the resampler. The card is built to be read as
          # "patterned or flat" against a flat reference in the same
          # frame, which survives any scaling the capture applies.
          xvfb-run -s "-screen 0 1280x896x24" sh -c '
            ./squashfs-root/AppRun --fullscreen --elf elf/testcard.elf \
              >testcard.log 2>&1 &
            P=$!
            sleep 20
            if kill -0 $P 2>/dev/null; then
              import -window root testcard_raw.png
            else
              echo "test card ELF exited early:"; cat testcard.log
            fi
            kill -9 $P 2>/dev/null || true
          ' || true
          if [ ! -f testcard_raw.png ]; then
            echo "no test card capture"; exit 0
          fi
          convert testcard_raw.png -fuzz 5% -trim +repage \
            -resize 640x448\! testcard.png
          identify -format 'trimmed to %wx%h\n' testcard.png
          # Reports, never gates. Its verdict is advisory until a console
          # has read the same card by eye -- Play! has already been wrong
          # about the GS once (per-sprite alpha, see the hardware log),
          # and a sampling verdict from an emulator is a lead, not a
          # finding.
          python3 tools/read_testcard.py testcard.png --report-only

      - name: Diff against previewer ground truth
        run: |
          # --stats prints a colour fingerprint of both frames. An RMSE
          # says they differ; the palette says how, which is the only
          # way to read this failure without opening the artifact.
          python3 tools/framediff.py "$PREVIEW" captured.png \
            --out framediff.png --rmse 8 --tile-rmse 32 --stats
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: emulator-frames
          retention-days: 14
          path: |
            captured.png
            framediff.png
            probe.png
            testcard.png
