# Hardware-path verification scaffold (backlog F1).
#
# Job graph:
#   bake      — host toolchain builds the example blob + previewer PNGs
#               and the alignment test card (backlog B3)
#   elf       — the real ps2ui.c + sample compile inside the ps2dev
#               toolchain container; proves the console build, uploads
#               the ELF for anyone to run on hardware/emulator
#   emulator  — GATING since the DMA-alignment fix (#40): boots the ELF
#               in the Play! emulator (HLE BIOS, so legally runnable in
#               CI), captures a frame, and image-diffs it against the
#               previewer ground truth with tools/framediff.py. It ran
#               red for its entire experimental life because the render
#               genuinely was wrong -- the fault was deterministic DMA
#               address truncation, which faithful emulators reproduce
#               -- and has been green on every run since the fix. A red
#               here is a real texture-path regression, not noise;
#               docs/bringup.md holds the local PCSX2 procedure.

name: hw

on:
  push:
    branches: [main]
  pull_request:
  # A bench session cannot get a new instrument built without opening a
  # pull request, which is friction in exactly the place where friction
  # costs the most -- somebody is sitting in front of a console waiting.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hw-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pinned runner image, not ubuntu-latest (#43 follow-up). The emulator
  # gate's calibration band (4.79-4.81 / 13.73) is a property of this
  # workflow's WHOLE capture stack, and half of that stack -- Mesa's
  # llvmpipe, ImageMagick, xvfb -- ships with the runner image, unpinned
  # by "latest". The Play! binary is already pinned by SHA-256; a silent
  # runner-image bump was the remaining way for every RMSE to move
  # overnight with no diff to point at. When bumping this pin, re-read
  # the calibration comment on the gated diff step and expect to
  # re-measure the band. ghcr.io/ps2dev/ps2dev:latest stays deliberately
  # UNpinned: the TFX compile probe exists to notice gsKit changing, and
  # freezing the container would freeze the watch.
  bake:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install baker deps
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          python3 -m pip install Pillow
      - name: Bake example + test card
        run: |
          ./examples/memcard/build.sh
          # The channel-6 blob carries the `probe` conformance screen,
          # which is where bring-up steps 3, 4, 5 and 7 are read. Only
          # ci.yml built it before, and ci.yml produces no ELF, so those
          # four steps had nothing to run at the bench.
          ./examples/channel6/build.sh
          ./examples/opl-env/build.sh
          # main.c carries a fixed static arena. If opl-env outgrows it
          # the driver boots to solid red -- a correct signal, but one
          # that costs a bench sitting to receive, so fail here instead.
          #
          # This lives in `bake` and not in `elf` where the ELF is
          # built, because `elf` runs inside the ps2dev container and
          # that image has no python3: the first version of this step
          # exited 127 there. A check placed where it cannot run is
          # worth nothing, and this one at least had the manners to
          # error rather than pass.
          python3 - <<'PY'
          import re, sys
          sys.path.insert(0, "packages/baker")
          from ps2ui_bake.uib import read_uib
          from ps2ui_bake import arena as A
          need = A.arena_size(read_uib("examples/opl-env/build/ui.uib"))
          src = open("runtime/sample/main.c").read()
          have = eval(re.search(r"static uint8_t arena\[([^\]]+)\]", src).group(1))
          print(f"oplenv arena: needs {need} B, main.c provides {have} B")
          if need > have:
              sys.exit(f"::error::opl-env needs {need} B of arena; main.c "
                       f"provides {have}. Raise it, or the driver boots to "
                       f"solid red at the bench.")
          PY
          # Phase 2's environment. The elf job builds oplenv.elf
          # against THIS blob, so it has to exist here and travel in
          # the `baked` artifact -- a driver built against a missing
          # blob is a build failure at best and a stale one at worst.
          # The Phase 1 streaming bench: a blob with four streamed
          # slots, the covers that fill them, and the three reference
          # pictures a sitting is read against. Its own artifact, not
          # `baked`: upload-artifact roots a bundle at the least common
          # ancestor of its paths, so adding a fixtures/ path to that
          # one would silently re-root every examples/ path in it and
          # the elf job's download would land somewhere else.
          ./fixtures/bench-stream/build.sh
          python3 tools/make_cover_raw.py --self-test
          python3 tools/make_testcard.py examples/memcard/build/testcard.uib \
            --preview examples/memcard/build/testcard-expected.png
          python3 tools/framediff.py --self-test
          python3 tools/read_testcard.py --self-test
          python3 tools/play_appimage_url.py --self-test
      - name: Validate every blob against the runtime's assumptions
        run: |
          # Independent of the bakers that produced them: ps2ui-check
          # re-reads each file and asserts the invariants ps2ui.c relies
          # on but cannot afford to verify at load time. The rules live
          # in the script so this workflow and ci.yml cannot disagree
          # about what "valid" means for the same bytes.
          ./tools/check-blobs.sh
          # conform.elf is built SCREEN=probe. That name lives in
          # probe.html and nothing else in the tree forces the two to
          # agree, so a rename would produce an ELF that holds solid
          # blue -- a failure nobody discovers until a console is
          # already on the bench.
          PYTHONPATH=packages/baker python3 - <<'PY'
          import sys
          from ps2ui_bake.uib import read_uib
          blob = 'examples/channel6/build/ui.uib'
          names = [s['name'] for s in read_uib(blob).screens]
          if 'probe' not in names:
              sys.exit("conform.elf opens on screen 'probe'; blob has %s" % names)
          print('ok - the channel-6 blob has the screen conform.elf opens on')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: baked
          retention-days: 14
          path: |
            examples/memcard/build/ui.uib
            examples/memcard/build/preview.png
            examples/memcard/build/testcard.uib
            examples/opl-env/build/ui.uib
            examples/memcard/build/testcard-expected.png
            examples/channel6/build/ui.uib
      - uses: actions/upload-artifact@v7
        with:
          name: bench-stream
          retention-days: 14
          path: |
            fixtures/bench-stream/build/bench.uib
            fixtures/bench-stream/build/covers/cover0.raw
            fixtures/bench-stream/build/covers/cover1.raw
            fixtures/bench-stream/build/covers/cover2.raw
            fixtures/bench-stream/build/covers/cover3.raw
            fixtures/bench-stream/build/preview-unfilled.png
            fixtures/bench-stream/build/preview-filled.png
            fixtures/bench-stream/build/preview-composited.png

  elf:
    needs: bake
    runs-on: ubuntu-24.04
    container: ghcr.io/ps2dev/ps2dev:latest
    steps:
      - uses: actions/checkout@v7
      # upload-artifact stores paths relative to their least common
      # ancestor, which across the memcard and channel-6 blobs is
      # `examples/`. Downloading there puts each one back exactly where
      # its build.sh left it -- and the guard below is what keeps that
      # a fact rather than an assumption, because a wrong root here
      # would surface as a linker error about a missing ui_uib.c
      # rather than as "the blob is not where you thought".
      - uses: actions/download-artifact@v8
        with:
          name: baked
          path: examples
      - uses: actions/download-artifact@v8
        with:
          name: bench-stream
          path: fixtures/bench-stream/build
      - name: Every blob the ELF builds against is present
        run: |
          test -f examples/memcard/build/ui.uib
          test -f examples/memcard/build/testcard.uib
          test -f examples/channel6/build/ui.uib
          test -f examples/opl-env/build/ui.uib
          test -f fixtures/bench-stream/build/bench.uib
      - name: gsKit still has no per-texture TFX field
        continue-on-error: true
        run: |
          apk add --no-cache make
          # Settled, not open: gsKit declares no GSTEXTURE::Function and
          # every one of its GS_SETREG_TEX0 sites passes a hardcoded 0
          # in the tfx position, which is MODULATE. ps2ui therefore sets
          # no TFX at all and gets the mode it wants anyway.
          #
          # This step exists so that stays true. If a future gsKit adds
          # a per-texture TFX, the comment in ps2ui.c goes stale and the
          # tinting question reopens -- and the log is where that shows
          # up first. Reports, never gates.
          #
          # It ships with a control arm because the first version of it
          # did not, and was void: it omitted -D_EE, so every compile
          # died in tamtypes.h before the struct was ever parsed, and it
          # printed "absent, as expected" on a test that had not run.
          # The control assigns a field gsKit certainly has. If the
          # control does not build, this step knows nothing and says so
          # rather than reporting the failure it was hoping for.
          GCC="mips64r5900el-ps2-elf-gcc -c -std=c99 -D_EE \
               -I$PS2DEV/gsKit/include -I$PS2SDK/ee/include \
               -I$PS2SDK/common/include"
          cat > /tmp/ctl.c <<'EOF'
          #include <gsKit.h>
          int main(void) { GSTEXTURE t; t.Filter = 0; return (int)t.Filter; }
          EOF
          cat > /tmp/fn.c <<'EOF'
          #include <gsKit.h>
          int main(void) { GSTEXTURE t; t.Function = 0; return (int)t.Function; }
          EOF
          if ! $GCC /tmp/ctl.c -o /tmp/ctl.o 2>/tmp/ctl.err; then
            echo "RESULT: VOID -- the control arm does not build either, so a"
            echo "        failure on ::Function would mean nothing. Fix this step."
            sed -n '1,10p' /tmp/ctl.err
            exit 0
          fi
          echo "control ok: GSTEXTURE::Filter compiles, so the struct is being parsed"
          if $GCC /tmp/fn.c -o /tmp/fn.o 2>/tmp/fn.err; then
            echo "RESULT: GSTEXTURE::Function EXISTS in this gsKit -- this is new."
            echo "        Re-read docs/bringup.md step 4; the finding it records has changed."
          else
            echo "RESULT: GSTEXTURE::Function absent, as expected."
            sed -n '1,5p' /tmp/fn.err
          fi
          grep -rn "define GS_TFX_" $PS2DEV/gsKit/include/*.h 2>/dev/null | head -5 \
            || echo "        (no GS_TFX_* macros in the gsKit headers either)"
      - name: Build sample ELF with the PS2SDK toolchain
        run: |
          apk add --no-cache make
          # STATIC=1: hold the baked initial focus. The emulator job
          # screenshots at a wall-clock moment, so a build that cycles
          # focus would be compared against whichever state happened to
          # be up, which is not a test.
          make -C runtime/sample STATIC=1
          # The bring-up step 2 instrument. EE_BIN names the output
          # directly rather than building and renaming around `clean`:
          # `clean` currently spares the renamed file, but only by
          # accident, and adding *.elf to it later would silently drop
          # the UI ELF from the artifact.
          # objclean, not clean: `clean` removes $(EE_BIN), which
          # defaults to the UI ELF, so cleaning here silently threw the
          # first build away and the emulator job booted nothing.
          # Bring-up step 1 alone: clear, hold, exit. The smallest ELF
          # that proves the boot and video path, so the first thing to
          # touch a console is the smallest surface that can fail.
          make -C runtime/sample objclean
          make -C runtime/sample MINIMAL=1 EE_BIN=minimal.elf
          make -C runtime/sample objclean
          make -C runtime/sample PROBE=1 EE_BIN=probe.elf
          # Bring-up step 6b. Seven columns over an aperiodic bar
          # pattern, one variable per column, each above an untextured
          # reference of itself: the reading is which column's seam is
          # visible. No blob, and no ps2ui except in exactly one place:
          # column G builds its palette through the runtime's own CLUT
          # convention (ps2ui_clut_csm1 under PS2UI_CLUT_PERMUTE), so
          # the pair of ELFs below is a machine-readable A/B on the
          # convention itself. probe6-linear ships the wrong arm on
          # purpose; the emulator job asserts that column G reads
          # orange-dominant in the first and teal-dominant in the
          # second, which convicts both the runtime's convention and
          # the instrument's ability to see it, every run.
          make -C runtime/sample objclean
          make -C runtime/sample PROBE6=1 EE_BIN=probe6.elf
          make -C runtime/sample objclean
          make -C runtime/sample PROBE6=1 LINEAR_CLUT=1 EE_BIN=probe6-linear.elf
          # The bench instrument: cycling UI plus the once-a-second
          # telemetry line on stdout (PCSX2's console log captures it).
          make -C runtime/sample objclean
          make -C runtime/sample TELEMETRY=1 EE_BIN=telemetry.elf
          # The test card, which is a .uib and so needs an ELF of its
          # own: the sample embeds whatever UIB= points at, at build
          # time. Without this there is no way to run it on a console --
          # bring-up steps 6 and 8 both live on this card, and both were
          # unreachable at the bench while every other step had an ELF.
          # An instrument nobody can load is not an instrument.
          # STATIC=1 so the frame is frozen by construction rather than
          # because this card happens to have no focusables: a card you
          # photograph must not change while you are photographing it.
          make -C runtime/sample objclean
          make -C runtime/sample STATIC=1 EE_BIN=testcard.elf \
            UIB=../../examples/memcard/build/testcard.uib
          # Bring-up step 3's A/B. The CSM1 permutation is an involution,
          # so "never applied" and "applied twice" produce the identical
          # picture and no host test can separate them -- the host has
          # no GS. These two ELFs differ in exactly one thing, so the
          # comparison names which side of the involution this build is
          # on. Hardware shows the memcard UI's text as garbled noise,
          # which is the symptom bringup.md step 3 predicts for a
          # double-permute, and the emulator reproduces it.
          make -C runtime/sample objclean
          make -C runtime/sample STATIC=1 LINEAR_CLUT=1 EE_BIN=sample-linear.elf
          make -C runtime/sample objclean
          make -C runtime/sample STATIC=1 SCREEN=probe LINEAR_CLUT=1 \
            EE_BIN=conform-linear.elf \
            UIB=../../examples/channel6/build/ui.uib
          # The conformance grid: channel-6's `probe` screen, which is
          # screen 1 of that blob. SCREEN= is what makes it reachable;
          # STATIC=1 freezes the focus so the cells being read are not
          # moving while you read them.
          make -C runtime/sample objclean
          make -C runtime/sample STATIC=1 SCREEN=probe EE_BIN=conform.elf \
            UIB=../../examples/channel6/build/ui.uib
          # Bring-up step 4b's reference arm. gsKit passes
          # gsGlobal->PrimAlphaEnable as TEX0.TCC at all 30 of its TEX0
          # sites, so forcing it off tells the GS the glyph atlas has no
          # alpha channel. This ELF is a picture of that fault, to hold
          # next to a photograph of the real one -- it is not testing a
          # hypothesis, it is showing what the hypothesis predicts.
          make -C runtime/sample objclean
          make -C runtime/sample STATIC=1 SCREEN=probe NO_ALPHA=1 \
            EE_BIN=conform-noalpha.elf \
            UIB=../../examples/channel6/build/ui.uib
          # The Phase 1 streaming bench and its falsification arm. This
          # is the only pair here that reads a file at runtime: the
          # covers come off mass:/ps2ui, because ps2ui_tex_set takes
          # decoded texels and the EE has no decoder. With no drive the
          # ELF generates the same pattern from cover_pattern.h, which
          # both suites check against the host generator, so a sitting
          # produces a reading either way.
          #
          # covers-nosync is what a live cache fault looks like: the EE
          # writes texels through a write-back cache the GIF cannot
          # see, so without the writeback the GS DMAs whatever was at
          # that address. Same role as conform-noalpha -- a picture of
          # the fault to hold next to a photograph, not a test.
          make -C runtime/sample objclean
          # USB=1 embeds the IOP mass-storage stack and brings it up.
          # The first sitting reported `open cover0: -1` from a stick
          # whose files were byte-exact: wLaunchELF launches via
          # LoadExecPS2, which resets the IOP, so the launcher's own
          # drivers are gone before this ELF runs. Nothing survives a
          # reset -- the ELF has to carry them.
          #
          # This whole path is container-only: sifrpc.h and friends do
          # not exist on the host, and this tree no longer writes
          # shims to pretend otherwise. That makes THIS STEP the only
          # thing that vouches for it, which is the arrangement
          # runtime/vendor/README.md now spells out.
          make -C runtime/sample COVERS=1 USB=1 EE_BIN=covers.elf \
            UIB=../../fixtures/bench-stream/build/bench.uib
          # Checked HERE, before objclean removes the generated file.
          # An empty module table links perfectly well and produces an
          # ELF that can never read a drive -- it would say "no IOP
          # modules embedded" at a bench, which is a wasted trip for a
          # fault this job can see from the SDK's own directory
          # listing. Also prints which stack was found, so a change of
          # SDK vintage shows up in the log rather than as a different
          # failure six months later.
          grep -q 'irx_stack_name = "bdm"' runtime/sample/irx_table.c \
            || grep -q 'irx_stack_name = "legacy"' runtime/sample/irx_table.c \
            || { echo "embed_irx.sh found no complete IOP stack. Present:"; \
                 ls "$PS2SDK/iop/irx" | head -40; exit 1; }
          grep 'irx_stack_name' runtime/sample/irx_table.c
          make -C runtime/sample objclean
          make -C runtime/sample COVERS=1 USB=1 NO_SYNC=1 \
            EE_BIN=covers-nosync.elf \
            UIB=../../fixtures/bench-stream/build/bench.uib
          # The baseline-row discriminator (bench step S7). The first
          # sitting found capitals losing their bottom row on a
          # television -- E as F, L as I, 2 as ? -- while the previewer
          # and the emulator both render full glyphs from the same GIF
          # command stream. That acquits the atlas, the glyph table,
          # the UVs and the geometry, and leaves the display path
          # against real GS behaviour Play! does not model.
          #
          # This is the memcard UI, identical in every respect except
          # 480p instead of 480i, so the video mode is the only
          # variable. Full glyphs at 480p acquits the renderer; still
          # clipped convicts the UV convention.
          make -C runtime/sample objclean
          make -C runtime/sample STATIC=1 PROGRESSIVE=1 \
            EE_BIN=ps2ui_sample_480p.elf
          # The height ladder (bench step S8). The first sitting's S7a
          # reading killed both of the hypotheses the discriminator was
          # built to separate: a one-texel hyphen survives while the
          # two-texel bar of an E on the same line does not, so it is
          # neither "the last row of every quad" nor a panel eating
          # thin horizontal strokes. What is left has to treat a tall
          # quad differently from a short one.
          #
          # Twelve rungs, three arms, one question asked three ways.
          # No blob and no ps2ui in the path, for probe6's reason.
          make -C runtime/sample objclean
          make -C runtime/sample LADDER=1 EE_BIN=ladder.elf
          # Ladder v2 (bench step S10): four bias magnitudes against
          # twelve heights, on a texture with the per-row and
          # per-column detail v1 lacked. v1's bias arm could not fail.
          make -C runtime/sample objclean
          make -C runtime/sample LADDER2=1 EE_BIN=ladder2.elf
          # The Phase 2 driver. Loads the OPL-class environment, scrolls
          # its windowed library, streams a cover into each of the nine
          # per-row reservations as the window moves, and reports frame
          # time, prim count and upload bytes on screen -- the three
          # numbers the Phase 2 exit gate asks for. Built against
          # opl-env's blob rather than memcard's.
          make -C runtime/sample objclean
          make -C runtime/sample OPLENV=1 \
            UIB=../../examples/opl-env/build/ui.uib EE_BIN=oplenv.elf
          # P3a's falsification arm, and it ships as its own ELF rather
          # than a runtime toggle so the bench cannot accidentally read
          # one build and think it read the other. gs is only a
          # measurement if this one moves it; if both ELFs report the
          # same gs, the instrument is latched and no conclusion may be
          # drawn from either.
          make -C runtime/sample objclean
          make -C runtime/sample OPLENV=1 FILL=1 \
            UIB=../../examples/opl-env/build/ui.uib EE_BIN=oplenv-fill.elf
          # All must survive; the artifact is useless with any one
          # missing, and a missing ELF shows up downstream as a boot
          # failure rather than as a build error.
          test -f runtime/sample/ps2ui_sample.elf
          test -f runtime/sample/probe.elf
          test -f runtime/sample/probe6.elf
          test -f runtime/sample/probe6-linear.elf
          test -f runtime/sample/oplenv.elf
          test -f runtime/sample/oplenv-fill.elf
          test -f runtime/sample/minimal.elf
          test -f runtime/sample/telemetry.elf
          test -f runtime/sample/testcard.elf
          test -f runtime/sample/conform.elf
          test -f runtime/sample/sample-linear.elf
          test -f runtime/sample/conform-linear.elf
          test -f runtime/sample/conform-noalpha.elf
          test -f runtime/sample/covers.elf
          test -f runtime/sample/covers-nosync.elf
          test -f runtime/sample/ps2ui_sample_480p.elf
          test -f runtime/sample/ladder.elf
          test -f runtime/sample/ladder2.elf
          test -f runtime/sample/oplenv.elf
      - uses: actions/upload-artifact@v7
        with:
          name: ps2ui-sample-elf
          retention-days: 14
          path: |
            runtime/sample/ps2ui_sample.elf
            runtime/sample/probe.elf
            runtime/sample/probe6.elf
            runtime/sample/probe6-linear.elf
            runtime/sample/minimal.elf
            runtime/sample/telemetry.elf
            runtime/sample/testcard.elf
            runtime/sample/conform.elf
            runtime/sample/sample-linear.elf
            runtime/sample/conform-linear.elf
            runtime/sample/conform-noalpha.elf
            runtime/sample/covers.elf
            runtime/sample/covers-nosync.elf
            runtime/sample/ps2ui_sample_480p.elf
            runtime/sample/ladder.elf
            runtime/sample/ladder2.elf
            runtime/sample/oplenv.elf
            runtime/sample/oplenv-fill.elf

  emulator:
    needs: [bake, elf]
    runs-on: ubuntu-24.04
    # No continue-on-error, deliberately. The probation this job shipped
    # with ("experimental until the first proven run") ended when the
    # ground-truth diff went green at #40 and stayed green through two
    # texture-path refactors. An advisory gate is a gate nobody reads:
    # the alignment bug sat behind a red-but-ignorable X for the
    # emulator job's whole life. If Play!'s download or xvfb ever turn
    # out to flake, fix or pin THAT -- do not put the blindfold back on.
    env:
      # Named once, because it moved once. The `baked` artifact's root
      # is the least common ancestor of its paths, so adding a second
      # example relocated every file inside it -- and this job read the
      # previewer PNG from the old place in two steps, one of which
      # skipped silently when it was missing.
      PREVIEW: baked/memcard/build/preview.png
      # The emulator is a pinned dependency, not a moving target -- see
      # the install step. Bump all three together, then re-read the diff
      # numbers: a new Play! may legitimately move the RMSE, and the
      # thresholds below are calibrated against THIS build.
      PLAY_VERSION: "0.72"
      PLAY_ASSET: "Play!-8de4a71f-x86_64.AppImage"
      PLAY_SHA256: "5523586c7d89f90e0e6eb9cbc70008d1d6ef3d38656fea809517d3f5fd3004d3"
      PLAY_CACHE: "/home/runner/.cache/ps2ui-play"
      # Seconds. Sized against timeout-minutes below minus the
      # emulator work, so the retry loop always has room to reach its
      # own error message rather than dying on the job timeout.
      PLAY_FETCH_BUDGET: "300"
    # An emulator that comes up but never draws would otherwise sit on a
    # runner until the 6-hour default. Everything here is bounded work:
    # install, download, boot, one screenshot.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: baked
          path: baked
      - uses: actions/download-artifact@v8
        with:
          name: ps2ui-sample-elf
          path: elf
      # Keyed on the pinned build AND its digest, so bumping either
      # misses the cache rather than serving the old binary under a new
      # name. No restore-keys, deliberately: a partial-prefix hit is
      # exactly how the wrong emulator would get served silently.
      - uses: actions/cache@v4
        with:
          path: ${{ env.PLAY_CACHE }}
          key: play-${{ env.PLAY_VERSION }}-${{ env.PLAY_SHA256 }}
      - name: Install Play! and capture tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          # libgl1 alone is not enough: Play! links libOpenGL.so.0 and
          # libEGL, which on Ubuntu live in libopengl0 and libegl1. A
          # hosted runner has no GPU, so mesa's software rasteriser is
          # what actually serves GL here.
          sudo apt-get install -y \
            xvfb imagemagick fuse \
            libgl1 libopengl0 libegl1 libglx0 libgl1-mesa-dri
          python3 -m pip install Pillow

          # Play! is distributed from purei.org, not from GitHub releases
          # (jpd002/Play- publishes none), so no asset name under
          # releases/latest/download could ever have resolved. The stable
          # tree is the supported path; we take one pinned build out of
          # it rather than whatever is newest. --fail on every request,
          # so a moved tree is one clear error rather than an HTML page
          # saved as an executable.
          base=https://purei.org/downloads/play/stable
          # PINNED, because this job gates. An unpinned emulator means the
          # next Play! release blocks every PR in the repo with no diff to
          # point at -- and the pressure in that moment is to reach for the
          # continue-on-error this job just gave up. The renderer under
          # test is an input like any other: it moves when we move it.
          echo "Play! $PLAY_VERSION (pinned): $PLAY_ASSET"
          # purei.org is one host with no mirror, and this job gates. A
          # single connect timeout there fails a PR that changed nothing
          # -- it cost a cycle on #59: 132s to time out, with no frame
          # ever rendered and no diff ever computed. That failure looks
          # at a glance exactly like a real red, which is the expensive
          # part, because it invites re-running a gate on reflex.
          #
          # The cache step above makes a hit skip the network entirely.
          # This retry only covers a cold cache, and it is bounded --
          # five attempts with a widening gap, then a real failure whose
          # message says which kind of failure it is. Never a fallback
          # to "latest": an unpinned emulator would move the thresholds
          # this job is calibrated against.
          if [ -f "$PLAY_CACHE/$PLAY_ASSET" ]; then
            echo "cache hit: $PLAY_CACHE/$PLAY_ASSET"
            cp "$PLAY_CACHE/$PLAY_ASSET" Play.AppImage
          else
            # The retry policy and the job's timeout have to agree, and
            # tuning two numbers until they do is how they drift apart.
            # The loop enforces the budget instead, so the ::error::
            # below is ALWAYS reachable -- the first version could not
            # reach it in the one case it was written for: at
            # --max-time 300, two stalled attempts plus a sleep is 610s
            # against a 600s job, so the job died on a generic timeout
            # and handed the reader exactly the ambiguous red this
            # change set out to remove.
            #
            # 600s job (timeout-minutes below), ~175s observed emulator
            # work, ~30s of apt: 300s is a fetch budget with room left.
            # A stalled transfer burns it in attempts of at most 90s; a
            # refused connection -- what #59 actually hit -- returns in
            # ~20s, so that case still gets all five.
            started=$(date +%s)
            ok=""
            for attempt in 1 2 3 4 5; do
              left=$(( PLAY_FETCH_BUDGET - ($(date +%s) - started) ))
              if [ "$left" -le 15 ]; then
                echo "::warning::Play! fetch budget of ${PLAY_FETCH_BUDGET}s spent before attempt $attempt"
                break
              fi
              cap=$(( left < 90 ? left : 90 ))
              if curl -sSfL --connect-timeout 20 --max-time "$cap" \
                   -o Play.AppImage "$base/$PLAY_VERSION/$PLAY_ASSET"; then
                ok=yes; break
              fi
              echo "::warning::Play! download attempt $attempt failed (${cap}s cap, ${left}s of budget left)"
              # Sleep only if the budget can still absorb it. Without
              # this the trailing backoff overshoots the budget by up
              # to 50s, so the loop would spend more than the number it
              # names -- and the whole point of the budget is that it
              # is the number, not an approximation of it.
              back=$(( attempt * 10 ))
              [ $(( PLAY_FETCH_BUDGET - ($(date +%s) - started) )) -gt "$back" ] \
                && sleep "$back" || true
            done
            [ -n "$ok" ] || {
              echo "::error::Play! could not be fetched from $base within ${PLAY_FETCH_BUDGET}s. This is a FETCH failure, not a render regression: no frame was captured and no diff was computed."
              exit 1
            }
          fi

          # Verify, do not merely print. A printed digest nobody reads is
          # the same blindfold in a different colour.
          echo "$PLAY_SHA256  Play.AppImage" | sha256sum -c -
          file Play.AppImage
          # Only ever cache a binary whose digest has just been checked,
          # so a truncated download cannot become a poisoned cache that
          # every later run then trusts without re-verifying.
          mkdir -p "$PLAY_CACHE"
          cp Play.AppImage "$PLAY_CACHE/$PLAY_ASSET"

          # A pin with no staleness signal rots quietly. Report whether a
          # newer stable exists -- never gate on it, and keep the
          # discovery code (and its self-test) exercised in the process.
          latest=$(curl -sSfL "$base/" \
            | python3 tools/play_appimage_url.py --latest-version) || latest=""
          if [ -n "$latest" ] && [ "$latest" != "$PLAY_VERSION" ]; then
            echo "::notice::Play! $latest is available; this job is pinned to $PLAY_VERSION. Bump PLAY_VERSION/PLAY_ASSET/PLAY_SHA256 together, then re-read the diff numbers -- the thresholds are calibrated against the pinned build."
          fi

          chmod +x Play.AppImage
          ./Play.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/AppRun

          # A hosted runner has no sound card, so alsa-lib fails to open
          # the default PCM. Point the default at ALSA's built-in null
          # sink; nothing here listens to the emulator.
          printf 'pcm.!default { type null }\nctl.!default { type null }\n' \
            > "$HOME/.asoundrc"
      - name: Boot ELF headless and capture a frame
        env:
          # No GPU on a hosted runner, so force the software path rather
          # than let Play! fail probing for one.
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          # Whichever audio backend the AppImage was built against, send
          # it nowhere rather than let it hunt for a device.
          SDL_AUDIODRIVER: dummy
          ALSOFT_DRIVERS: "null"
        run: |
          # A 640x448 root does NOT give a 1:1 capture, which is what
          # this step assumed for its whole life. Play! fullscreen scales
          # 1.394x and anchors top-left, so on a root the size of the
          # canvas the right third and bottom quarter of the frame fall
          # off the screen entirely -- and this is the capture that gets
          # pixel-diffed against the previewer, so the diff was defined
          # by the distortion. The probe step found it; the probe step is
          # also the one that could afford it, being read as a palette.
          #
          # Give Play! room, then trim the desktop border back off. Trim
          # rather than a hardcoded crop because the scale factor is a
          # property of a Play! build, not of anything here: `-trim`
          # finds the rendered frame by looking for it. 5% fuzz is safe
          # against the canvas ground (#0a0e1a sits ~12% off black), so
          # it removes the desktop and stops at the frame edge.
          xvfb-run -s "-screen 0 1280x896x24" sh -c '
            ./squashfs-root/AppRun --fullscreen --elf elf/ps2ui_sample.elf \
              >play.log 2>&1 &
            PLAY_PID=$!
            sleep 25
            # A dead emulator still lets `import` capture an empty root,
            # which then fails the diff as though the renderer were wrong.
            # Say which one it was.
            if ! kill -0 $PLAY_PID 2>/dev/null; then
              wait $PLAY_PID
              echo "Play! exited before the capture (status $?); its output:"
              cat play.log
              exit 1
            fi
            import -window root captured.png
            identify captured.png
            kill $PLAY_PID 2>/dev/null || true
            # TERM is a request. Give it a moment, then insist, so a
            # wedged emulator cannot hold the step open.
            sleep 2
            kill -9 $PLAY_PID 2>/dev/null || true
          '
      - name: Bring-up step 2 — do solid fills draw at all?
        if: always()
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          SDL_AUDIODRIVER: dummy
          ALSOFT_DRIVERS: "null"
        run: |
          # Reports, never fails. The UI diff answers "is the frame
          # right"; this answers "which primitive paths work", which is
          # the question you actually need when the answer to the first
          # one is no. Its four colours appear in no example, so the
          # fingerprint alone identifies what survived.
          # Play! fullscreen does not present 1:1 -- it scales 1.394x and
          # anchors top-left, so on a 640x448 root the capture loses the
          # right third of the frame and took probe columns 5 and 6 with
          # it. Give it room; the probe capture is read as a palette, not
          # diffed pixel-for-pixel, so a larger root costs nothing here.
          xvfb-run -s "-screen 0 1280x896x24" sh -c '
            ./squashfs-root/AppRun --fullscreen --elf elf/probe.elf \
              >probe.log 2>&1 &
            P=$!
            sleep 20
            if kill -0 $P 2>/dev/null; then
              import -window root probe.png
            else
              echo "probe ELF exited early:"; cat probe.log
            fi
            kill -9 $P 2>/dev/null || true
          ' || true
          if [ -f probe.png ]; then
            # One fingerprint, no verdict. Self-comparing printed
            # "-> OK" under a step asking whether anything drew, which
            # reads as a pass whatever the frame contains.
            python3 tools/framediff.py probe.png --stats-only || true
          fi
      - name: Bring-up step 6b — the probe's seams, and the CLUT verdict
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          SDL_AUDIODRIVER: dummy
          ALSOFT_DRIVERS: "null"
        run: |
          # The seam columns (A..F) are still captured, not graded: a
          # person reads them, and the artifact is that deliverable.
          # Column G is graded, here, as a gate. It renders indices the
          # CSM1 permutation exchanges through the runtime's own CLUT
          # convention, so its band is orange-dominant when the
          # convention is right and teal-dominant when it is wrong --
          # an AREA reading that survives the capture's scaling. This
          # is the check the RMSE gate structurally cannot be: a wrong
          # convention moves that diff ~0.02, inside tolerance by
          # design (see the calibration comment below).
          #
          # Both arms run. probe6-linear ships the WRONG convention on
          # purpose and must read `linear`: that leg convicts the
          # instrument every run -- if G ever stops seeing the fault
          # class, the falsification arm goes red, not silent.
          #
          # The reader proves it can fail before it is believed once.
          python3 tools/read_probe6.py --self-test
          for arm in probe6 probe6-linear; do
            xvfb-run -s "-screen 0 1280x896x24" sh -c "
              ./squashfs-root/AppRun --fullscreen --elf elf/$arm.elf \
                >$arm.log 2>&1 &
              P=\$!
              sleep 20
              if kill -0 \$P 2>/dev/null; then
                import -window root ${arm}_raw.png
              else
                echo '$arm ELF exited early:'; cat $arm.log
              fi
              kill -9 \$P 2>/dev/null || true
            "
            if [ ! -f ${arm}_raw.png ]; then
              echo "no $arm capture -- the gate cannot vouch"; exit 1
            fi
            # Same trim the UI capture gets, for the same reason: the
            # reader's rectangles live in the 640x448 frame, and the
            # raw root is Play!'s ~1.4x presentation on a desktop.
            convert ${arm}_raw.png -fuzz 5% -trim +repage \
              -resize 640x448\! $arm.png
            python3 tools/framediff.py $arm.png --stats-only || true
          done
          echo "--- shipped convention: must read permuted ---"
          python3 tools/read_probe6.py probe6.png --expect permuted
          echo "--- falsification arm: must read linear ---"
          python3 tools/read_probe6.py probe6-linear.png --expect linear

      - name: Trim the capture back to the framebuffer
        if: always()
        run: |
          if [ ! -f captured.png ]; then
            echo "no capture to trim"; exit 0
          fi
          RAW=$(identify -format '%wx%h' captured.png)
          RW=$(identify -format '%w' captured.png)
          RH=$(identify -format '%h' captured.png)
          echo "raw capture: $RAW"
          # -trim takes its reference from the image's CORNER PIXEL.
          # -bordercolor feeds -border/-frame, not -trim, so naming it
          # here would only look like it was setting the reference. The
          # Xvfb root is black and Play! letterboxes onto it, so the
          # corner is the border; 5% fuzz is safe against the canvas
          # ground, which sits ~12% off black.
          convert captured.png -fuzz 5% -trim +repage trimmed.png
          TW=$(identify -format '%w' trimmed.png)
          TH=$(identify -format '%h' trimmed.png)
          echo "trimmed to : ${TW}x${TH}"
          # Three independent conditions, because shape alone cannot
          # carry this. The root is deliberately sized to hold Play!'s
          # 1.4x presentation, and any root that does is liable to be
          # near the canvas aspect itself -- so "canvas-shaped" is
          # satisfied by an untrimmed root, which is the single most
          # likely bad capture. Size says the trim did something;
          # area says it did not run away; aspect says what is left is
          # the frame. Derived from the capture, never hardcoded, so a
          # change of root cannot leave this checking a stale model.
          awk -v rw="$RW" -v rh="$RH" -v tw="$TW" -v th="$TH" 'BEGIN {
            r = tw / th
            area = (tw * th) / (rw * rh)
            printf "aspect     : %.3f (want 1.38..1.48)\n", r
            printf "area       : %.1f%% of root (want 25..90)\n", area * 100
            bad = 0
            if (tw == rw && th == rh) {
              print "FAIL: trim found nothing -- this is the whole root, not the frame."
              bad = 1
            }
            if (area < 0.25 || area > 0.90) {
              printf "FAIL: trimmed area %.1f%% of the root is not a presented frame.\n", area * 100
              bad = 1
            }
            if (r < 1.38 || r > 1.48) {
              printf "FAIL: aspect %.3f is not the 1.429 canvas.\n", r
              bad = 1
            }
            if (bad) {
              print "Refusing to diff a capture this step cannot vouch for."
              exit 1
            }
          }'
          convert trimmed.png -resize 640x448\! captured.png
          echo "final      : $(identify -format '%wx%h' captured.png)"
          # Hand the REAL presented size to the reference step below.
          # That step used to hardcode 900x630 -- true for Play! 0.72 and
          # a stale model the moment a build presents at another scale,
          # which is exactly when someone would be reading it.
          echo "PRESENTED=${TW}x${TH}" >> "$GITHUB_ENV"

      - name: Resampling reference for the capture pipeline
        if: always()
        run: |
          # Play! upscales ~1.4x and the trim step scales back down, so
          # some of the diff below is resampling rather than rendering.
          # Measure that on the previewer PNG alone, round-tripped through
          # the same two resizes with no renderer involved.
          #
          # NOT a floor, despite what this step used to be called: the
          # real capture scores BELOW this number (4.8 against 6.4),
          # because ImageMagick's `-resize !` round trip loses more than
          # Play!'s upscale plus our downscale does. Read it as an
          # order-of-magnitude sanity check on the resampler, never as a
          # lower bound on the gate -- treating it as one would argue for
          # loosening the tolerance to ~8, which is how the gate stops
          # gating. The band that actually discriminates is printed
          # beside it.
          # Not `if [ -f ]`: a missing ground truth used to skip this
          # step without a word, so the floor silently stopped being
          # measured and the diff below quoted an RMSE with nothing to
          # read it against. Say so instead.
          if [ ! -f "$PREVIEW" ]; then
            echo "no ground truth at $PREVIEW -- reference not measured"
            ls -R baked || true
            exit 1
          fi
          # ${PRESENTED} comes from the trim step, which measured it.
          # This step is if:always(), so it can run when that step failed
          # and never exported one. Say so rather than feed `convert` an
          # empty geometry and report whatever it makes of it.
          if [ -z "${PRESENTED:-}" ]; then
            echo "trim step exported no presented size -- nothing to reference"
            exit 0
          fi
          convert "$PREVIEW" -resize "${PRESENTED}"\! -resize 640x448\! floor.png
          echo "round-tripped through ${PRESENTED} (the size Play! actually presented)"
          python3 tools/framediff.py "$PREVIEW" floor.png \
            --rmse 999 --tile-rmse 999 || true
          echo "healthy band for the gated diff: RMSE ~4.8, worst tile ~13.7"

      - name: Bring-up step 6 — do texels land on pixel centres?
        if: always()
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          SDL_AUDIODRIVER: dummy
          ALSOFT_DRIVERS: "null"
        run: |
          # The card exists for this question and nothing was ever
          # pointed at it: the emulator booted the UI and the step 2
          # probe, never testcard.elf, so step 6 needed a console to
          # answer even though the instrument was sitting in the
          # artifact.
          #
          # Read, not diffed. Play! presents at ~1.4x and the capture is
          # scaled back down, so a pixel-wise diff of this card would
          # measure the resampler. The card is built to be read as
          # "patterned or flat" against a flat reference in the same
          # frame, which survives any scaling the capture applies.
          xvfb-run -s "-screen 0 1280x896x24" sh -c '
            ./squashfs-root/AppRun --fullscreen --elf elf/testcard.elf \
              >testcard.log 2>&1 &
            P=$!
            sleep 20
            if kill -0 $P 2>/dev/null; then
              import -window root testcard_raw.png
            else
              echo "test card ELF exited early:"; cat testcard.log
            fi
            kill -9 $P 2>/dev/null || true
          ' || true
          if [ ! -f testcard_raw.png ]; then
            echo "no test card capture"; exit 0
          fi
          convert testcard_raw.png -fuzz 5% -trim +repage \
            -resize 640x448\! testcard.png
          identify -format 'trimmed to %wx%h\n' testcard.png
          # Reports, never gates. Its verdict is advisory until a console
          # has read the same card by eye -- Play! has already been wrong
          # about the GS once (per-sprite alpha, see the hardware log),
          # and a sampling verdict from an emulator is a lead, not a
          # finding.
          python3 tools/read_testcard.py testcard.png --report-only

      - name: Bring-up step 3 — is the CLUT permuted once, or twice?
        if: always()
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          SDL_AUDIODRIVER: dummy
          ALSOFT_DRIVERS: "null"
        run: |
          # The same UI with the CLUT uploaded linearly. Diffed against
          # the same ground truth as the ordinary build, so the two RMSE
          # numbers sit next to each other and the smaller one names the
          # correct convention. An involution cannot be argued about
          # from one side of it.
          xvfb-run -s "-screen 0 1280x896x24" sh -c '
            ./squashfs-root/AppRun --fullscreen --elf elf/sample-linear.elf \
              >linear.log 2>&1 &
            P=$!
            sleep 25
            if kill -0 $P 2>/dev/null; then
              import -window root linear_raw.png
            else
              echo "linear-CLUT ELF exited early:"; cat linear.log
            fi
            kill -9 $P 2>/dev/null || true
          ' || true
          if [ ! -f linear_raw.png ]; then
            echo "no linear-CLUT capture"; exit 0
          fi
          convert linear_raw.png -fuzz 5% -trim +repage \
            -resize 640x448\! linear.png
          echo "--- CLUT uploaded LINEARLY (permutation off) ---"
          python3 tools/framediff.py "$PREVIEW" linear.png \
            --out linear_diff.png --rmse 8 --tile-rmse 32 --stats || true
          echo "--- compare with the permuted build's number below ---"

      - name: Diff against previewer ground truth
        run: |
          # --stats prints a colour fingerprint of both frames. An RMSE
          # says they differ; the palette says how, which is the only
          # way to read this failure without opening the artifact.
          #
          # Thresholds are calibrated, not guessed -- against THIS
          # measurement and no other. Green runs of the gated (permuted)
          # build since the alignment fix sit at global RMSE 4.79-4.81
          # with the worst tile constant at 13.73. 6.5/24 is ~35%/75%
          # above that, and catches the historical failure signature
          # from a distance: the alignment bug sat at 22.9/96.4.
          #
          # The band excludes the linear-CLUT arm below (4.83/13.85).
          # That is a DIFFERENT ELF this step does not grade, and an
          # earlier version of this comment quoted its numbers as the
          # top of the range -- a threshold's calibration set may only
          # contain the quantity it thresholds.
          #
          # Note what this gate does NOT resolve: the linear-CLUT build
          # scores 4.83 and would pass here with 1.6 to spare. Red means
          # a real regression; green means no GROSS one. A wrong CLUT
          # convention is invisible at this tolerance and always was.
          #
          # If this fires without a texture change: compare against the
          # 4.8/13.7 band above, then the colour fingerprints, then
          # check whether PLAY_VERSION moved. Do NOT read the reference
          # step's number as a floor -- the healthy capture scores below
          # it, so it will always look like the tolerance is too tight.
          python3 tools/framediff.py "$PREVIEW" captured.png \
            --out framediff.png --rmse 6.5 --tile-rmse 24 --stats
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: emulator-frames
          retention-days: 14
          path: |
            captured.png
            framediff.png
            probe.png
            probe6.png
            probe6-linear.png
            testcard.png
            linear.png
            linear_diff.png
