# Does the PUBLISHED toolchain work, on a machine that is not ours?
#
# WHY THIS IS A SECOND WORKFLOW AND NOT A JOB IN ci.yml.
#
# ci.yml tests THIS TREE. It runs the tutorial through shims that point
# the five console scripts at the checkout, which is what makes it a
# check of the commit under test. This file tests THE RELEASE: the same
# document, driven by whatever `pip install ophtml` and `npm install -g
# @ophtml/layout` actually hand a stranger.
#
# Those are different subjects and neither replaces the other. Deleting
# the shims from check-tutorial.py to "modernise" it would silently
# swap one for the other, and ci.yml would then be testing the last
# published version instead of the branch in front of it.
#
# AND WHY IT IS NOT ON `push`. A registry job can only ever install
# what is published, so on a pull request it tests the previous
# release no matter what the pull request changes. It cannot gate a
# diff, and running it per-push would spend minutes saying nothing
# about the change. Weekly, on release, and on demand.
#
# It is also the only workflow here that depends on two third-party
# registries and Homebrew being up, which is a second reason to keep it
# out of the path of every push.
name: registry

on:
  schedule:
    # Monday morning UTC. Nothing depends on the hour; it is offset off
    # the hour because everybody's cron fires at :00.
    - cron: "37 6 * * 1"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # PHASE 4'S EXIT GATE, AS CLOSE AS AN AUTOMATED RUN GETS TO IT.
  #
  # The gate is "a stranger with npm, pip and a TTF reproduces the
  # memcard example, and its hardware screenshot, without cloning the
  # repository". This job clones the repository, because the tutorial
  # text has to come from somewhere -- only the COMMANDS come from the
  # registries. So a green run here is necessary for the gate and is
  # not the gate, and the screenshot half needs a PlayStation 2 that no
  # runner has.
  #
  # FOUR ARMS, AND TWO OF THEM HAVE NEVER RUN. macos-14 was the only
  # non-Linux arm and is now deprecated in actions/runner-images, so
  # these jobs had to move regardless; macos-15-intel and
  # windows-2025 ride along on a migration that was not optional.
  #
  # macos-15-intel is the STANDARD Intel runner and is free on a
  # public repository. The `-large` labels are the billed larger
  # runners -- reaching for `macos-15-large` because it is the older
  # spelling of "Intel" is the easy mistake here, and it is a paid
  # one.
  #
  # WHAT THE ARMS SETTLED. Intel and Apple silicon split on 0.8.0's
  # fribidi remedy -- `brew install fribidi` alone was enough on Intel
  # and not on arm64 (run 35809073289) -- and Windows refused until an
  # MSYS2 DLL was on PATH. 0.9.0 (F47) measures through uharfbuzz and
  # needs none of it, and run 35817721457 passed all four arms with
  # nothing but pip and npm. The arms stay because each platform's
  # wheels are separate binaries, and this is where a stranger's
  # install of each is proved.
  #
  # A RED WINDOWS ARM ON THE FIRST DISPATCH IS THE POINT, NOT A
  # REGRESSION. This workflow is schedule/release/dispatch only and
  # gates no pull request -- the header says why -- so an arm that
  # comes back red costs a tick on a weekly run and buys the first
  # measurement anybody has of this platform. Two places to look
  # first, both read off the wheel rather than off a Windows box:
  # `ps2ui_bake/ps2ui.py`'s `layout_command()` resolves `ps2ui-layout`
  # through `shutil.which` and then execs the list, and npm lays down
  # an extensionless POSIX shim beside the `.cmd` on Windows; and
  # `check-tutorial.py` shells out to `sh -e -c`, which needs Git
  # Bash's `sh` on PATH.
  tutorial:
    name: tutorial from the registries (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    # Every step below is POSIX shell, and was written when every arm
    # was. Git Bash rather than pwsh keeps the Windows arm reading the
    # same script as the other three, so a difference in the log is a
    # difference in the PLATFORM and not in the harness.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      # THE TTF THE GATE'S STRANGER BRINGS. The tutorial's premise is a
      # person with a font file, so the font is installed the way a
      # person would rather than vendored.
      - name: A font, where this platform keeps fonts
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq fonts-dejavu-core
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install --cask font-dejavu
          else
            # WINDOWS HAS NO PACKAGE MANAGER STEP IN THE DOCUMENTS, so
            # this arm does what `getting-started/installation` tells a
            # Windows reader to do: fetch DejaVu and put it where fonts
            # go. Per-user rather than C:\Windows\Fonts: it is the
            # candidate `fonts.json` lists for the location a person
            # actually installs into, and it needs no elevation.
            #
            # Nothing here registers the font with Windows, and nothing
            # needs to. ps2ui never asks the OS for a face -- fontgen
            # opens a PATH out of the manifest and hands it to FreeType
            # -- so "installed" here means "the file is where the
            # manifest looks", which is the whole of the requirement.
            #
            # PINNED AT 2.37 WHERE THE OTHER TWO ARMS PIN NOTHING, and
            # the asymmetry is deliberate. This job's header says it
            # pins no package version because the question is what a
            # person gets today. The FONT is not that kind of
            # dependency: the tutorial asserts `115 glyphs, 284 kern
            # pairs`, which are properties of the font file, so an arm
            # on a different DejaVu would go red over a number that is
            # correct. apt's fonts-dejavu-core and brew's cask are both
            # 2.37 today, so this pins to what they already serve --
            # and if they move, this line is what has to move with
            # them.
            ver=2.37
            url="https://github.com/dejavu-fonts/dejavu-fonts/releases/download/version_2_37/dejavu-fonts-ttf-$ver.zip"
            curl -sSfL "$url" -o dejavu.zip
            # python rather than unzip: setup-python already ran, and
            # Git Bash does not reliably carry unzip.
            python -c "import zipfile; zipfile.ZipFile('dejavu.zip').extractall('dejavu')"
            dest="$HOME/AppData/Local/Microsoft/Windows/Fonts"
            mkdir -p "$dest"
            cp "dejavu/dejavu-fonts-ttf-$ver/ttf/DejaVuSans.ttf" "$dest/"
            cp "dejavu/dejavu-fonts-ttf-$ver/ttf/DejaVuSans-Bold.ttf" "$dest/"
          fi
          # WHICH CANDIDATES ACTUALLY EXIST, SO THE NEXT READER DOES
          # NOT HAVE TO INFER IT. Run 1 showed the cask moving
          # DejaVuSans.ttf into ~/Library/Fonts, and PLAN.md then said
          # the other macOS candidates were "absent" -- which was
          # reasoning, not something that run measured. The claim
          # matters: if /Library/Fonts/DejaVuSans.ttf existed, the old
          # ttfs() would have found it and the expanduser fix would not
          # have been load-bearing after all.
          #
          # Run 2: exactly one candidate exists per face, and it is the
          # `~` one. Kept rather than retired, because the answer is
          # about a runner image rather than about this repository --
          # the day a macOS image ships DejaVu somewhere else, this
          # listing is what says so, and the alternative is inferring it
          # again from a green tick.
          # `python`, not `python3`: setup-python puts both on PATH on
          # Linux and macOS, and only `python` on Windows.
          python - <<'PY'
          import json, os
          for face, spec in json.load(open("fonts/fonts.json")).items():
              for cand in spec["ttf"]:
                  full = os.path.expanduser(cand)
                  print("%-8s %-58s %s" % (
                      face, cand, "EXISTS" if os.path.exists(full) else "-"))
          PY

      # No version pin, on purpose. The question this job asks is what
      # a person gets today, not what we last tested.
      - name: Install what a stranger installs
        run: |
          python -m pip install ophtml
          npm install -g @ophtml/layout
          ps2ui --version
          ps2ui-layout --version
          # WHAT WAS INSTALLED, PRINTED, because the index a runner is
          # served can lag a publish: run 35817387412 started minutes
          # after 0.9.0 went up and two of its jobs were handed 0.8.0.
          # The version lines above say which release this run tested.
          python -c "import PIL, uharfbuzz; print('Pillow', PIL.__version__, 'uharfbuzz', uharfbuzz.__version__)"

      - name: The tutorial, against the installed commands
        run: python tools/check-tutorial.py --from-registry

  # A PLAIN PIP INSTALL, AND NOTHING ELSE, ON EACH MAC.
  #
  # Through 0.8.0 this job asserted the opposite: that a plain install
  # on macOS could not generate metrics, because Pillow's Raqm engine
  # needed a fribidi the runner does not have. 0.9.0 (F47) measures
  # through uharfbuzz, and this job now holds the published package to
  # what ci.yml's stock-machines job holds the tree to: the committed
  # tables, from the vendored faces, with nothing else installed.
  # Run 35817721457 was the first to pass it, on both architectures.
  #
  # Both architectures, because their wheels are separate binaries --
  # Pillow's and uharfbuzz's alike -- and a stranger has one or the
  # other.
  macos-plain:
    name: a plain pip install on macOS, and nothing else (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: A plain pip install, and nothing else
        run: python3 -m pip install ophtml
      # A RELEASE FROM BEFORE F47 IS A STALE INDEX, NOT A RESULT. Run
      # 35817387412 began minutes after 0.9.0 was published and pip was
      # served 0.8.0 on both Macs; the old refusal then passed, which
      # measured nothing about 0.9.0. Every release since measures
      # through uharfbuzz, so a module still carrying `_raqm_remedy` is
      # the index lagging, and the job says so rather than failing
      # later in fontgen with a message that blames the machine.
      - name: The installed release measures through uharfbuzz
        run: |
          ps2ui --version
          python3 -c "import sys, ps2ui_bake.fontgen as f; sys.exit('pip installed a release from before F47 (it still carries _raqm_remedy): the index this runner was served lags the latest publish. Re-run later.' if hasattr(f, '_raqm_remedy') else 0)"
          python3 -c "import PIL, platform, sys, uharfbuzz; from PIL import features; print('measured: Pillow %s, uharfbuzz %s, %s/%s, raqm=%s' % (PIL.__version__, uharfbuzz.__version__, sys.platform, platform.machine(), features.check('raqm')))"
      # The committed tables from the vendored faces, byte for byte in
      # every field a build reads: the claim ci.yml's stock-machines
      # job makes about the tree, made here about what a stranger
      # actually downloads.
      - name: A plain pip install runs fontgen, and gets the committed tables
        shell: bash
        run: |
          work="$RUNNER_TEMP/stranger"
          mkdir -p "$work" && cd "$work"
          ps2ui fontgen "$GITHUB_WORKSPACE/fonts/vendor/DejaVuSans.ttf" \
                        "$GITHUB_WORKSPACE/fonts/vendor/DejaVuSans-Bold.ttf"
          python3 - "$GITHUB_WORKSPACE/fonts" <<'PY'
          import json, os, sys
          for name in ("default.metrics.json", "default-bold.metrics.json"):
              got = json.load(open(os.path.join("fonts", name), encoding="utf-8"))
              want = json.load(open(os.path.join(sys.argv[1], name), encoding="utf-8"))
              for key in ("advances", "kerning", "ascent", "descent", "missing"):
                  assert got[key] == want[key], "%s: %s differs from the committed table" % (name, key)
              print("ok - %s on ${{ matrix.os }}: %d glyphs, %d kern pairs, as committed"
                    % (name, len(got["advances"]), len(got["kerning"])))
          PY

  # THE SAME, ON WINDOWS.
  #
  # Through 0.8.0 this job asserted that a stock windows-2025 refused:
  # Pillow's Windows wheel compiles Raqm in and loads fribidi by name at
  # run time, and run 35809073289 measured the refusal. 0.9.0 needs no
  # DLL, and run 35817721457 produced the committed tables here with
  # nothing else installed. It stays the weaker of the two Windows arms
  # on purpose: the tutorial arm needs a chain of things to work, this
  # one needs a single command, so if both go red this one says which
  # half is broken.
  windows-plain:
    name: a plain pip install on Windows, and nothing else
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: A plain pip install, and nothing else
        run: python -m pip install ophtml
      # A RELEASE FROM BEFORE F47 IS A STALE INDEX, NOT A RESULT. Run
      # 35817387412 began minutes after 0.9.0 was published and pip was
      # served 0.8.0 on both Macs; the old refusal then passed, which
      # measured nothing about 0.9.0. Every release since measures
      # through uharfbuzz, so a module still carrying `_raqm_remedy` is
      # the index lagging, and the job says so rather than failing
      # later in fontgen with a message that blames the machine.
      - name: The installed release measures through uharfbuzz
        run: |
          ps2ui --version
          python -c "import sys, ps2ui_bake.fontgen as f; sys.exit('pip installed a release from before F47 (it still carries _raqm_remedy): the index this runner was served lags the latest publish. Re-run later.' if hasattr(f, '_raqm_remedy') else 0)"
          python -c "import PIL, platform, sys, uharfbuzz; from PIL import features; print('measured: Pillow %s, uharfbuzz %s, %s/%s, raqm=%s' % (PIL.__version__, uharfbuzz.__version__, sys.platform, platform.machine(), features.check('raqm')))"
      # The committed tables, as on the Macs above.
      - name: A plain pip install runs fontgen, and gets the committed tables
        shell: bash
        run: |
          work="$RUNNER_TEMP/stranger"
          mkdir -p "$work" && cd "$work"
          ps2ui fontgen "$GITHUB_WORKSPACE/fonts/vendor/DejaVuSans.ttf" \
                        "$GITHUB_WORKSPACE/fonts/vendor/DejaVuSans-Bold.ttf"
          python - "$GITHUB_WORKSPACE/fonts" <<'PY'
          import json, os, sys
          for name in ("default.metrics.json", "default-bold.metrics.json"):
              got = json.load(open(os.path.join("fonts", name), encoding="utf-8"))
              want = json.load(open(os.path.join(sys.argv[1], name), encoding="utf-8"))
              for key in ("advances", "kerning", "ascent", "descent", "missing"):
                  assert got[key] == want[key], "%s: %s differs from the committed table" % (name, key)
              print("ok - %s on windows-2025: %d glyphs, %d kern pairs, as committed"
                    % (name, len(got["advances"]), len(got["kerning"])))
          PY

  # THE CONTRIBUTOR SUITE, ON THE PLATFORM THAT NEVER RAN IT.
  #
  # CONTRIBUTING.md tells a new contributor to run three commands
  # before every PR. Every job that has ever run them is ubuntu, so
  # what they do on a Mac has never been measured -- and a contributor
  # whose first act is running the project's own instructions is the
  # worst person to discover that nobody checks them.
  #
  # SO IT RUNS THOSE THREE COMMANDS VERBATIM AND IN ORDER, which the
  # first version of this job did not, and the difference was not
  # cosmetic. It ran `make -C runtime test` on its own before
  # build.sh, and that target needs ../examples/memcard/build/ui.uib --
  # gitignored, and baked by build.sh. On a fresh checkout, which is
  # what actions/checkout produces:
  #
  #   make: *** No rule to make target '../examples/memcard/build/ui.uib',
  #             needed by 'test-narrow'.  Stop.
  #
  # Permanently red on every platform, for a reason with nothing to do
  # with macOS, and the two steps after it never ran. A job that is
  # always red cannot tell anyone that something started failing.
  #
  # The order was already written down. build.sh:21 is
  # `make -C "$repo/runtime" UIB=".../ui.uib" test` -- the runtime
  # suite comes WITH the documented third command, carrying the blob it
  # just baked. Reordering the instructions is exactly the trip a
  # contributor takes, so this job does not get to reorder them.
  #
  # ONE KNOWN DEFECT IS FIXED BY THE COMMIT THAT ADDS THIS JOB:
  # vendor/gsKit/src/gsTexture.c is verbatim upstream and includes
  # <malloc.h>, a glibc-ism macOS does not have, so `make -C runtime
  # test` died at the include. vendor/host-shim/malloc.h forwards to
  # <stdlib.h>, beside the kernel.h shim that has stood there for the
  # same file since the vendoring landed. That file is compiled by
  # `test` and by nothing else -- syntax-check never touches it -- so
  # build.sh below is what exercises the fix on macOS.
  #
  # A SECOND WAS REPORTED AND NOT REPRODUCED, AND THIS JOB SETTLED IT.
  # The paragraph that stood here said the /var -> /private/var relpath
  # story "has some other cause", because the suite passed under a
  # symlinked TMPDIR on Linux -- all 285 -- and patching project.py on
  # a plausible story would have been a fix for a defect nobody had
  # shown. Refusing to guess was right and the conclusion drawn from it
  # was wrong, in one word: /tmp/link -> /tmp/real is the SAME DEPTH
  # from either side, so the miscount is zero and the probe could only
  # ever come back green. The symlink has to CHANGE the depth.
  #
  # Run 35033142181 printed the failure text this job was built to get:
  # three baker tests, not the six reported, and a fonts.json named
  # with six `../` in front of it. Reproduced on Linux the same day
  # under a depth-changing symlink, fixed in project.py by resolving
  # the root it also chdir's to, and fenced by
  # test_a_project_under_a_depth_changing_symlink_builds.
  #
  # AND A THIRD, WHICH ONLY THIS JOB COULD FIND: the other two failures
  # were PS2UI_REQUIRE_FONTS turning "no Raqm" into an error, on a
  # runner where CONTRIBUTING's `pip install Pillow` is all that ran.
  # macos-plain (through 0.8.0) already knew why -- Raqm is compiled into the
  # wheel and fribidi is not, and this image has no fribidi -- so the
  # gap was in the instructions, which said nothing about it to a Mac
  # reader. The step below is that missing instruction, and it now sits
  # in CONTRIBUTING.md's Setup section where a person will meet it.
  #
  # Not gating a PR: it runs on the schedule and on dispatch, where
  # macos-plain already sits, which is this repository's existing
  # answer to what a macOS runner costs.
  #
  # BOTH ARCHITECTURES. They were added to settle whether `brew install
  # fribidi` alone enabled Raqm on each, and run 35809073289 split
  # them: on macos-15-intel it was enough; on macos-15 (arm64) it was
  # not, and only the source rebuild of Pillow got there -- the worst
  # of the documented routes, on the most common Mac. F47 made the
  # question moot. The arms stay because Pillow, uharfbuzz and clang
  # all ship per-architecture binaries, and a contributor on either
  # kind of Mac runs these instructions.
  macos-contributor-suite:
    name: the contributor instructions, on macOS (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Deps, the way CONTRIBUTING.md describes them
        run: python3 -m pip install Pillow uharfbuzz

      # NO macOS-ONLY STEP ANY MORE. There was one here, `brew install
      # fribidi`, with a source rebuild of Pillow behind it, because
      # fontgen measured through Pillow's Raqm engine and a Mac has no
      # fribidi. F47 moved the measurement to uharfbuzz, whose wheels
      # carry HarfBuzz whole, so CONTRIBUTING's install line above is
      # the whole of the setup on every platform. With
      # PS2UI_REQUIRE_FONTS=1 below, a font test that skipped would be
      # a failure, so the baker suite's green is the proof.
      # NO FONT INSTALL, and that is a measured decision rather than an
      # omission. fonts/fonts.json ends both candidate lists with
      # `vendor/DejaVuSans[-Bold].ttf`, load_font_manifest resolves a
      # relative candidate against the manifest's own directory, and
      # fonts/vendor/ carries both faces in every checkout. So the face
      # is present on macOS with nothing fetched. The first version of
      # this job ran `brew install fontconfig` (a library, not a font)
      # and created ~/.fonts (a Linux convention that appears nowhere
      # in fonts.json), which fetched nothing and was consulted by
      # nothing. PS2UI_REQUIRE_FONTS is what actually enforces the
      # worry that step was reaching for: tests/fonts_available.py
      # turns a skip into a failure, because "a skip that should be
      # impossible is a failure that names itself".
      - name: 1/3 -- layout tests
        run: cd packages/layout && node --test test/*.test.js
      - name: 2/3 -- baker tests
        env:
          PS2UI_REQUIRE_FONTS: "1"
        run: cd packages/baker && python3 -m unittest discover -s tests
      - name: 3/3 -- the example end to end, which runs the runtime suite
        run: ./examples/memcard/build.sh
      # Not one of the three, and worth having anyway: the host syntax
      # check runs whatever clang ships on this image, against a
      # runtime otherwise only ever compiled by ubuntu's gcc and clang.
      - name: ...and the syntax check, under this image's clang
        run: make -C runtime syntax-check
