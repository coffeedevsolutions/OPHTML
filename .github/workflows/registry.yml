# Does the PUBLISHED toolchain work, on a machine that is not ours?
#
# WHY THIS IS A SECOND WORKFLOW AND NOT A JOB IN ci.yml.
#
# ci.yml tests THIS TREE. It runs the tutorial through shims that point
# the five console scripts at the checkout, which is what makes it a
# check of the commit under test. This file tests THE RELEASE: the same
# document, driven by whatever `pip install ophtml` and `npm install -g
# @ophtml/layout` actually hand a stranger.
#
# Those are different subjects and neither replaces the other. Deleting
# the shims from check-tutorial.py to "modernise" it would silently
# swap one for the other, and ci.yml would then be testing the last
# published version instead of the branch in front of it.
#
# AND WHY IT IS NOT ON `push`. A registry job can only ever install
# what is published, so on a pull request it tests the previous
# release no matter what the pull request changes. It cannot gate a
# diff, and running it per-push would spend minutes saying nothing
# about the change. Weekly, on release, and on demand.
#
# It is also the only workflow here that depends on two third-party
# registries and Homebrew being up, which is a second reason to keep it
# out of the path of every push.
name: registry

on:
  schedule:
    # Monday morning UTC. Nothing depends on the hour; it is offset off
    # the hour because everybody's cron fires at :00.
    - cron: "37 6 * * 1"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # PHASE 4'S EXIT GATE, AS CLOSE AS AN AUTOMATED RUN GETS TO IT.
  #
  # The gate is "a stranger with npm, pip and a TTF reproduces the
  # memcard example, and its hardware screenshot, without cloning the
  # repository". This job clones the repository, because the tutorial
  # text has to come from somewhere -- only the COMMANDS come from the
  # registries. So a green run here is necessary for the gate and is
  # not the gate, and the screenshot half needs a PlayStation 2 that no
  # runner has.
  #
  # FOUR ARMS, AND TWO OF THEM HAVE NEVER RUN. macos-14 was the only
  # non-Linux arm and is now deprecated in actions/runner-images, so
  # these jobs had to move regardless; macos-15-intel and
  # windows-2025 ride along on a migration that was not optional.
  #
  # macos-15-intel is the STANDARD Intel runner and is free on a
  # public repository. The `-large` labels are the billed larger
  # runners -- reaching for `macos-15-large` because it is the older
  # spelling of "Intel" is the easy mistake here, and it is a paid
  # one.
  #
  # WHAT EACH NEW ARM IS FOR, because "more platforms" is not a
  # reason. Intel settles a claim this repository has hedged for a
  # cycle: `_raqm_remedy()` leads with "the missing piece is probably
  # fribidi alone", and BOTH macOS wheels name `/usr/local/lib/
  # libfribidi.dylib` -- the INTEL Homebrew prefix -- as their only
  # absolute dlopen candidate. So `brew install fribidi` is more
  # likely to be sufficient on Intel than on the arm64 runner the
  # hedge was written against, and this arm is where that stops being
  # an inference. Windows settles whether the authoring half runs
  # there at all, which nothing has ever asked.
  #
  # A RED WINDOWS ARM ON THE FIRST DISPATCH IS THE POINT, NOT A
  # REGRESSION. This workflow is schedule/release/dispatch only and
  # gates no pull request -- the header says why -- so an arm that
  # comes back red costs a tick on a weekly run and buys the first
  # measurement anybody has of this platform. Two places to look
  # first, both read off the wheel rather than off a Windows box:
  # `ps2ui_bake/ps2ui.py`'s `layout_command()` resolves `ps2ui-layout`
  # through `shutil.which` and then execs the list, and npm lays down
  # an extensionless POSIX shim beside the `.cmd` on Windows; and
  # `check-tutorial.py` shells out to `sh -e -c`, which needs Git
  # Bash's `sh` on PATH.
  tutorial:
    name: tutorial from the registries (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    # Every step below is POSIX shell, and was written when every arm
    # was. Git Bash rather than pwsh keeps the Windows arm reading the
    # same script as the other three, so a difference in the log is a
    # difference in the PLATFORM and not in the harness.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      # THE TTF THE GATE'S STRANGER BRINGS. The tutorial's premise is a
      # person with a font file, so the font is installed the way a
      # person would rather than vendored.
      - name: A font, where this platform keeps fonts
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq fonts-dejavu-core
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install --cask font-dejavu
          else
            # WINDOWS HAS NO PACKAGE MANAGER STEP IN THE DOCUMENTS, so
            # this arm does what `getting-started/installation` tells a
            # Windows reader to do: fetch DejaVu and put it where fonts
            # go. Per-user rather than C:\Windows\Fonts: it is the
            # candidate `fonts.json` lists for the location a person
            # actually installs into, and it needs no elevation.
            #
            # Nothing here registers the font with Windows, and nothing
            # needs to. ps2ui never asks the OS for a face -- fontgen
            # opens a PATH out of the manifest and hands it to FreeType
            # -- so "installed" here means "the file is where the
            # manifest looks", which is the whole of the requirement.
            #
            # PINNED AT 2.37 WHERE THE OTHER TWO ARMS PIN NOTHING, and
            # the asymmetry is deliberate. This job's header says it
            # pins no package version because the question is what a
            # person gets today. The FONT is not that kind of
            # dependency: the tutorial asserts `115 glyphs, 284 kern
            # pairs`, which are properties of the font file, so an arm
            # on a different DejaVu would go red over a number that is
            # correct. apt's fonts-dejavu-core and brew's cask are both
            # 2.37 today, so this pins to what they already serve --
            # and if they move, this line is what has to move with
            # them.
            ver=2.37
            url="https://github.com/dejavu-fonts/dejavu-fonts/releases/download/version_2_37/dejavu-fonts-ttf-$ver.zip"
            curl -sSfL "$url" -o dejavu.zip
            # python rather than unzip: setup-python already ran, and
            # Git Bash does not reliably carry unzip.
            python -c "import zipfile; zipfile.ZipFile('dejavu.zip').extractall('dejavu')"
            dest="$HOME/AppData/Local/Microsoft/Windows/Fonts"
            mkdir -p "$dest"
            cp "dejavu/dejavu-fonts-ttf-$ver/ttf/DejaVuSans.ttf" "$dest/"
            cp "dejavu/dejavu-fonts-ttf-$ver/ttf/DejaVuSans-Bold.ttf" "$dest/"
          fi
          # WHICH CANDIDATES ACTUALLY EXIST, SO THE NEXT READER DOES
          # NOT HAVE TO INFER IT. Run 1 showed the cask moving
          # DejaVuSans.ttf into ~/Library/Fonts, and PLAN.md then said
          # the other macOS candidates were "absent" -- which was
          # reasoning, not something that run measured. The claim
          # matters: if /Library/Fonts/DejaVuSans.ttf existed, the old
          # ttfs() would have found it and the expanduser fix would not
          # have been load-bearing after all.
          #
          # Run 2: exactly one candidate exists per face, and it is the
          # `~` one. Kept rather than retired, because the answer is
          # about a runner image rather than about this repository --
          # the day a macOS image ships DejaVu somewhere else, this
          # listing is what says so, and the alternative is inferring it
          # again from a green tick.
          # `python`, not `python3`: setup-python puts both on PATH on
          # Linux and macOS, and only `python` on Windows.
          python - <<'PY'
          import json, os
          for face, spec in json.load(open("fonts/fonts.json")).items():
              for cand in spec["ttf"]:
                  full = os.path.expanduser(cand)
                  print("%-8s %-58s %s" % (
                      face, cand, "EXISTS" if os.path.exists(full) else "-"))
          PY

      # THE DOCUMENTED macOS REMEDY, RUN AS DOCUMENTED.
      #
      # pip's macOS Pillow wheel ships no Raqm, so ps2ui-fontgen refuses
      # and the tutorial stops at its first command. fontgen prints this
      # remedy; running it here is what keeps the printed remedy true.
      # If Pillow, Homebrew or libraqm move under it, this goes red and
      # the message in fontgen.py is wrong -- which is the only way we
      # would find out, since every other runner in this repository is
      # Linux and never takes that branch.
      #
      # --no-binary pillow, NOT :all:. The bare form source-builds the
      # whole dependency graph, CMake included.
      - name: macOS only, the remedy fontgen prints
        if: runner.os == 'macOS'
        run: |
          brew install libraqm
          export PKG_CONFIG_PATH="$(brew --prefix)/lib/pkgconfig:$(brew --prefix libraqm)/lib/pkgconfig"
          python3 -m pip install --no-binary pillow --force-reinstall pillow
          # A CLEAN BUILD IS NOT PROOF: Pillow builds and exits 0
          # without libraqm and simply omits the feature.
          python3 -c "from PIL import features; assert features.check('raqm'), 'Pillow built without Raqm'"
          # WHICH INTERPRETER THIS LANDED IN, PRINTED RATHER THAN
          # ASSUMED. Run 1 rebuilt Pillow here and then `pip install
          # ophtml` reported it "already satisfied" from
          # /Library/Frameworks/Python.framework/..., which is not this
          # step's own pythonLocation, while check-tutorial resolved the
          # console scripts under hostedtoolcache.
          #
          # RUN 2 ANSWERED IT: one interpreter under two names. `python3`
          # here is the framework Python and NOT the hostedtoolcache one
          # despite pythonLocation naming it, and PATH still resolves
          # ps2ui-fontgen under hostedtoolcache/.../bin. The shebang says
          # one name, PATH says the other, nothing is wrong. Kept because
          # the day that stops being true is the day this line earns its
          # place -- see the consumer half in the install step.
          #
          # THIS IS A DIAGNOSTIC, NOT A FENCE. The fence is block 1,
          # which cannot pass without Raqm in whichever interpreter runs
          # fontgen. If these ever do diverge, the tutorial goes red on
          # its first command and these two lines are what turn a
          # confusing failure into a one-glance one.
          python3 -c "import sys, PIL; print('interpreter:', sys.executable); print('PIL:', PIL.__file__)"

      # WINDOWS ONLY, AND THE FIRST TIME THIS ADVICE HAS BEEN RUN
      # ANYWHERE. `_raqm_remedy()`'s win32 branch was written off the
      # wheel: `_imagingft.cp311-win_amd64.pyd` carries `HAVE_RAQM`,
      # ships no libraqm, and names `fribidi-0` / `libfribidi-0` /
      # `fribidi` as run-time lookups. That is the same shape as the
      # macOS and manylinux binaries, so the same remedy should apply
      # -- SHOULD, from structure, with no Windows box behind it. This
      # step is where that becomes a measurement.
      #
      # MSYS2 rather than conda, of the two routes the message names,
      # because the runner image already carries it and this job is
      # about what a person can reach rather than what we can install.
      # The message names both; a red here means the branch is wrong
      # and the message needs rewriting, which is the good outcome of
      # a job like this one.
      #
      # GITHUB_PATH, not export: the DLL has to be on PATH for the
      # STEPS BELOW, which is where fontgen actually runs. The inline
      # PATH on the check is the same directory, so the diagnostic and
      # the later steps are asking about one file.
      - name: Windows only, the remedy fontgen prints
        if: runner.os == 'Windows'
        run: |
          C:/msys64/usr/bin/pacman -S --noconfirm --needed mingw-w64-x86_64-fribidi
          echo "C:/msys64/mingw64/bin" >> "$GITHUB_PATH"
          ls -l C:/msys64/mingw64/bin/*fribidi* || true
          # A SUCCESSFUL INSTALL IS NOT PROOF, the same rule the macOS
          # branch above is built on: ask Pillow for the FEATURE, not
          # the package manager for its exit status.
          PATH="/c/msys64/mingw64/bin:$PATH" python -c "import PIL, platform, sys; from PIL import features; print('measured: Pillow %s, %s/%s, raqm=%s, fribidi=%s' % (PIL.__version__, sys.platform, platform.machine(), features.check('raqm'), features.check('fribidi')))"

      # No version pin, on purpose. The question this job asks is what
      # a person gets today, not what we last tested.
      - name: Install what a stranger installs
        run: |
          python -m pip install ophtml
          npm install -g @ophtml/layout
          ps2ui --version
          ps2ui-layout --version
          # THE CONSUMER SIDE OF THE ANOMALY THE REMEDY STEP PRINTS.
          #
          # That step reports the interpreter that REBUILT Pillow. The
          # mismatch run 1 recorded is between that one and the
          # interpreter behind the console scripts, and it is the second
          # whose Pillow decides whether block 1 passes. Printing only
          # the first shows one side of a two-sided comparison, so here
          # is the other -- added in review, before it ever ran, because
          # the first version would have answered the wrong half.
          #
          # Run 2 printed both and they agreed: same interpreter, its
          # raqm True. That is the answer for now, not for good, which
          # is why both halves stay.
          #
          # `|| true` on purpose: still a diagnostic, still not a fence.
          # The fence is block 1.
          #
          # SKIPPED ON WINDOWS, because there is no shebang to read: pip
          # lays console scripts down as `.exe` launchers there, so
          # `head -1` would print the first line of a binary and `sed`
          # would hand the `if` a nonsense path. The QUESTION still has
          # an answer on Windows -- which interpreter is behind
          # ps2ui-fontgen -- and the `-m ps2ui_bake.fontgen` line below
          # is that answer, asked of the module rather than the shim.
          if [ "$RUNNER_OS" = "Windows" ]; then
            python -c "import sys, PIL; from PIL import features; print('interpreter:', sys.executable); print('  its PIL: ', PIL.__file__); print('  its raqm:', features.check('raqm'), 'fribidi:', features.check('fribidi'))" || true
          else
            fontgen_bin="$(command -v ps2ui-fontgen)"
            echo "ps2ui-fontgen shebang: $(head -1 "$fontgen_bin")"
            its_python="$(head -1 "$fontgen_bin" | sed 's|^#!||')"
            if [ -x "$its_python" ]; then
              "$its_python" -c "import PIL; from PIL import features; print('  its PIL: ', PIL.__file__); print('  its raqm:', features.check('raqm'))" || true
            fi
          fi

      - name: The tutorial, against the installed commands
        run: python tools/check-tutorial.py --from-registry

  # THE OTHER DIRECTION: IS THE DOCUMENTED FAILURE STILL THE FAILURE?
  #
  # fontgen.py and docs/tutorial-uc3.md both tell a macOS reader that a
  # plain `pip install ophtml` cannot generate metrics. That is a claim
  # about somebody else's build, and the day Pillow ships a macOS wheel
  # with Raqm in it, the claim becomes false and two documents start
  # sending people to fix a problem they do not have.
  #
  # So the absence is asserted rather than assumed. A red here is good
  # news that needs a documentation change, and the message says so.
  #
  # AND IT NOW RUNS ON BOTH ARCHITECTURES, which is the correction the
  # step below has been asking for in prose since it was written. It
  # said "a reading from one runner generalised to a platform, the
  # same defect as in the documents it guards" -- and then kept doing
  # it, because there was one arm. Two arms is the fix; the paragraph
  # was the placeholder.
  macos-plain:
    name: the documented macOS failure is still the failure (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: A plain pip install, and nothing else
        run: python3 -m pip install ophtml
      - name: Raqm is absent on this runner's arch, and fontgen refuses
        run: |
          # SAY WHAT THIS MEASURED, AND DO NOT GENERALISE IT. Each arm
          # tests one machine, and `platform.machine()` is printed
          # below so the log says which -- the failure mode this
          # guards against is a reading from one runner generalised to
          # a platform, the same defect as in the documents it guards.
          #
          # THE TWO ARMS ARE NOT REDUNDANT, and the reason is specific:
          # both macOS wheels name `/usr/local/lib/libfribidi.dylib`
          # as their only ABSOLUTE dlopen candidate, which is the
          # INTEL Homebrew prefix. On Apple silicon that path misses
          # and resolution falls through to the bare name; on Intel it
          # is a direct hit. So the two arms can legitimately disagree
          # about whether a developer Mac has fribidi, and a single
          # arm cannot tell which side it measured.
          #
          # And the thing that varies is not the wheel. Both macOS
          # wheels compile Raqm in and neither bundles fribidi, which
          # Pillow dlopens from the system; this runner has no fribidi
          # and a developer Mac usually does. So fribidi is reported
          # beside raqm -- if this job ever flips, that line says which
          # of the two changed.
          python3 -c "import PIL, platform, sys; from PIL import features; print('measured: Pillow %s, %s/%s, raqm=%s, fribidi=%s' % (PIL.__version__, sys.platform, platform.machine(), features.check('raqm'), features.check('fribidi')))"
          if python3 -c "from PIL import features; raise SystemExit(0 if features.check('raqm') else 1)"; then
            echo "::error::a plain pip install on ${{ matrix.os }} ($(python3 -c 'import platform; print(platform.machine())')) now HAS Raqm."
            echo "That is good news and it makes two documents wrong:"
            echo "  packages/baker/ps2ui_bake/fontgen.py  _raqm_remedy()"
            echo "  docs/tutorial-uc3.md                  the macOS blockquote in section 1"
            echo "Both tell a Mac reader to install fribidi or rebuild Pillow."
            echo "Check the OTHER arm before editing either: if only one flipped,"
            echo "the cause is the runner image's fribidi and not the wheel."
            exit 1
          fi
          echo "ok - no Raqm on ${{ matrix.os }}, as documented"
          # And the refusal is the refusal: exit 2, nothing written.
          set +e
          out=$(ps2ui fontgen /System/Library/Fonts/Helvetica.ttc /System/Library/Fonts/Helvetica.ttc 2>&1)
          rc=$?
          set -e
          echo "$out"
          [ "$rc" -ne 0 ] || { echo "::error::fontgen succeeded without Raqm"; exit 1; }
          case "$out" in
            *"no Raqm layout engine"*) echo "ok - refused, naming Raqm" ;;
            *) echo "::error::refused for some other reason"; exit 1 ;;
          esac
          # AND NOT THE WORDING OF THE REMEDY, DELIBERATELY.
          #
          # The first draft of this job asserted the message contains
          # `brew install libraqm`. That string lands in 0.4.0 and this
          # job installs whatever is PUBLISHED, which is 0.3.0 and says
          # something else -- so the assertion would have failed from
          # the day it merged, on a schedule, for a reason that is not
          # a defect.
          #
          # It is the division of labour this whole file is about, and
          # it caught its own author. The remedy's WORDING is a fact
          # about the tree and is fenced in the tree, by
          # TestFontgenRefusesWithoutRaqm in packages/baker/tests. Its
          # PREMISE -- that a plain pip install on macOS has no Raqm --
          # is a fact about somebody else's build and can only be
          # checked here. Each claim is asserted where it can be true.

  # THE SAME QUESTION, ASKED OF WINDOWS FOR THE FIRST TIME.
  #
  # `_raqm_remedy()` has a win32 branch as of 0.8.0 and it was written
  # off the wheel rather than off a machine: the Windows
  # `_imagingft` carries `HAVE_RAQM`, ships no libraqm, and names
  # `fribidi-0` / `libfribidi-0` / `fribidi` as run-time lookups. From
  # that, a plain `pip install ophtml` on a box with no fribidi DLL
  # should refuse exactly as macOS does.
  #
  # SHOULD. Nobody has run it. This job is the difference between a
  # documented failure and an assumed one, and it is deliberately the
  # weaker of the two Windows arms: the tutorial arm needs a chain of
  # things to work, while this one needs a single refusal, so if both
  # go red this one says which half is broken.
  #
  # A RED HERE MEANS ONE OF TWO THINGS and the message says both,
  # because they need opposite fixes: either Windows Pillow now finds
  # fribidi (documentation is wrong, good news), or the refusal comes
  # out differently on this platform (the win32 branch is wrong).
  windows-plain:
    name: the Windows failure nobody has measured
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: A plain pip install, and nothing else
        run: python -m pip install ophtml
      - name: What this machine actually reports
        run: |
          # PRINTED BEFORE ANYTHING IS ASSERTED, because this is the
          # first run and the reading is the deliverable even if the
          # assertion below turns out to be the wrong one to make.
          python -c "import PIL, platform, sys; from PIL import features; print('measured: Pillow %s, %s/%s, raqm=%s, fribidi=%s' % (PIL.__version__, sys.platform, platform.machine(), features.check('raqm'), features.check('fribidi')))"
      - name: Raqm is absent on a stock Windows box, and fontgen refuses
        run: |
          if python -c "from PIL import features; raise SystemExit(0 if features.check('raqm') else 1)"; then
            echo "::error::a plain pip install on windows-2025 HAS Raqm."
            echo "Nothing in this repository predicted that. It makes two things wrong:"
            echo "  packages/baker/ps2ui_bake/fontgen.py  _raqm_remedy()'s win32 branch"
            echo "  docs/site/reference/compatibility.md  the Windows row"
            echo "Both say a Windows reader has to supply fribidi themselves."
            exit 1
          fi
          echo "ok - no Raqm on a stock windows-2025, as the win32 branch assumes"
          # The refusal is the refusal, and it has to name Raqm rather
          # than fail for some unrelated Windows reason -- a traceback
          # out of a path or an encoding would satisfy a bare `rc != 0`
          # and tell the reader nothing.
          set +e
          out=$(ps2ui fontgen fonts/vendor/DejaVuSans.ttf fonts/vendor/DejaVuSans-Bold.ttf 2>&1)
          rc=$?
          set -e
          echo "$out"
          [ "$rc" -ne 0 ] || { echo "::error::fontgen succeeded without Raqm"; exit 1; }
          case "$out" in
            *"no Raqm layout engine"*) echo "ok - refused, naming Raqm" ;;
            *) echo "::error::refused for some other reason"; exit 1 ;;
          esac
          # AND NOT THE WORDING, for the reason the macOS job above
          # records at length: this installs what is PUBLISHED, the
          # win32 branch ships in 0.8.0, and asserting 0.8.0's wording
          # against a 0.7.0 install would go red on merge for a reason
          # that is not a defect. The wording is fenced in the tree by
          # test_windows_is_told_to_supply_the_dll_and_not_to_rebuild.

  # THE CONTRIBUTOR SUITE, ON THE PLATFORM THAT NEVER RAN IT.
  #
  # CONTRIBUTING.md tells a new contributor to run three commands
  # before every PR. Every job that has ever run them is ubuntu, so
  # what they do on a Mac has never been measured -- and a contributor
  # whose first act is running the project's own instructions is the
  # worst person to discover that nobody checks them.
  #
  # SO IT RUNS THOSE THREE COMMANDS VERBATIM AND IN ORDER, which the
  # first version of this job did not, and the difference was not
  # cosmetic. It ran `make -C runtime test` on its own before
  # build.sh, and that target needs ../examples/memcard/build/ui.uib --
  # gitignored, and baked by build.sh. On a fresh checkout, which is
  # what actions/checkout produces:
  #
  #   make: *** No rule to make target '../examples/memcard/build/ui.uib',
  #             needed by 'test-narrow'.  Stop.
  #
  # Permanently red on every platform, for a reason with nothing to do
  # with macOS, and the two steps after it never ran. A job that is
  # always red cannot tell anyone that something started failing.
  #
  # The order was already written down. build.sh:21 is
  # `make -C "$repo/runtime" UIB=".../ui.uib" test` -- the runtime
  # suite comes WITH the documented third command, carrying the blob it
  # just baked. Reordering the instructions is exactly the trip a
  # contributor takes, so this job does not get to reorder them.
  #
  # ONE KNOWN DEFECT IS FIXED BY THE COMMIT THAT ADDS THIS JOB:
  # vendor/gsKit/src/gsTexture.c is verbatim upstream and includes
  # <malloc.h>, a glibc-ism macOS does not have, so `make -C runtime
  # test` died at the include. vendor/host-shim/malloc.h forwards to
  # <stdlib.h>, beside the kernel.h shim that has stood there for the
  # same file since the vendoring landed. That file is compiled by
  # `test` and by nothing else -- syntax-check never touches it -- so
  # build.sh below is what exercises the fix on macOS.
  #
  # A SECOND WAS REPORTED AND NOT REPRODUCED, AND THIS JOB SETTLED IT.
  # The paragraph that stood here said the /var -> /private/var relpath
  # story "has some other cause", because the suite passed under a
  # symlinked TMPDIR on Linux -- all 285 -- and patching project.py on
  # a plausible story would have been a fix for a defect nobody had
  # shown. Refusing to guess was right and the conclusion drawn from it
  # was wrong, in one word: /tmp/link -> /tmp/real is the SAME DEPTH
  # from either side, so the miscount is zero and the probe could only
  # ever come back green. The symlink has to CHANGE the depth.
  #
  # Run 35033142181 printed the failure text this job was built to get:
  # three baker tests, not the six reported, and a fonts.json named
  # with six `../` in front of it. Reproduced on Linux the same day
  # under a depth-changing symlink, fixed in project.py by resolving
  # the root it also chdir's to, and fenced by
  # test_a_project_under_a_depth_changing_symlink_builds.
  #
  # AND A THIRD, WHICH ONLY THIS JOB COULD FIND: the other two failures
  # were PS2UI_REQUIRE_FONTS turning "no Raqm" into an error, on a
  # runner where CONTRIBUTING's `pip install Pillow` is all that ran.
  # macos-plain above already knew why -- Raqm is compiled into the
  # wheel and fribidi is not, and this image has no fribidi -- so the
  # gap was in the instructions, which said nothing about it to a Mac
  # reader. The step below is that missing instruction, and it now sits
  # in CONTRIBUTING.md's Setup section where a person will meet it.
  #
  # Not gating a PR: it runs on the schedule and on dispatch, where
  # macos-plain already sits, which is this repository's existing
  # answer to what a macOS runner costs.
  #
  # BOTH ARCHITECTURES, for one concrete reason rather than symmetry.
  # The `...including the piece only a Mac needs` step below branches
  # on whether `brew install fribidi` ALONE flips the feature, and
  # logs which branch it took because `_raqm_remedy()` says "probably"
  # there. The two arms are the two sides of that probably: the wheels
  # name `/usr/local/lib/libfribidi.dylib` -- Intel's Homebrew prefix
  # -- as their only absolute candidate, so Intel is where the cheap
  # path is most likely to hold and arm64 is where it is most likely
  # to need the rebuild. One arm could only ever have answered half.
  macos-contributor-suite:
    name: the contributor instructions, on macOS (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Deps, the way CONTRIBUTING.md describes them
        run: python3 -m pip install Pillow

      # THE macOS HALF OF THAT SAME SECTION, AND THE FIRST TIME ANYONE
      # HAS RUN IT. fontgen's _raqm_remedy() leads with "the missing
      # piece is probably fribidi alone", and says "probably" because
      # it was inferred from two opened wheels with no Mac to try it
      # on. This runs it on a Mac. Whichever branch it takes, the log
      # says which -- an inference that is never executed stays an
      # inference no matter how many documents repeat it.
      - name: ...including the piece only a Mac needs
        run: |
          brew install fribidi
          raqm() { python3 -c "from PIL import features; raise SystemExit(0 if features.check('raqm') else 1)"; }
          if raqm; then
            echo "ok - fribidi alone was enough. fontgen.py's \"probably\" is now measured, on $(uname -m)."
          else
            echo "::warning::fribidi alone did NOT enable Raqm on this runner."
            echo "That is the advice _raqm_remedy() leads with, so it needs revisiting."
            brew install libraqm
            export PKG_CONFIG_PATH="$(brew --prefix)/lib/pkgconfig:$(brew --prefix libraqm)/lib/pkgconfig"
            python3 -m pip install --no-binary pillow --force-reinstall pillow
            raqm || { echo "::error::no Raqm even after the rebuild"; exit 1; }
            echo "ok - needed the rebuild, not fribidi"
          fi
          # A SUCCESSFUL INSTALL IS NOT PROOF, which is why every check
          # above asks features.check and not pip's exit status.
          python3 -c "import PIL, platform, sys; from PIL import features; print('measured: Pillow %s, %s/%s, raqm=%s, fribidi=%s' % (PIL.__version__, sys.platform, platform.machine(), features.check('raqm'), features.check('fribidi')))"
      # NO FONT INSTALL, and that is a measured decision rather than an
      # omission. fonts/fonts.json ends both candidate lists with
      # `vendor/DejaVuSans[-Bold].ttf`, load_font_manifest resolves a
      # relative candidate against the manifest's own directory, and
      # fonts/vendor/ carries both faces in every checkout. So the face
      # is present on macOS with nothing fetched. The first version of
      # this job ran `brew install fontconfig` (a library, not a font)
      # and created ~/.fonts (a Linux convention that appears nowhere
      # in fonts.json), which fetched nothing and was consulted by
      # nothing. PS2UI_REQUIRE_FONTS is what actually enforces the
      # worry that step was reaching for: tests/fonts_available.py
      # turns a skip into a failure, because "a skip that should be
      # impossible is a failure that names itself".
      - name: 1/3 -- layout tests
        run: cd packages/layout && node --test test/*.test.js
      - name: 2/3 -- baker tests
        env:
          PS2UI_REQUIRE_FONTS: "1"
        run: cd packages/baker && python3 -m unittest discover -s tests
      - name: 3/3 -- the example end to end, which runs the runtime suite
        run: ./examples/memcard/build.sh
      # Not one of the three, and worth having anyway: the host syntax
      # check runs whatever clang ships on this image, against a
      # runtime otherwise only ever compiled by ubuntu's gcc and clang.
      - name: ...and the syntax check, under this image's clang
        run: make -C runtime syntax-check
