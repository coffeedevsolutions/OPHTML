name: ci

on:
  push:
    branches: [main]
  pull_request:

# The workflows only read the repo; never grant the default write token.
permissions:
  contents: read

# Rapid push series cancel superseded runs instead of queuing them all.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolchain:
    # Same pin as hw.yml, same reason in miniature: the suites' toolchains
    # (node, python) are version-pinned by actions, but the image's
    # system pieces are not, and the two workflows should not drift
    # apart on what "the CI machine" means.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # TAGS, NOT JUST THE COMMIT. check-versions.py's last rule is
          # "a version that is not a prerelease names a tag", and the
          # default shallow checkout fetches none -- which would make
          # the rule fail the day someone cuts a real release, for the
          # wrong reason, and teach whoever hits it to delete the rule.
          fetch-depth: 0

      # Every version claim in the repository, read against the format
      # the code actually writes. They sit in two package manifests,
      # the writer, the runtime header and four documents, and nothing
      # read any of them: the baker shipped __version__ = "0.1.0"
      # beside version = "0.2.0" in its own pyproject, and the CHANGELOG
      # said "format version 5" through two further format breaks.
      # First step in the job because it needs no build and no
      # toolchain -- a disagreement here means the rest of the run is
      # measuring something that does not know what it is.
      #
      # EXCEPT THE TAG RULE, which runs at the end instead. It is the
      # only rule that compares the tree against something the tree
      # cannot contain -- the repository's tag namespace -- and a
      # release commit on a branch cannot satisfy it, because the tag
      # has to name a commit on `main` and squash merges mean the
      # branch commit is not that commit. Cutting 0.3.0 proved the
      # cost: the rule failed here, at step one, and took the whole
      # job with it, so 242 baker tests, both example builds and the
      # tutorial never ran on the commit that cut the release. A cheap
      # check placed first had hidden every expensive check behind it.
      - name: Every version claim agrees (except the tag)
        run: python3 tools/check-versions.py --except-tag

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install baker deps
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          python3 -m pip install Pillow

      - name: Layout tests
        working-directory: packages/layout
        # `npm test`, NOT the command it wraps. Open-coding the runner
        # here meant the package's own documented entry point was never
        # exercised: `npm test` was `node --test test/`, which cannot
        # resolve a bare directory on Node 22, so the one command a
        # developer actually types crashed while CI stayed green. A
        # check that passes because it is not the check anyone runs.
        #
        # The script behind it takes NO argument. Review caught the
        # first fix here: `test/*.test.js` matches one directory level,
        # so a failing test in `test/parse/` was skipped and the suite
        # reported 83/83 green. Bare `node --test` recurses, needs no
        # shell to expand anything, and excludes node_modules by
        # default since Node 18 — which `engines` already requires. The
        # careful glob reasoning that used to sit here is exactly what
        # created that gap, so the argument is gone rather than
        # explained.
        run: npm test

      # The Phase 1 streaming bench. Built here as well as in hw.yml so
      # a change to the layout compiler or the baker that breaks the
      # only blob with streamed slots in it fails on every push, not
      # when someone next sits down at a console with a camera.
      #
      # BEFORE THE BAKER TESTS, NOT NINETY-SIX LINES AFTER THEM. Four
      # TestS7Discriminator tests read this fixture, and with it absent
      # they skipped -- reported as OK -- on every CI run since both
      # existed. Their skip message named this workflow as the reason
      # the skip was safe, which was true of the file and false of the
      # moment. The suite now FAILS rather than skipping when the
      # fixture is missing (unavailable() in test_baker.py), so this
      # step cannot drift back down the file without CI saying so.
      - name: Streaming bench fixture still bakes
        run: |
          python3 tools/make_cover_raw.py --self-test
          ./fixtures/bench-stream/build.sh

      - name: Example builds end to end (includes runtime tests)
        run: ./examples/memcard/build.sh

      # The sample only ever compiled inside the ps2dev container, so a
      # change to the bring-up ELF was a push-and-hope. This runs the
      # same flags on the host, seconds instead of a CI round trip.
      - name: Sample compiles in every build variant
        run: make -C runtime syntax-check

      # AND UNDER A SECOND COMPILER, because for this target's whole
      # life it could not pass under clang at all: `-S` makes clang
      # parse main.c's MIPS inline asm with its integrated assembler
      # and reject `mfc0` on an x86 host. Every runner here is ubuntu
      # with gcc, so the failure was invisible from inside CI while
      # being the first thing a macOS reader meets -- `cc` is clang
      # there. Found by running the exit gate on a Mac, fixed with a
      # probed -fno-integrated-as, and this arm is what keeps it fixed.
      # clang is preinstalled on ubuntu-24.04; nothing is downloaded.
      - name: ...and under clang, which -S used to reject outright
        run: make -C runtime syntax-check CC=clang

      # The channel-6 game browser: two screens, palettized cover art,
      # slots and the feature probe grid. Its check.py asserts the blob's
      # contract, including the scissor depth from ps2ui.h that
      # neither the layout compiler nor the baker knows about.
      - name: Channel-6 browser end to end
        run: ./examples/channel6/build.sh

      # The findings graph. A ledger that is only prose rots like any
      # other document here -- bench-runbook.md stated a disproved
      # claim as fact for weeks with every check green -- so the
      # relationships between findings are data and this enforces them:
      # no confirmed finding may rest on an overturned one, every
      # finding names what would falsify it, and no document may cite a
      # dead belief without marking it historical. --render is checked
      # for drift rather than trusted, since the rendered file is the
      # one people actually read.
      - name: Findings graph is consistent
        run: |
          python3 tools/check-findings.py
          python3 tools/check-findings.py --render
          # Holds vram.alloc_size() to the gsKit function it ports, by
          # compiling the vendored original and diffing 45,000 sizes.
          python3 tools/check-vram-model.py

          git diff --exit-code docs/findings.md

      # Phase 2's environment, and the blob its baseline numbers are
      # taken from. Built here rather than only by hand: the README's
      # measurements, the no-exemption check-blobs rule and the
      # --strict claim are all worth exactly what runs them, and a
      # configured-but-unexecuted check is the shape this project keeps
      # catching. build.sh runs check-blobs on its own blob too; the
      # explicit list below names it as well, so the two invocations
      # cannot drift apart.
      - name: OPL environment end to end
        run: ./examples/opl-env/build.sh

      # A shipped example's README opens "Taken from the blob, not
      # estimated". They were, once. Then a slot was added and three
      # figures drifted through two pull requests and a phase lock,
      # because F-031 names that README as its instrument and nothing
      # read the header back into it.
      #
      # MUST FOLLOW the build above. examples/*/build/ is gitignored,
      # so there is no blob until that step runs -- which is how the
      # first version of this failed CI, having been placed eleven
      # steps too early on a comment that asserted the opposite.
      - name: Baker tests
        working-directory: packages/baker
        # The arena's cross-language check compares Python's
        # hand-modelled GSTEXTURE layout against the real sizeof by
        # compiling the runtime. It used to skip on every CI run --
        # its guard looked for an artifact a LATER step builds, so it
        # printed "skipped" and the suite went green having checked
        # nothing. It now builds what it needs, and this says a skip
        # here is a failure: it is the only tripwire on the vendored
        # gsKit header drifting from what the console compiles against.
        env:
          PS2UI_REQUIRE_CROSSCHECK: "1"
          # AND THE SAME TRIPWIRE FOR THE EXAMPLE BLOBS. test_serve.py
          # reads the shipped blobs, and this step used to run BEFORE
          # the three builds below -- so twenty of its twenty-one tests
          # skipped in CI and the suite went green having checked none
          # of the state machine. The step moved below the builds; this
          # makes moving it back a loud failure rather than a quiet
          # skip, which is the failure mode the comment above already
          # describes happening once.
          PS2UI_REQUIRE_EXAMPLES: "1"
        run: python3 -m unittest discover -s tests -v


      - name: Example figures match their blobs
        run: python3 tools/check-example-figures.py

      # P3d's content sweep is the x-axis of the next bench sitting,
      # and it is written down in two documents before the sitting so
      # that it scores a prediction rather than producing one. #87 put
      # a build tag on the readout's line 1 so the photographs would
      # document themselves; the tag is slot text, so its glyphs land
      # in `g`, and every row of both tables went 10-11 short in the
      # same pull request that added it -- on a comment arguing the
      # tag was "a constant across the sweep".
      #
      # Derived, not restated: commands and the focus-resolved `drawn`
      # come off the blob, the tag off main.c, and the one number that
      # cannot be derived is stated in bench-phase2.md and read back.
      # MUST FOLLOW the opl-env build above, for the same reason the
      # step before it must.
      - name: The P3d sweep table is derived from the blob
        run: python3 tools/check-sweep-table.py

      # The tutorial, executed as a stranger would: every ```sh block
      # in order, in one scratch directory, from empty. Phase 4's exit
      # gate is a person with npm, pip and a TTF reproducing an
      # example, and a tutorial nobody re-runs is a document that was
      # true the day it was written -- which is the failure this
      # repository has closed for example figures, PLAN's prose, the
      # sweep table and every version claim in the tree.
      #
      # It does NOT prove the packages install: nothing is published,
      # so the CLI names resolve through shims onto the checkout. That
      # gap IS the exit gate, and the tutorial says so itself.
      # The deployment guide is mostly hardware and mostly cannot run
      # here, which is what its [bench]/[practice] markers are for. The
      # parts that ARE derivable from this tree are: the four status
      # fills are literals in runtime/sample/main.c and were written out
      # by hand in two documents, and the build flags it tells a reader
      # to type have to exist in the Makefile. Needs no toolchain and no
      # build, and is clean-checkout safe, so it has no ordering
      # dependency on the example builds.
      - name: The deployment guide matches the source it describes
        run: python3 tools/check-deploying.py

      - name: The tutorial still works from an empty directory
        run: python3 tools/check-tutorial.py

      # The scoping fixture is Phase 1 input and its only value is
      # being comparable later, so the number it reports is a
      # tripwire: if an OPL-class screen starts demanding a different
      # slot count, CI says so rather than the README quietly aging.
      - name: UC-3 scoping fixture still demands what the README says
        run: ./fixtures/opl-scope/measure.sh

      # The example builds refresh the committed screenshots, so if a
      # renderer change lands without rebuilding the examples, the drift
      # shows up here rather than living in the README forever.
      - name: Committed screenshots match the renderer
        # A block scalar, NOT a plain one. YAML folds a plain scalar's
        # continuation lines into a single line and keeps the
        # backslashes as literal characters, so bash reads "\ " as an
        # escaped space and the next path arrives with a leading space:
        # `fatal:  examples/channel6/screenshots: no such path`. This
        # step caught its own formatting on the run that added it.
        run: |
          git diff --exit-code examples/memcard/screenshots \
                               examples/channel6/screenshots \
                               examples/opl-env/screenshots

      - name: Test card still tests what its reading table claims
        run: |
          python3 tools/make_testcard.py --self-test
          # And the reader that grades it. Its first version called an
          # all-grey card CRISP, because with no variation anywhere the
          # ratio it judged by had a zero denominator -- caught by this
          # self-test, which is the argument for having one.
          python3 tools/read_testcard.py --self-test

      - name: Generated assets match their generators
        run: |
          # swizzle.png is the step 3 instrument and its meaning lives
          # in exact index values, so a hand-edit or a stale checkout
          # would change what the cell tests with nothing to say so.
          # The test card has make_testcard.py run over it already;
          # this asset had no such tie until it drifted once.
          python3 tools/make_swizzle_tile.py examples/channel6/ui/assets/swizzle.png
          git diff --exit-code examples/channel6/ui/assets/swizzle.png

      # check.py asserts what these particular blobs promise (their focus
      # names, slot capacities, screen order). ps2ui-check asserts what
      # *any* blob owes the runtime, so it covers the 16:9 bake and the
      # memcard example too. The two overlap on the table counts by design:
      # one reads the file, the other reads what the baker wrote.
      - name: Validate every blob against the runtime's assumptions
        # Which warnings each blob may carry, and how many, live in the
        # script -- not here. Spelled out per workflow they drifted:
        # hw.yml checked the channel-6 blob with no flags while this
        # file checked the same bytes with --allow-dead 1 --strict.
        #
        # Named, not bare. A bare call skips blobs that are absent,
        # which is right for hw.yml (it does not bake the 16:9 one) and
        # wrong here: this job bakes all three, so a missing one is a
        # build failure, and skipping it would leave "3 blob(s)
        # validated" as the only trace of a blob that stopped existing.
        # Naming them makes absence an error.
        #
        # Three, not four: the test card is baked by hw.yml. Here
        # make_testcard.py only runs --self-test, which writes no blob.
        run: |
          ./tools/check-blobs.sh \
            examples/memcard/build/ui.uib \
            examples/opl-env/build/ui.uib \
            examples/channel6/build/ui.uib \
            examples/channel6/build/ui-16x9.uib

      - name: Upload previews
        uses: actions/upload-artifact@v7
        with:
          name: memcard-previews
          retention-days: 14
          path: |
            examples/memcard/build/preview.png
            examples/memcard/build/states.png

      - name: Upload channel-6 previews
        uses: actions/upload-artifact@v7
        with:
          name: channel6-previews
          retention-days: 14
          path: |
            examples/channel6/build/preview.png
            examples/channel6/build/states.png
            examples/channel6/build/probe.png
            examples/channel6/build/probe-states.png

      # THE AUTHORITATIVE RUN, unflagged, after every check it could
      # otherwise have masked. The early step is a strict subset of
      # this one, so a rule added to check-versions.py later is
      # covered here whatever `--except-tag` skips -- the flag can
      # only subtract from a run the verdict does not come from.
      - name: Every version claim agrees, the tag rule included
        run: python3 tools/check-versions.py
