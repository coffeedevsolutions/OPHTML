name: ci

on:
  push:
    branches: [main]
  pull_request:

# The workflows only read the repo; never grant the default write token.
permissions:
  contents: read

# Rapid push series cancel superseded runs instead of queuing them all.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolchain:
    # Same pin as hw.yml, same reason in miniature: the suites' toolchains
    # (node, python) are version-pinned by actions, but the image's
    # system pieces are not, and the two workflows should not drift
    # apart on what "the CI machine" means.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install baker deps
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          python3 -m pip install Pillow

      - name: Layout tests
        working-directory: packages/layout
        # Unquoted so the shell expands the glob — Node itself only
        # learned to glob --test arguments after Node 20.
        run: node --test test/*.test.js

      - name: Baker tests
        working-directory: packages/baker
        # The arena's cross-language check compares Python's
        # hand-modelled GSTEXTURE layout against the real sizeof by
        # compiling the runtime. It used to skip on every CI run --
        # its guard looked for an artifact a LATER step builds, so it
        # printed "skipped" and the suite went green having checked
        # nothing. It now builds what it needs, and this says a skip
        # here is a failure: it is the only tripwire on the vendored
        # gsKit header drifting from what the console compiles against.
        env:
          PS2UI_REQUIRE_CROSSCHECK: "1"
        run: python3 -m unittest discover -s tests -v

      - name: Example builds end to end (includes runtime tests)
        run: ./examples/memcard/build.sh

      # The sample only ever compiled inside the ps2dev container, so a
      # change to the bring-up ELF was a push-and-hope. This runs the
      # same flags on the host, seconds instead of a CI round trip.
      - name: Sample compiles in every build variant
        run: make -C runtime syntax-check

      # The channel-6 game browser: two screens, palettized cover art,
      # slots and the feature probe grid. Its check.py asserts the blob's
      # contract, including the scissor depth from ps2ui.h that
      # neither the layout compiler nor the baker knows about.
      - name: Channel-6 browser end to end
        run: ./examples/channel6/build.sh

      # The scoping fixture is Phase 1 input and its only value is
      # being comparable later, so the number it reports is a
      # tripwire: if an OPL-class screen starts demanding a different
      # slot count, CI says so rather than the README quietly aging.
      - name: UC-3 scoping fixture still demands what the README says
        run: ./fixtures/opl-scope/measure.sh

      # The example builds refresh the committed screenshots, so if a
      # renderer change lands without rebuilding the examples, the drift
      # shows up here rather than living in the README forever.
      - name: Committed screenshots match the renderer
        run: git diff --exit-code examples/memcard/screenshots examples/channel6/screenshots

      - name: Test card still tests what its reading table claims
        run: |
          python3 tools/make_testcard.py --self-test
          # And the reader that grades it. Its first version called an
          # all-grey card CRISP, because with no variation anywhere the
          # ratio it judged by had a zero denominator -- caught by this
          # self-test, which is the argument for having one.
          python3 tools/read_testcard.py --self-test

      - name: Generated assets match their generators
        run: |
          # swizzle.png is the step 3 instrument and its meaning lives
          # in exact index values, so a hand-edit or a stale checkout
          # would change what the cell tests with nothing to say so.
          # The test card has make_testcard.py run over it already;
          # this asset had no such tie until it drifted once.
          python3 tools/make_swizzle_tile.py examples/channel6/ui/assets/swizzle.png
          git diff --exit-code examples/channel6/ui/assets/swizzle.png

      # check.py asserts what these particular blobs promise (their focus
      # names, slot capacities, screen order). ps2ui-check asserts what
      # *any* blob owes the runtime, so it covers the 16:9 bake and the
      # memcard example too. The two overlap on the table counts by design:
      # one reads the file, the other reads what the baker wrote.
      - name: Validate every blob against the runtime's assumptions
        # Which warnings each blob may carry, and how many, live in the
        # script -- not here. Spelled out per workflow they drifted:
        # hw.yml checked the channel-6 blob with no flags while this
        # file checked the same bytes with --allow-dead 1 --strict.
        #
        # Named, not bare. A bare call skips blobs that are absent,
        # which is right for hw.yml (it does not bake the 16:9 one) and
        # wrong here: this job bakes all three, so a missing one is a
        # build failure, and skipping it would leave "3 blob(s)
        # validated" as the only trace of a blob that stopped existing.
        # Naming them makes absence an error.
        #
        # Three, not four: the test card is baked by hw.yml. Here
        # make_testcard.py only runs --self-test, which writes no blob.
        run: |
          ./tools/check-blobs.sh \
            examples/memcard/build/ui.uib \
            examples/channel6/build/ui.uib \
            examples/channel6/build/ui-16x9.uib

      - name: Upload previews
        uses: actions/upload-artifact@v7
        with:
          name: memcard-previews
          retention-days: 14
          path: |
            examples/memcard/build/preview.png
            examples/memcard/build/states.png

      - name: Upload channel-6 previews
        uses: actions/upload-artifact@v7
        with:
          name: channel6-previews
          retention-days: 14
          path: |
            examples/channel6/build/preview.png
            examples/channel6/build/states.png
            examples/channel6/build/probe.png
            examples/channel6/build/probe-states.png
