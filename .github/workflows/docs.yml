# Build the documentation site from docs/site/ with MkDocs and publish it
# to GitHub Pages. Everything generator-specific lives under website/;
# see website/README.md for how to run it locally.
#
# Pull requests that touch the site build it with --strict and stop
# there. Pushes to main build and deploy. One-time repository setting
# required before the first deploy succeeds: Settings > Pages > Source
# set to "GitHub Actions".
name: docs

on:
  push:
    branches: [main]
    paths:
      - docs/site/**
      - website/**
      - tools/check-site-pages.py
      - tools/check-doc-versions.py
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/site/**
      - website/**
      - tools/check-site-pages.py
      - tools/check-doc-versions.py
      - .github/workflows/docs.yml
  workflow_dispatch:

# The build job only reads the repository. The deploy job asks for the
# two Pages permissions itself, so ci.yml's rule of never granting the
# default write token holds here too.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    concurrency:
      group: docs-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: website/requirements.txt

      - run: pip install -r website/requirements.txt

      # The same gate ci.yml runs: every page: link names a page and a
      # heading, every repo: link names a file, every pinned line still
      # reads what _citations.tsv recorded. The build pins repo: links
      # to this commit, so this is what makes those pins true.
      - name: Documentation site pages resolve and cite what they claim
        run: python3 tools/check-site-pages.py

      - name: Every version a document prints is one something prints
        run: python3 tools/check-doc-versions.py

      - name: Build the site
        env:
          OPHTML_DOCS_REF: ${{ github.sha }}
        run: mkdocs build --strict -f website/mkdocs.yml

      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

  # Only main publishes. workflow_dispatch carries no branch restriction
  # of its own, so without the ref test a manual run from any branch
  # would put that branch on the live site.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Never cancel a deploy in flight; let the newer one queue behind it.
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
